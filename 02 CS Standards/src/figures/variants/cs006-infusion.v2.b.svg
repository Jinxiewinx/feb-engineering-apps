<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="Inter">
  <!-- CS-006 Figure 1, variant b (brief B: rethink). The loop in section,
       read left to right pot -> bag -> trap -> pump, then the drop-test gate
       as a step strip, because "no pass, no resin" is the rule people break.
       Facts from CS-006 Rev D §7.2-7.5. Grayscale: tubes heavy solid, bag
       medium solid, mesh as a grid pattern, the go box solid dark, the
       fail box dashed and hollow. -->
  <rect width="1000" height="960" fill="#ffffff"/>
  <defs>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ffffff"/>
      <path d="M0 5 H10 M5 0 V10" stroke="#141d2b" stroke-width="1.2"/>
    </pattern>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#141d2b"/>
    </marker>
    <marker id="ahb" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#003262"/>
    </marker>
    <marker id="ahbs" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M12,0 L0,5 L12,10 z" fill="#003262"/>
    </marker>
  </defs>

  <text x="20" y="50" font-family="Saira" font-size="34" font-weight="600" fill="#003262">Infusion loop, pot to pump</text>

  <!-- ===== resin pot ===== -->
  <path d="M 40 300 L 48 400 L 132 400 L 140 300" fill="none" stroke="#141d2b" stroke-width="3"/>
  <path d="M 42.4 330 L 137.6 330 L 132 400 L 48 400 Z" fill="#FDB515" stroke="none"/>
  <path d="M 40 300 L 48 400 L 132 400 L 140 300" fill="none" stroke="#141d2b" stroke-width="3"/>
  <text x="90" y="436" text-anchor="middle" font-size="24" font-weight="700" fill="#141d2b">resin pot</text>
  <text x="90" y="464" text-anchor="middle" font-size="22" fill="#141d2b">line end</text>
  <text x="90" y="490" text-anchor="middle" font-size="22" fill="#141d2b">under resin</text>

  <!-- inlet tube, pot to IN -->
  <path d="M 100 392 L 100 212 Q 100 200 112 200 L 243 200 Q 255 200 255 212 L 255 418" fill="none" stroke="#141d2b" stroke-width="5"/>
  <rect x="176" y="184" width="18" height="32" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="185" y="172" text-anchor="middle" font-size="22" fill="#141d2b">clamp</text>

  <!-- ===== mold and stack ===== -->
  <rect x="190" y="470" width="520" height="70" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5"/>
  <text x="450" y="514" text-anchor="middle" font-size="24" fill="#141d2b">sealed, released mold (CS-004)</text>

  <rect x="300" y="434" width="300" height="36" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="450" y="460" text-anchor="middle" font-size="22" fill="#141d2b">dry stack</text>
  <rect x="290" y="426" width="320" height="8" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="290" y="410" width="240" height="16" fill="url(#mesh)" stroke="#141d2b" stroke-width="1.5"/>

  <!-- tacky tape -->
  <rect x="200" y="456" width="24" height="14" fill="#141d2b"/>
  <rect x="676" y="456" width="24" height="14" fill="#141d2b"/>

  <!-- bag -->
  <path d="M 212 456 C 212 398 232 380 282 380 L 618 380 C 668 380 688 398 688 456" fill="none" stroke="#141d2b" stroke-width="3"/>
  <text x="708" y="414" font-size="22" fill="#141d2b">VB160 bag</text>
  <line x1="704" y1="408" x2="684" y2="418" stroke="#141d2b" stroke-width="1.5"/>

  <!-- ports -->
  <circle cx="255" cy="442" r="28" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="255" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#141d2b">IN</text>
  <circle cx="645" cy="442" r="28" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="645" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#141d2b">OUT</text>

  <!-- flow mesh label -->
  <text x="290" y="350" font-size="22" fill="#141d2b">flow mesh</text>
  <line x1="330" y1="357" x2="330" y2="412" stroke="#141d2b" stroke-width="1.5"/>

  <!-- mesh break -->
  <line x1="530" y1="388" x2="530" y2="412" stroke="#003262" stroke-width="1.5"/>
  <line x1="600" y1="388" x2="600" y2="434" stroke="#003262" stroke-width="1.5"/>
  <line x1="532" y1="397" x2="598" y2="397" stroke="#003262" stroke-width="2" marker-start="url(#ahbs)" marker-end="url(#ahb)"/>
  <text x="622" y="300" text-anchor="end" font-size="24" font-weight="700" fill="#003262">mesh stops 30–50 mm</text>
  <text x="622" y="328" text-anchor="end" font-size="24" font-weight="700" fill="#003262">short of OUT</text>
  <line x1="565" y1="336" x2="565" y2="392" stroke="#003262" stroke-width="1.5"/>

  <!-- outlet tube, OUT to trap -->
  <path d="M 645 418 L 645 212 Q 645 200 657 200 L 720 200" fill="none" stroke="#141d2b" stroke-width="5"/>

  <!-- ===== trap, valve, pump, gauge ===== -->
  <rect x="720" y="150" width="110" height="130" rx="10" fill="#ffffff" stroke="#003262" stroke-width="5"/>
  <text x="775" y="226" text-anchor="middle" font-family="Saira" font-size="30" font-weight="700" fill="#003262">TRAP</text>
  <text x="775" y="314" text-anchor="middle" font-size="22" font-weight="700" fill="#003262">never bag →</text>
  <text x="775" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#003262">pump direct</text>

  <line x1="775" y1="150" x2="775" y2="126" stroke="#141d2b" stroke-width="3"/>
  <circle cx="775" cy="100" r="26" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <line x1="775" y1="100" x2="788" y2="82" stroke="#141d2b" stroke-width="3"/>
  <text x="738" y="108" text-anchor="end" font-size="22" fill="#141d2b">gauge, inHg</text>

  <line x1="830" y1="230" x2="895" y2="230" stroke="#141d2b" stroke-width="5"/>
  <path d="M 850 216 L 874 244 L 874 216 L 850 244 Z" fill="#141d2b"/>
  <text x="866" y="186" text-anchor="middle" font-size="22" fill="#141d2b">valve</text>
  <rect x="895" y="195" width="90" height="70" rx="6" fill="#dde3ec" stroke="#141d2b" stroke-width="3"/>
  <text x="940" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#141d2b">pump</text>

  <!-- under the mold -->
  <text x="255" y="574" text-anchor="middle" font-size="22" fill="#141d2b">IN spiral on the flange</text>
  <line x1="255" y1="552" x2="255" y2="472" stroke="#141d2b" stroke-width="1.5"/>
  <text x="728" y="574" font-size="22" fill="#141d2b">tacky tape,</text>
  <text x="728" y="600" font-size="22" fill="#141d2b">whole perimeter</text>
  <line x1="724" y1="566" x2="692" y2="472" stroke="#141d2b" stroke-width="1.5"/>

  <line x1="255" y1="604" x2="255" y2="626" stroke="#003262" stroke-width="2"/>
  <line x1="645" y1="604" x2="645" y2="626" stroke="#003262" stroke-width="2"/>
  <line x1="257" y1="615" x2="643" y2="615" stroke="#003262" stroke-width="3" marker-end="url(#ahb)"/>
  <text x="450" y="654" text-anchor="middle" font-size="24" font-weight="700" fill="#003262">inlet to outlet: 0.5 m max</text>
  <text x="450" y="682" text-anchor="middle" font-size="22" fill="#515f74">longer part: more feeds, planned on the WO</text>

  <!-- ===== the gate ===== -->
  <line x1="20" y1="712" x2="980" y2="712" stroke="#dde3ec" stroke-width="2"/>
  <text x="20" y="748" font-family="Saira" font-size="28" font-weight="600" fill="#003262">Before any resin is mixed</text>

  <rect x="20" y="768" width="200" height="80" rx="8" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="120" y="801" text-anchor="middle" font-size="24" fill="#141d2b">Pull vacuum</text>
  <text x="120" y="830" text-anchor="middle" font-size="24" font-weight="700" fill="#141d2b">to ≥ 27 inHg</text>
  <line x1="222" y1="808" x2="266" y2="808" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="270" y="768" width="200" height="80" rx="8" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="370" y="801" text-anchor="middle" font-size="24" fill="#141d2b">Close valve,</text>
  <text x="370" y="830" text-anchor="middle" font-size="24" font-weight="700" fill="#141d2b">wait 10 min</text>
  <line x1="472" y1="808" x2="516" y2="808" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="520" y="768" width="200" height="80" rx="8" fill="#ffffff" stroke="#141d2b" stroke-width="5"/>
  <text x="620" y="801" text-anchor="middle" font-size="24" fill="#141d2b">Lost</text>
  <text x="620" y="830" text-anchor="middle" font-size="24" font-weight="700" fill="#141d2b">≤ 1 inHg?</text>

  <line x1="722" y1="808" x2="766" y2="808" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="744" y="796" text-anchor="middle" font-size="22" font-weight="700" fill="#141d2b">yes</text>
  <rect x="770" y="768" width="210" height="80" rx="8" fill="#003262" stroke="#003262" stroke-width="3"/>
  <text x="875" y="801" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Mix resin</text>
  <text x="875" y="830" text-anchor="middle" font-size="22" fill="#ffffff">100:30 by weight</text>

  <line x1="620" y1="850" x2="620" y2="878" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="632" y="872" font-size="22" font-weight="700" fill="#141d2b">no</text>
  <rect x="520" y="880" width="200" height="66" rx="8" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="620" y="908" text-anchor="middle" font-size="22" fill="#141d2b">Hunt leaks,</text>
  <text x="620" y="934" text-anchor="middle" font-size="22" fill="#141d2b">test again</text>
  <path d="M 518 913 L 120 913 L 120 852" fill="none" stroke="#141d2b" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ah)"/>
</svg>
