<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" font-family="Inter" font-size="22" fill="#141d2b">
  <!-- CS-007 §7.4: the wet-layup bag in section (v2, variant a).
       Faithful redraw of cs007-bag-stack. The rule drawn large: the breather
       covers the peel ply but is held back from every part edge.
       Grayscale: mold hollow with heavy outline, laminate solid light fill,
       peel ply hollow thin, breather ringed pattern, tape solid black, trap
       heaviest outline. The release-film / caul alternative sits in a dashed
       box because it is a "may", still under test. -->
  <defs>
    <pattern id="c7breath" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ffffff"/>
      <circle cx="5" cy="5" r="3" fill="none" stroke="#515f74" stroke-width="1.3"/>
    </pattern>
    <marker id="c7arr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 z" fill="#003262"/>
    </marker>
    <marker id="c7arrs" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11,0 L0,5 L11,10 z" fill="#003262"/>
    </marker>
  </defs>
  <rect width="1000" height="790" fill="#ffffff"/>

  <!-- bag label -->
  <text x="390" y="50" text-anchor="middle">VB160 bag, pleated at corners and every 300–400 mm</text>
  <text x="390" y="78" text-anchor="middle">of curved perimeter (CS-006 §7.3 rules apply)</text>
  <line x1="330" y1="88" x2="330" y2="278" stroke="#515f74" stroke-width="1.5"/>

  <!-- mold / plate / core -->
  <rect x="70" y="420" width="640" height="84" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="390" y="456" text-anchor="middle" font-weight="600">mold, plate or shaped foam core</text>
  <text x="390" y="486" text-anchor="middle" fill="#515f74">(CS-004 prep where it applies)</text>

  <!-- wet laminate -->
  <rect x="170" y="378" width="440" height="42" fill="#dde3ec" stroke="#141d2b" stroke-width="1.5"/>
  <text x="390" y="407" text-anchor="middle">wet laminate, ply by ply per WO</text>

  <!-- peel ply: full laminate, past its edges -->
  <rect x="148" y="365" width="484" height="13" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>

  <!-- breather: held back from every part edge -->
  <rect x="222" y="335" width="336" height="30" fill="url(#c7breath)" stroke="#141d2b" stroke-width="2"/>

  <!-- edge gaps, both sides -->
  <line x1="170" y1="300" x2="170" y2="378" stroke="#003262" stroke-width="1.5"/>
  <line x1="222" y1="300" x2="222" y2="335" stroke="#003262" stroke-width="1.5"/>
  <line x1="172" y1="310" x2="220" y2="310" stroke="#003262" stroke-width="2" marker-start="url(#c7arrs)" marker-end="url(#c7arr)"/>
  <line x1="558" y1="300" x2="558" y2="335" stroke="#003262" stroke-width="1.5"/>
  <line x1="610" y1="300" x2="610" y2="378" stroke="#003262" stroke-width="1.5"/>
  <line x1="560" y1="310" x2="608" y2="310" stroke="#003262" stroke-width="2" marker-start="url(#c7arrs)" marker-end="url(#c7arr)"/>
  <text x="30" y="214" font-weight="700" fill="#003262">gap at every</text>
  <text x="30" y="241" font-weight="700" fill="#003262">part edge</text>
  <line x1="120" y1="250" x2="190" y2="304" stroke="#003262" stroke-width="1.5"/>

  <!-- bag + pleats -->
  <path d="M 92 408 C 96 330, 140 292, 210 290 L 570 290 C 640 292, 684 330, 688 408" fill="none" stroke="#141d2b" stroke-width="3"/>
  <path d="M 300 290 l 10 -16 l 10 16" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <path d="M 420 290 l 10 -16 l 10 16" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>

  <!-- tacky tape -->
  <rect x="80" y="406" width="24" height="14" fill="#141d2b"/>
  <rect x="676" y="406" width="24" height="14" fill="#141d2b"/>

  <!-- vacuum port on the breather, line to trap -->
  <rect x="496" y="318" width="40" height="17" fill="#dde3ec" stroke="#141d2b" stroke-width="2"/>
  <path d="M 516 318 V 200 Q 516 160 556 160 H 790" fill="none" stroke="#141d2b" stroke-width="3"/>
  <rect x="790" y="112" width="160" height="96" rx="8" fill="#ffffff" stroke="#003262" stroke-width="5"/>
  <text x="870" y="152" text-anchor="middle" font-weight="700" font-size="24" fill="#003262">TRAP</text>
  <text x="870" y="184" text-anchor="middle">then pump</text>

  <!-- right callouts -->
  <line x1="558" y1="345" x2="728" y2="262" stroke="#515f74" stroke-width="1.5"/>
  <text x="736" y="258"><tspan font-weight="700" fill="#003262">breather:</tspan> held back</text>
  <text x="736" y="285">from every part edge</text>
  <text x="736" y="312">it could bond to</text>

  <line x1="632" y1="371" x2="728" y2="372" stroke="#515f74" stroke-width="1.5"/>
  <text x="736" y="368"><tspan font-weight="700" fill="#003262">peel ply:</tspan> over the</text>
  <text x="736" y="395">full laminate, past</text>
  <text x="736" y="422">its edges</text>

  <!-- numbers strip -->
  <rect x="20" y="540" width="960" height="112" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <text x="40" y="574"><tspan font-weight="700">Vacuum:</tspan> ≥25 inHg. <tspan font-weight="700">Drop test</tspan> before you walk away: ≤2 inHg lost in 10 min.</text>
  <text x="40" y="606">Write both readings in the note on “Wet layup and bag” (§7.5).</text>
  <text x="40" y="638">A light foam core dents: reduce vacuum, record the level that held.</text>

  <!-- the may: alternative to peel ply, under test -->
  <rect x="20" y="672" width="960" height="100" fill="#ffffff" stroke="#141d2b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="40" y="706"><tspan font-weight="700">Where the WO says so (under test, 2026-09):</tspan> release film (A4000R) or</text>
  <text x="40" y="734">mylar in place of the peel ply, or a caul plate over it. Record which one</text>
  <text x="40" y="762">on the WO and photograph the finished surface (§7.4 step 4).</text>
</svg>
