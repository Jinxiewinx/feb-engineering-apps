<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" font-family="Inter" fill="#141d2b">
  <!-- CS-012 §7.1 one purchase on two tracks, v2 (brief A). Status names from
       app/budget.js BUY_STATUS and REIMB_STATUS. Goods: solid line, filled
       nodes. Money: dashed line, hollow dashed nodes. Gate: heavy bar. -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="940" fill="#ffffff"/>

  <!-- the purchase -->
  <rect x="15" y="20" width="970" height="70" rx="10" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5"/>
  <text x="35" y="64" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="700" fill="#003262">BUY-SN6-###</text>
  <text x="260" y="63" font-size="22">one purchase: + New Purchase in Budget; REQ number in Notes</text>

  <!-- track headings -->
  <text x="15" y="146" font-family="Saira" font-size="26" font-weight="700" fill="#003262">THE GOODS</text>
  <text x="15" y="176" font-size="22">Order status</text>
  <line x1="15" y1="196" x2="150" y2="196" stroke="#003262" stroke-width="6"/>
  <text x="985" y="146" font-family="Saira" font-size="26" font-weight="700" fill="#003262" text-anchor="end">THE MONEY</text>
  <text x="985" y="176" font-size="22" text-anchor="end">Reimbursement</text>
  <line x1="850" y1="196" x2="985" y2="196" stroke="#141d2b" stroke-width="6" stroke-dasharray="14 9"/>

  <!-- /purchase -->
  <rect x="330" y="118" width="340" height="94" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="500" y="154" font-family="ui-monospace, Menlo, monospace" font-size="24" font-weight="700" text-anchor="middle">/purchase</text>
  <text x="500" y="190" font-size="22" text-anchor="middle">in <tspan font-family="ui-monospace, Menlo, monospace">#purchasing-slackbot</tspan></text>
  <line x1="380" y1="212" x2="262" y2="266" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="620" y1="212" x2="738" y2="266" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah)"/>

  <!-- track lines -->
  <line x1="200" y1="330" x2="200" y2="700" stroke="#003262" stroke-width="6"/>
  <line x1="800" y1="330" x2="800" y2="700" stroke="#141d2b" stroke-width="6" stroke-dasharray="14 9"/>

  <!-- goods nodes: filled -->
  <rect x="110" y="270" width="180" height="60" rx="30" fill="#003262"/>
  <text x="200" y="308" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Submitted</text>
  <rect x="110" y="540" width="180" height="60" rx="30" fill="#003262"/>
  <text x="200" y="578" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Purchased</text>
  <rect x="110" y="700" width="180" height="60" rx="30" fill="#003262"/>
  <text x="200" y="738" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Arrived</text>

  <!-- money nodes: hollow, dashed -->
  <rect x="710" y="270" width="180" height="60" rx="30" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="800" y="308" font-size="22" font-weight="700" text-anchor="middle">Submitted</text>
  <rect x="710" y="420" width="180" height="60" rx="30" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="800" y="458" font-size="22" font-weight="700" text-anchor="middle">Approved</text>
  <rect x="710" y="700" width="180" height="60" rx="30" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="800" y="738" font-size="22" font-weight="700" text-anchor="middle">Reimbursed</text>

  <!-- the gate: approval DM before Purchased -->
  <rect x="120" y="439" width="160" height="22" fill="#FDB515" stroke="#141d2b" stroke-width="3"/>
  <line x1="708" y1="450" x2="284" y2="450" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="495" y="436" font-size="22" font-weight="700" text-anchor="middle">the bot's approval DM</text>
  <text x="495" y="486" font-size="22" text-anchor="middle">buy only after it</text>
  <text x="495" y="514" font-size="22" font-style="italic" fill="#515f74" text-anchor="middle">gate before Purchased</text>

  <!-- /reimburse -->
  <text x="780" y="584" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" text-anchor="end">/reimburse</text>
  <text x="780" y="614" font-size="22" text-anchor="end">reference ID and amount,</text>
  <text x="780" y="642" font-size="22" text-anchor="end">within a month of buying</text>

  <!-- receiving -->
  <rect x="15" y="810" width="560" height="110" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="35" y="844" font-size="22" font-weight="700">Receiving desk (CS-014)</text>
  <text x="35" y="874" font-size="22">Set Arrived by hand when every line is in;</text>
  <text x="35" y="902" font-size="22">receiving does not change it</text>
  <line x1="200" y1="808" x2="200" y2="764" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
