<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" font-family="Inter" font-size="22" fill="#141d2b">
  <!-- CS-009 §7.6: section through a CF tube with a bonded insert and rod end
       (new, v2 variant a). Numbers from CS-009 R1 (DP420 TDS): test bondline
       0.13-0.20 mm, handling strength 2.5 h at 23 °C. 120 grit is the team
       value (§7.3 step 2). The team load hold has no number yet and is drawn
       as [lead input needed]. Bondline gap exaggerated for legibility.
       Grayscale: CF walls diagonal hatch, metal solid light fill, adhesive
       stippled, dam solid black, masking tape cross-hatched, fixture blocks
       hollow with heavy outline. -->
  <defs>
    <pattern id="c9bcf" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141d2b" stroke-width="1.6"/>
    </pattern>
    <pattern id="c9badh" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FDB515"/>
      <circle cx="3" cy="3" r="1.3" fill="#141d2b"/>
    </pattern>
    <pattern id="c9btape" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff"/>
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#515f74" stroke-width="1"/>
    </pattern>
    <marker id="c9barr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="740" fill="#ffffff"/>

  <!-- prep sequence -->
  <text x="40" y="40" font-weight="700">Prep both faces, the tube bore and the insert (§7.3 steps 1–4)</text>
  <rect x="40" y="58" width="240" height="48" rx="6" fill="#ffffff" stroke="#003262" stroke-width="2.5"/>
  <text x="160" y="90" text-anchor="middle"><tspan font-weight="700">1</tspan> · solvent wipe</text>
  <line x1="286" y1="82" x2="326" y2="82" stroke="#141d2b" stroke-width="2.5" marker-end="url(#c9barr)"/>
  <rect x="332" y="58" width="300" height="48" rx="6" fill="#ffffff" stroke="#003262" stroke-width="2.5"/>
  <text x="482" y="90" text-anchor="middle"><tspan font-weight="700">2</tspan> · abrade, 120 grit</text>
  <line x1="638" y1="82" x2="678" y2="82" stroke="#141d2b" stroke-width="2.5" marker-end="url(#c9barr)"/>
  <rect x="684" y="58" width="240" height="48" rx="6" fill="#ffffff" stroke="#003262" stroke-width="2.5"/>
  <text x="804" y="90" text-anchor="middle"><tspan font-weight="700">3</tspan> · solvent wipe</text>
  <text x="40" y="138" fill="#515f74">120 grit is the team value; the TDS asks for clean, fine-grit abrasive.</text>

  <!-- callouts above the section -->
  <text x="40" y="196">CF tube</text>
  <line x1="80" y1="204" x2="80" y2="232" stroke="#515f74" stroke-width="1.5"/>
  <text x="316" y="196" text-anchor="middle">dam inside the tube</text>
  <line x1="340" y1="204" x2="402" y2="296" stroke="#515f74" stroke-width="1.5"/>
  <text x="560" y="196" text-anchor="middle">bond faces</text>
  <line x1="560" y1="204" x2="560" y2="266" stroke="#515f74" stroke-width="1.5"/>
  <text x="790" y="196" text-anchor="middle">threads masked</text>
  <line x1="790" y1="204" x2="790" y2="292" stroke="#515f74" stroke-width="1.5"/>

  <!-- CF tube walls, broken at the left -->
  <rect x="40" y="230" width="620" height="32" fill="url(#c9bcf)" stroke="#141d2b" stroke-width="2"/>
  <rect x="40" y="378" width="620" height="32" fill="url(#c9bcf)" stroke="#141d2b" stroke-width="2"/>
  <path d="M 40 230 q -10 22.5 0 45 q 10 22.5 0 45 q -10 22.5 0 45 q 10 22.5 0 45" fill="none" stroke="#141d2b" stroke-width="2"/>

  <!-- adhesive in the bondline (gap drawn far wider than true) -->
  <rect x="420" y="262" width="240" height="10" fill="url(#c9badh)" stroke="#141d2b" stroke-width="1"/>
  <rect x="420" y="368" width="240" height="10" fill="url(#c9badh)" stroke="#141d2b" stroke-width="1"/>

  <!-- dam -->
  <rect x="392" y="262" width="24" height="116" fill="#141d2b"/>

  <!-- metal insert with flange -->
  <path d="M 420 272 H 660 V 238 H 700 V 402 H 660 V 368 H 420 Z" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5"/>
  <text x="540" y="328" text-anchor="middle" font-weight="600">metal insert</text>

  <!-- rod end: threaded shank, masked, and eye -->
  <rect x="700" y="302" width="160" height="36" fill="#dde3ec" stroke="#141d2b" stroke-width="2"/>
  <rect x="712" y="292" width="140" height="56" fill="url(#c9btape)" stroke="#141d2b" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="910" cy="320" r="44" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5"/>
  <circle cx="910" cy="320" r="18" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="910" y="264" text-anchor="middle">rod end</text>

  <!-- fixture: blocks on the bench -->
  <path d="M 110 470 V 410 H 140 L 175 432 L 210 410 H 240 V 470 Z" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <rect x="884" y="364" width="52" height="106" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <line x1="30" y1="470" x2="970" y2="470" stroke="#141d2b" stroke-width="3"/>
  <g stroke="#515f74" stroke-width="1.5">
    <line x1="60" y1="470" x2="48" y2="484"/><line x1="160" y1="470" x2="148" y2="484"/><line x1="260" y1="470" x2="248" y2="484"/>
    <line x1="360" y1="470" x2="348" y2="484"/><line x1="460" y1="470" x2="448" y2="484"/><line x1="560" y1="470" x2="548" y2="484"/>
    <line x1="660" y1="470" x2="648" y2="484"/><line x1="760" y1="470" x2="748" y2="484"/><line x1="860" y1="470" x2="848" y2="484"/>
    <line x1="960" y1="470" x2="948" y2="484"/>
  </g>

  <!-- bondline leader -->
  <line x1="600" y1="374" x2="600" y2="508" stroke="#515f74" stroke-width="1.5"/>
  <circle cx="600" cy="373" r="4" fill="#141d2b"/>

  <!-- bottom: fixture, bondline, load hold -->
  <text x="40" y="534" font-weight="700">Fixture or clamp:</text>
  <text x="40" y="560">nothing moves until</text>
  <text x="40" y="586">handling strength,</text>
  <text x="40" y="612">2.5 h at 23 °C (73 °F)</text>

  <text x="380" y="534" font-weight="700">Bondline gap</text>
  <text x="380" y="560">DP420 TDS test bondline</text>
  <text x="380" y="586">0.13 to 0.20 mm (5 to 8 mil)</text>
  <text x="380" y="616" fill="#515f74">hold the gap the drawing</text>
  <text x="380" y="642" fill="#515f74">calls for</text>

  <circle cx="726" cy="552" r="28" fill="#ffffff" stroke="#003262" stroke-width="3.5"/>
  <line x1="726" y1="552" x2="726" y2="534" stroke="#003262" stroke-width="3"/>
  <line x1="726" y1="552" x2="740" y2="560" stroke="#003262" stroke-width="3"/>
  <text x="766" y="546" font-weight="700" fill="#003262">No load before</text>
  <text x="766" y="572" font-weight="700" fill="#003262">the team hold</text>
  <rect x="704" y="594" width="226" height="34" rx="4" fill="#FDB515" stroke="#141d2b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="817" y="619" text-anchor="middle" font-weight="700">[lead input needed]</text>
  <text x="704" y="660">no mounting, torquing</text>
  <text x="704" y="686">or driving before it</text>
  <text x="704" y="716" fill="#515f74">the app does not enforce it</text>
</svg>
