<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Inter" font-size="22" fill="#141d2b">
  <!-- CS-006 §7.3: the infusion loop in section, pot to pump (v2, variant a).
       Faithful redraw of cs006-infusion: mesh break before the outlet, trap
       between bag and pump, valve that isolates the pump for the drop test.
       Grayscale: mold hollow with heavy outline, laminate solid light fill,
       peel ply hollow thin, flow mesh gridded, spirals hatched, tape solid black,
       trap heaviest outline. -->
  <defs>
    <pattern id="c6mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ffffff"/>
      <path d="M0 5 H10 M5 0 V10" stroke="#515f74" stroke-width="1.2"/>
    </pattern>
    <pattern id="c6spiral" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#141d2b" stroke-width="2"/>
    </pattern>
    <marker id="c6arr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 z" fill="#003262"/>
    </marker>
    <marker id="c6arrs" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11,0 L0,5 L11,10 z" fill="#003262"/>
    </marker>
  </defs>
  <rect width="1000" height="780" fill="#ffffff"/>

  <!-- bag label (top) -->
  <text x="470" y="58" text-anchor="middle">VB160 bag: pleat at every corner, and every</text>
  <text x="470" y="86" text-anchor="middle">300–400 mm of perimeter on curved molds</text>
  <line x1="420" y1="96" x2="420" y2="276" stroke="#515f74" stroke-width="1.5"/>

  <!-- mold -->
  <rect x="260" y="390" width="460" height="74" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="490" y="420" text-anchor="middle" font-weight="600">sealed, released mold</text>
  <text x="490" y="448" text-anchor="middle" font-weight="600">(CS-004)</text>

  <!-- laminate, peel ply, flow mesh -->
  <rect x="345" y="352" width="290" height="38" fill="#dde3ec" stroke="#141d2b" stroke-width="1.5"/>
  <text x="490" y="379" text-anchor="middle">dry stack per WO</text>
  <rect x="333" y="341" width="314" height="11" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="333" y="325" width="225" height="16" fill="url(#c6mesh)" stroke="#141d2b" stroke-width="1.5"/>

  <!-- mesh break dimension -->
  <line x1="558" y1="300" x2="558" y2="325" stroke="#003262" stroke-width="1.5"/>
  <line x1="656" y1="300" x2="656" y2="364" stroke="#003262" stroke-width="1.5"/>
  <line x1="560" y1="308" x2="654" y2="308" stroke="#003262" stroke-width="2" marker-start="url(#c6arrs)" marker-end="url(#c6arr)"/>
  <text x="650" y="204" text-anchor="end" font-weight="700" fill="#003262">flow mesh stops</text>
  <text x="650" y="231" text-anchor="end" font-weight="700" fill="#003262">30–50 mm short</text>
  <text x="650" y="258" text-anchor="end" font-weight="700" fill="#003262">of the outlet</text>

  <!-- bag + pleats -->
  <path d="M 275 378 C 278 312, 300 292, 350 290 L 630 290 C 680 292, 702 312, 705 378" fill="none" stroke="#141d2b" stroke-width="3"/>
  <path d="M 404 290 l 10 -16 l 10 16" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <path d="M 500 290 l 10 -16 l 10 16" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>

  <!-- tacky tape -->
  <rect x="264" y="376" width="22" height="14" fill="#141d2b"/>
  <rect x="694" y="376" width="22" height="14" fill="#141d2b"/>

  <!-- spirals on the flange -->
  <circle cx="314" cy="376" r="13" fill="url(#c6spiral)" stroke="#141d2b" stroke-width="2"/>
  <circle cx="668" cy="376" r="13" fill="url(#c6spiral)" stroke="#141d2b" stroke-width="2"/>

  <!-- inlet line, clamp, pot -->
  <path d="M 314 363 V 220 Q 314 180 274 180 H 135 Q 115 180 115 200 V 292" fill="none" stroke="#141d2b" stroke-width="3"/>
  <rect x="200" y="164" width="16" height="32" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="208" y="150" text-anchor="middle">inlet clamp</text>
  <rect x="64" y="242" width="102" height="64" fill="#FDB515"/>
  <path d="M 60 210 V 310 H 170 V 210" fill="none" stroke="#141d2b" stroke-width="3"/>
  <text x="115" y="344" text-anchor="middle" font-weight="700">resin pot, braced</text>
  <text x="115" y="372" text-anchor="middle">line end fully</text>
  <text x="115" y="398" text-anchor="middle">submerged</text>
  <text x="115" y="430" text-anchor="middle" fill="#515f74">a slurping inlet</text>
  <text x="115" y="456" text-anchor="middle" fill="#515f74">injects bubbles</text>

  <!-- outlet line to trap -->
  <path d="M 668 363 V 220 Q 668 180 708 180 H 790" fill="none" stroke="#141d2b" stroke-width="3"/>

  <!-- gauge on the trap (bag side of the valve) -->
  <text x="860" y="36" text-anchor="middle">gauge, inHg</text>
  <circle cx="860" cy="78" r="26" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <line x1="860" y1="78" x2="872" y2="62" stroke="#141d2b" stroke-width="2.5"/>
  <line x1="860" y1="104" x2="860" y2="126" stroke="#141d2b" stroke-width="3"/>

  <!-- resin trap -->
  <rect x="790" y="126" width="140" height="120" rx="8" fill="#ffffff" stroke="#003262" stroke-width="5"/>
  <text x="860" y="170" text-anchor="middle" font-weight="700" font-size="24" fill="#003262">RESIN</text>
  <text x="860" y="198" text-anchor="middle" font-weight="700" font-size="24" fill="#003262">TRAP</text>
  <text x="860" y="230" text-anchor="middle" fill="#515f74">catch pot</text>

  <!-- valve and pump -->
  <line x1="860" y1="246" x2="860" y2="330" stroke="#141d2b" stroke-width="3"/>
  <path d="M 846 274 L 874 302 L 874 274 L 846 302 Z" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="888" y="296">valve</text>
  <rect x="805" y="330" width="110" height="56" rx="6" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5"/>
  <text x="860" y="366" text-anchor="middle" font-weight="700">pump</text>
  <text x="860" y="420" text-anchor="middle" font-weight="700" fill="#003262">never bag to</text>
  <text x="860" y="446" text-anchor="middle" font-weight="700" fill="#003262">pump direct</text>

  <!-- callouts below the mold -->
  <line x1="214" y1="492" x2="268" y2="392" stroke="#515f74" stroke-width="1.5"/>
  <text x="20" y="514">tacky tape (AT-200Y),</text>
  <text x="20" y="540">full perimeter, about</text>
  <text x="20" y="566">½ in off the part</text>

  <line x1="314" y1="389" x2="314" y2="492" stroke="#515f74" stroke-width="1.5"/>
  <text x="300" y="514">inlet spiral on the flange,</text>
  <text x="300" y="540">not on the part</text>

  <line x1="668" y1="389" x2="668" y2="492" stroke="#515f74" stroke-width="1.5"/>
  <text x="654" y="514">outlet spiral,</text>
  <text x="654" y="540">line to the trap</text>

  <!-- resin travel -->
  <text x="490" y="604" text-anchor="middle" font-weight="700" fill="#003262">resin travel inlet to outlet ≤ 0.5 m; longer needs more feeds on the WO</text>
  <line x1="320" y1="624" x2="660" y2="624" stroke="#003262" stroke-width="3" marker-end="url(#c6arr)"/>

  <!-- numbers strip -->
  <rect x="20" y="650" width="960" height="114" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <text x="40" y="684"><tspan font-weight="700">Before resin:</tspan> ≥27 inHg on the gauge.</text>
  <text x="40" y="716"><tspan font-weight="700">Drop test:</tspan> shut the valve; the bag loses ≤1 inHg in 10 min (§7.4).</text>
  <text x="40" y="748"><tspan font-weight="700">Mix:</tspan> IN2 : AT30 = 100 : 30 by weight; mass ≈ dry fiber × 0.65 × 1.2–1.3 (§7.5).</text>
</svg>
