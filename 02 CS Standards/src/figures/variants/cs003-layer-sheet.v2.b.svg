<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <!-- CS-003 §7.3 step 8: one layer sheet from the mold's Drawings set, as
       app/drawings.js draws it (sheetLayer): this board heavy solid, the mold at
       this height dashed, the board below dash-dot; insets from each edge of the
       board below; Datum A at the near-left corner of the stack; the two tables.
       Margin and lattice from app/slicer.js (MARGIN_MIN_MM 25.4, MARGIN_MAX_MM
       50.8, BLANK_QUANTUM_MM 12.7). Variant b: the sheet as the person at the
       glue table uses it, with the stack and its SPLIT beside it. -->
  <defs>
    <marker id="ls-a" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,6 L0,12 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="900" fill="#ffffff"/>

  <text x="40" y="50" font-family="Saira" font-size="32" font-weight="700" fill="#003262">Placing one board from its layer sheet</text>
  <text x="70" y="96" font-family="Inter" font-size="22" font-weight="700" fill="#515f74" letter-spacing="0.5">LAYER 3 OF 4 · SETUP 2</text>

  <!-- board below (L2): thin dash-dot -->
  <rect x="70" y="110" width="520" height="460" fill="none" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="22 8 4 8"/>
  <!-- this board (L3): heavy solid -->
  <rect x="190" y="200" width="300" height="270" fill="#ffffff" stroke="#003262" stroke-width="7"/>
  <!-- mold at this height: dashed -->
  <path d="M 262 244 L 446 244 L 446 400 Q 446 426 420 426 L 234 426 L 234 272 Z" fill="none" stroke="#141d2b" stroke-width="3.5" stroke-dasharray="14 9"/>
  <text x="194" y="190" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="700" fill="#003262">L3</text>

  <!-- insets from the board below -->
  <g stroke="#141d2b" stroke-width="2" fill="none">
    <line x1="72" y1="330" x2="188" y2="330" marker-start="url(#ls-a)" marker-end="url(#ls-a)"/>
    <line x1="492" y1="360" x2="588" y2="360" marker-start="url(#ls-a)" marker-end="url(#ls-a)"/>
    <line x1="420" y1="112" x2="420" y2="198" marker-start="url(#ls-a)" marker-end="url(#ls-a)"/>
    <line x1="300" y1="472" x2="300" y2="568" marker-start="url(#ls-a)" marker-end="url(#ls-a)"/>
  </g>
  <g font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">
    <text x="130" y="318" text-anchor="middle">Left</text>
    <text x="540" y="348" text-anchor="middle">Right</text>
    <text x="432" y="163">Back</text>
    <text x="312" y="528">Front</text>
  </g>
  <circle cx="130" cy="372" r="18" fill="#141d2b"/>
  <text x="130" y="380" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#ffffff">1</text>

  <!-- margin between mold and blank edge -->
  <line x1="448" y1="300" x2="488" y2="300" stroke="#141d2b" stroke-width="2"/>
  <line x1="490" y1="300" x2="632" y2="300" stroke="#515f74" stroke-width="1.5"/>
  <circle cx="468" cy="300" r="4" fill="#141d2b"/>

  <!-- Datum A, as drawings.js datumMark -->
  <polygon points="70,570 82,590 58,590" fill="#141d2b"/>
  <line x1="44" y1="570" x2="96" y2="570" stroke="#141d2b" stroke-width="3"/>
  <line x1="70" y1="590" x2="42" y2="604" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="22" y="604" width="40" height="38" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="42" y="632" text-anchor="middle" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">A</text>
  <circle cx="98" cy="623" r="18" fill="#141d2b"/>
  <text x="98" y="631" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#ffffff">2</text>
  <text x="126" y="631" font-family="Inter" font-size="24" fill="#141d2b">Datum A: the stack's near-left corner</text>

  <!-- right column: the lines -->
  <text x="640" y="130" font-family="Saira" font-size="24" font-weight="700" fill="#003262">THE LINES</text>
  <line x1="640" y1="164" x2="710" y2="164" stroke="#003262" stroke-width="7"/>
  <text x="726" y="172" font-family="Inter" font-size="22" fill="#141d2b">this board (L3)</text>
  <line x1="640" y1="204" x2="710" y2="204" stroke="#141d2b" stroke-width="3.5" stroke-dasharray="14 9"/>
  <text x="726" y="212" font-family="Inter" font-size="22" fill="#141d2b">mold at this height</text>
  <line x1="640" y1="244" x2="710" y2="244" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="22 8 4 8"/>
  <text x="726" y="252" font-family="Inter" font-size="22" fill="#141d2b">board below (L2)</text>

  <text x="640" y="307" font-family="Inter" font-size="22" font-weight="700" fill="#141d2b">1 to 2 in past the mold,</text>
  <text x="640" y="335" font-family="Inter" font-size="22" fill="#141d2b">rounded to a ½ in size</text>

  <!-- right column: the stack -->
  <text x="640" y="400" font-family="Saira" font-size="24" font-weight="700" fill="#003262">THE STACK</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="680" y="420" width="180" height="40" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    <text x="770" y="447" fill="#141d2b">L4</text>
    <rect x="680" y="460" width="180" height="40" fill="#FDB515" stroke="#003262" stroke-width="5"/>
    <text x="770" y="487" fill="#141d2b">L3</text>
    <rect x="680" y="500" width="180" height="40" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    <text x="770" y="527" fill="#141d2b">L2</text>
    <rect x="680" y="540" width="180" height="40" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    <text x="770" y="567" fill="#141d2b">L1</text>
  </g>
  <line x1="660" y1="500" x2="880" y2="500" stroke="#141d2b" stroke-width="8"/>
  <text x="890" y="508" font-family="Inter" font-size="22" font-weight="700" fill="#141d2b">SPLIT</text>
  <text x="640" y="622" font-family="Inter" font-size="22" font-weight="700" fill="#141d2b">Never glue across a SPLIT.</text>
  <text x="640" y="650" font-family="Inter" font-size="22" fill="#141d2b">Each section is its own setup.</text>

  <!-- the two tables -->
  <line x1="40" y1="690" x2="960" y2="690" stroke="#dde3ec" stroke-width="2"/>
  <g font-family="Inter" fill="#141d2b">
    <circle cx="48" cy="728" r="18" fill="#141d2b"/>
    <text x="48" y="736" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
    <text x="76" y="736" font-size="22" font-weight="700">PLACEMENT ON L2</text>
    <text x="76" y="764" font-size="22" fill="#515f74">inset from each edge of the board below</text>

    <circle cx="533" cy="728" r="18" fill="#141d2b"/>
    <text x="533" y="736" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
    <text x="561" y="736" font-size="22" font-weight="700">CHECK FROM DATUM A</text>
    <text x="561" y="764" font-size="22" fill="#515f74">catches a board sawn oversize</text>
  </g>
  <!-- table 1 -->
  <g font-family="Inter" font-size="22" fill="#141d2b">
    <rect x="30" y="780" width="455" height="80" fill="none" stroke="#141d2b" stroke-width="2"/>
    <line x1="30" y1="820" x2="485" y2="820" stroke="#141d2b" stroke-width="2"/>
    <line x1="105" y1="780" x2="105" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <line x1="200" y1="780" x2="200" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <line x1="295" y1="780" x2="295" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <line x1="390" y1="780" x2="390" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <g font-weight="700" text-anchor="middle"><text x="67.5" y="808">Blank</text><text x="152.5" y="808">Left</text><text x="247.5" y="808">Right</text><text x="342.5" y="808">Front</text><text x="437.5" y="808">Back</text></g>
    <text x="67.5" y="848" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700">L3</text>
    <g fill="#515f74" text-anchor="middle"><text x="152.5" y="848">in [mm]</text><text x="247.5" y="848">in [mm]</text><text x="342.5" y="848">in [mm]</text><text x="437.5" y="848">in [mm]</text></g>
  </g>
  <!-- table 2 -->
  <g font-family="Inter" font-size="22" fill="#141d2b">
    <rect x="515" y="780" width="455" height="80" fill="none" stroke="#141d2b" stroke-width="2"/>
    <line x1="515" y1="820" x2="970" y2="820" stroke="#141d2b" stroke-width="2"/>
    <line x1="590" y1="780" x2="590" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <line x1="685" y1="780" x2="685" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <line x1="780" y1="780" x2="780" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <line x1="875" y1="780" x2="875" y2="860" stroke="#dde3ec" stroke-width="2"/>
    <g font-weight="700" text-anchor="middle"><text x="552.5" y="808">Blank</text><text x="637.5" y="808">X min</text><text x="732.5" y="808">Y min</text><text x="827.5" y="808">X max</text><text x="922.5" y="808">Y max</text></g>
    <text x="552.5" y="848" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700">L3</text>
    <g fill="#515f74" text-anchor="middle"><text x="637.5" y="848">in [mm]</text><text x="732.5" y="848">in [mm]</text><text x="827.5" y="848">in [mm]</text><text x="922.5" y="848">in [mm]</text></g>
  </g>
</svg>
