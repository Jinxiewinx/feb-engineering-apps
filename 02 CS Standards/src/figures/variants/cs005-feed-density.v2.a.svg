<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Inter" fill="#141d2b">
  <!-- CS-005 §7.4 step 6: a stack glued from 30 and 45 lb/ft³ board is machined
       at the 45 lb feed for every setup. Where the number comes from:
       stock.js feedRateBand ("Machine at the N lb/ft³ feed.", "Boards opened"),
       shop.js densityCutMax "Highest density cut (lb/ft³)", written by
       submitCommitCuts; before cutting, the top of the planned range
       (densityMax "Board density, max (lb/ft³)"); drawings.js layer-sheet
       note. Grades differ by hatch density, not hue. -->
  <rect width="1000" height="720" fill="#ffffff"/>
  <defs>
    <pattern id="fd-30" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#515f74" stroke-width="1.6"/>
    </pattern>
    <pattern id="fd-45" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FDB515"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#141d2b" stroke-width="2"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#141d2b" stroke-width="2"/>
    </pattern>
  </defs>

  <text x="30" y="46" font-family="Saira" font-size="32" font-weight="600" fill="#003262">The densest board cut sets the feed</text>
  <text x="60" y="100" font-size="22" fill="#515f74">a mold stack, front elevation</text>

  <!-- the stack: L4, L3 = setup 2; L2, L1 = setup 1 -->
  <g stroke="#141d2b" stroke-width="2">
    <rect x="80" y="130" width="360" height="66" fill="url(#fd-30)"/>
    <rect x="80" y="196" width="360" height="66" fill="url(#fd-30)"/>
    <rect x="80" y="262" width="190" height="66" fill="url(#fd-30)"/>
    <rect x="270" y="262" width="170" height="66" fill="url(#fd-45)"/>
    <rect x="80" y="328" width="360" height="66" fill="url(#fd-45)"/>
  </g>
  <line x1="66" y1="262" x2="480" y2="262" stroke="#141d2b" stroke-width="6"/>
  <g font-size="22" font-weight="700" text-anchor="end">
    <text x="70" y="171">L4</text><text x="70" y="237">L3</text>
    <text x="70" y="303">L2</text><text x="70" y="369">L1</text>
  </g>
  <!-- grade tags on white so the hatch never runs through text -->
  <g font-size="22" font-weight="600" text-anchor="middle">
    <rect x="216" y="147" width="88" height="32" fill="#ffffff" stroke="#141d2b" stroke-width="1.2"/><text x="260" y="171">30 lb</text>
    <rect x="216" y="213" width="88" height="32" fill="#ffffff" stroke="#141d2b" stroke-width="1.2"/><text x="260" y="237">30 lb</text>
    <rect x="131" y="279" width="88" height="32" fill="#ffffff" stroke="#141d2b" stroke-width="1.2"/><text x="175" y="303">30 lb</text>
    <rect x="311" y="279" width="88" height="32" fill="#ffffff" stroke="#141d2b" stroke-width="1.2"/><text x="355" y="303">45 lb</text>
    <rect x="216" y="345" width="88" height="32" fill="#ffffff" stroke="#141d2b" stroke-width="1.2"/><text x="260" y="369">45 lb</text>
  </g>

  <!-- setups -->
  <path d="M462 134 L474 134 L474 244 L462 244" fill="none" stroke="#141d2b" stroke-width="1.8"/>
  <path d="M462 280 L474 280 L474 390 L462 390" fill="none" stroke="#141d2b" stroke-width="1.8"/>
  <g font-size="22">
    <text x="486" y="186">setup 2</text>
    <text x="486" y="212" font-weight="700" fill="#003262">45 lb feed</text>
    <text x="486" y="320">setup 1</text>
    <text x="486" y="346" font-weight="700" fill="#003262">45 lb feed</text>
  </g>
  <text x="486" y="270" font-size="22" font-weight="700">SPLIT</text>

  <!-- legend -->
  <rect x="60" y="458" width="50" height="30" fill="url(#fd-30)" stroke="#141d2b" stroke-width="1.5"/>
  <text x="122" y="481" font-size="22">30 lb/ft³ board</text>
  <rect x="60" y="502" width="50" height="30" fill="url(#fd-45)" stroke="#141d2b" stroke-width="1.5"/>
  <text x="122" y="525" font-size="22">45 lb/ft³ board</text>
  <text x="60" y="574" font-size="22">Two grades may share a layer when the</text>
  <text x="60" y="600" font-size="22">mold is planned across a range of grades.</text>
  <text x="60" y="626" font-size="22" fill="#515f74">Setup 2 cuts only 30 lb board and</text>
  <text x="60" y="652" font-size="22" fill="#515f74">still runs at the 45 lb feed.</text>

  <!-- where the number comes from -->
  <text x="610" y="100" font-size="22" font-weight="600" fill="#515f74">where the 45 comes from</text>

  <rect x="610" y="118" width="360" height="132" fill="#ffffff" stroke="#003262" stroke-width="2.5"/>
  <text x="626" y="148" font-size="22" font-weight="700">Cut list</text>
  <text x="626" y="180" font-size="22" font-weight="700" fill="#003262">Machine at the 45 lb/ft³</text>
  <text x="626" y="206" font-size="22" font-weight="700" fill="#003262">feed.</text>
  <text x="626" y="236" font-size="22" fill="#515f74">Boards opened: 30, 45 lb/ft³.</text>

  <rect x="610" y="270" width="360" height="132" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="626" y="300" font-size="22" font-weight="700">Mold record</text>
  <text x="626" y="330" font-size="22">Highest density cut (lb/ft³)</text>
  <text x="626" y="362" font-family="ui-monospace, Menlo, monospace" font-size="24" font-weight="700">45</text>
  <text x="626" y="390" font-size="22" fill="#515f74">written at Mark cut</text>

  <rect x="610" y="422" width="360" height="132" fill="#ffffff" stroke="#141d2b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="626" y="452" font-size="22" font-weight="700">Before the boards are cut</text>
  <text x="626" y="482" font-size="22">use the top of the planned</text>
  <text x="626" y="508" font-size="22">range: Board density,</text>
  <text x="626" y="534" font-size="22">max (lb/ft³)</text>

  <text x="610" y="600" font-size="22">The layer sheets repeat it:</text>
  <text x="610" y="626" font-size="22" font-style="italic">machine every setup at the</text>
  <text x="610" y="652" font-size="22" font-style="italic">45 lb feed.</text>
  <text x="610" y="690" font-size="22" fill="#515f74">CS-005 §7.4 step 6, CS-003 §5</text>
</svg>
