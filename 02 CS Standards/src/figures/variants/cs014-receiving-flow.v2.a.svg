<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" font-family="Inter" fill="#141d2b">
  <!-- CS-014 §7 receiving flow, v2 (brief A). Labels from receiving.js,
       inventory.js and scan.js: Receive a delivery, Arrived ▸, Receive delivery,
       Log it, ✨ From packing slip, Create N records?, N records added,
       Print N labels, Undo, EH&S tag. AI branch dashed; it reaches the sheet only
       through the heavy ink "person checks" bar. Synthetic EH&S tag tail only. -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="950" fill="#ffffff"/>

  <!-- delivery -->
  <path d="M40 58 L70 34 H150 L120 58 z" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M120 58 L150 34 V86 L120 110 z" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="40" y="58" width="80" height="52" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <line x1="80" y1="58" x2="80" y2="110" stroke="#141d2b" stroke-width="5"/>
  <text x="170" y="74" font-size="22" font-weight="700">Delivery</text>
  <line x1="90" y1="114" x2="90" y2="146" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="270" y1="66" x2="326" y2="66" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah)"/>
  <text x="298" y="98" font-size="22" text-anchor="middle" fill="#515f74">slip</text>

  <!-- four ways in -->
  <text x="20" y="174" font-family="Saira" font-size="24" font-weight="700" fill="#003262">Open the desk</text>
  <rect x="20" y="186" width="270" height="70" rx="35" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="155" y="216" font-size="22" font-weight="700" text-anchor="middle">Receive a delivery</text>
  <text x="155" y="243" font-size="22" text-anchor="middle" fill="#515f74">toolbar</text>
  <rect x="20" y="266" width="270" height="70" rx="35" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="155" y="296" font-size="22" font-weight="700" text-anchor="middle">Arrived ▸</text>
  <text x="155" y="323" font-size="22" text-anchor="middle" fill="#515f74">a line on Incoming</text>
  <rect x="20" y="346" width="270" height="70" rx="35" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="155" y="376" font-size="22" font-weight="700" text-anchor="middle">Receive delivery</text>
  <text x="155" y="403" font-size="22" text-anchor="middle" fill="#515f74">a shelf's page</text>
  <rect x="20" y="426" width="270" height="70" rx="35" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="155" y="456" font-size="22" font-weight="700" text-anchor="middle">Scan → Log it</text>
  <text x="155" y="483" font-size="22" text-anchor="middle" fill="#515f74">unknown EH&amp;S tag</text>
  <line x1="290" y1="221" x2="328" y2="221" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="290" y1="301" x2="328" y2="301" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="290" y1="381" x2="328" y2="381" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="290" y1="461" x2="328" y2="461" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- AI branch: dashed, through the person-check bar -->
  <rect x="330" y="20" width="330" height="92" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="495" y="56" font-size="22" font-weight="700" text-anchor="middle">✨ From packing slip</text>
  <text x="495" y="88" font-size="22" text-anchor="middle" fill="#515f74">photo or PDF: a draft</text>
  <line x1="495" y1="112" x2="495" y2="128" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="330" y="130" width="330" height="44" fill="#141d2b"/>
  <rect x="330" y="130" width="12" height="44" fill="#FDB515"/>
  <text x="501" y="160" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">person checks every row</text>
  <line x1="495" y1="174" x2="495" y2="198" stroke="#141d2b" stroke-width="5" marker-end="url(#ah)"/>

  <!-- the sheet -->
  <rect x="330" y="200" width="330" height="290" rx="10" fill="#ffffff" stroke="#003262" stroke-width="4"/>
  <text x="350" y="234" font-family="Saira" font-size="24" font-weight="700" fill="#003262">Receiving desk sheet</text>
  <rect x="345" y="248" width="300" height="36" fill="#dde3ec"/>
  <text x="357" y="274" font-size="22" font-weight="700">Class</text>
  <text x="633" y="274" font-size="22" font-weight="700" text-anchor="end">How many</text>
  <line x1="345" y1="284" x2="645" y2="284" stroke="#141d2b" stroke-width="1.5"/>
  <text x="357" y="312" font-size="22">Fabric</text>
  <text x="633" y="312" font-size="22" text-anchor="end">3</text>
  <line x1="345" y1="322" x2="645" y2="322" stroke="#dde3ec" stroke-width="2"/>
  <text x="357" y="350" font-size="22">Resin</text>
  <text x="633" y="350" font-size="22" text-anchor="end">2</text>
  <line x1="345" y1="360" x2="645" y2="360" stroke="#dde3ec" stroke-width="2"/>
  <text x="357" y="388" font-size="22">Consumable</text>
  <text x="633" y="388" font-size="22" text-anchor="end">50</text>
  <line x1="345" y1="398" x2="645" y2="398" stroke="#141d2b" stroke-width="1.5"/>
  <text x="350" y="436" font-size="22" fill="#515f74">also Shelf, Vendor lot,</text>
  <text x="350" y="464" font-size="22" fill="#515f74">EH&amp;S tag, Expires, $ each</text>

  <!-- EH&S tag branch -->
  <rect x="700" y="200" width="285" height="200" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="720" y="234" font-family="Saira" font-size="24" font-weight="700" fill="#003262">EH&amp;S tag</text>
  <text x="720" y="266" font-size="22">scanned or typed into</text>
  <text x="720" y="294" font-size="22">the row's EH&amp;S tag cell,</text>
  <text x="720" y="322" font-size="22">one code per container</text>
  <text x="720" y="364" font-family="ui-monospace, Menlo, monospace" font-size="22">…0024 3F1C</text>
  <line x1="700" y1="300" x2="664" y2="300" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- confirm -->
  <line x1="495" y1="490" x2="495" y2="548" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="480" y="537" font-size="22" fill="#515f74" text-anchor="end">Review N records</text>
  <rect x="330" y="550" width="330" height="100" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="495" y="590" font-size="22" font-weight="700" text-anchor="middle">Create N records?</text>
  <text x="495" y="624" font-size="22" text-anchor="middle">untick what did not arrive</text>
  <line x1="660" y1="600" x2="698" y2="600" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- lots -->
  <rect x="700" y="440" width="285" height="330" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="720" y="474" font-family="Saira" font-size="24" font-weight="700" fill="#003262">Lots</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" text-anchor="middle">
    <rect x="720" y="490" width="64" height="40" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="752" y="517">FAB</text>
    <rect x="792" y="490" width="64" height="40" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="824" y="517">FAB</text>
    <rect x="864" y="490" width="64" height="40" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="896" y="517">FAB</text>
    <rect x="720" y="580" width="64" height="40" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="752" y="607">RSN</text>
    <rect x="792" y="580" width="64" height="40" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="824" y="607">RSN</text>
    <rect x="720" y="670" width="136" height="40" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="3.5"/><text x="788" y="697">CON ×50</text>
  </g>
  <text x="720" y="560" font-size="22">one per roll</text>
  <text x="720" y="650" font-size="22">one per container</text>
  <text x="720" y="740" font-size="22">one record, a count</text>

  <!-- shelf -->
  <line x1="842" y1="770" x2="842" y2="808" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="700" y="810" width="285" height="110" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="720" y="844" font-size="22" font-weight="700">On the shelf</text>
  <text x="720" y="874" font-size="22">Sealed, Received =</text>
  <text x="720" y="902" font-size="22">the Arrived date</text>

  <!-- after Create -->
  <line x1="495" y1="650" x2="495" y2="688" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="330" y="690" width="330" height="110" rx="10" fill="#FDB515" stroke="#141d2b" stroke-width="3"/>
  <text x="350" y="724" font-size="22" font-weight="700">N records added</text>
  <rect x="350" y="740" width="190" height="44" rx="22" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="445" y="769" font-size="22" text-anchor="middle">Print N labels</text>
  <rect x="552" y="740" width="90" height="44" rx="22" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="597" y="769" font-size="22" text-anchor="middle">Undo</text>

  <!-- note -->
  <text x="20" y="862" font-size="22">Tagged chemical containers get no FEB label:</text>
  <text x="20" y="892" font-size="22">the EH&amp;S tag is their label (CS-001 §7.2).</text>
</svg>
