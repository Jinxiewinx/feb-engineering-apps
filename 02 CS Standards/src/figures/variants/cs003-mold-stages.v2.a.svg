<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" font-family="Inter" fill="#141d2b">
  <!-- CS-003 §7.1: mold life on the app's track. Stage names from
       app/shop.js MOLD_STAGE / MOLD_TRACK; Retired off the track (dashed, as the
       stepper draws it). Walking back asks first: molds.js setMoldStage.
       Tooling cut set by stock.js submitCommitCuts. -->
  <rect width="1000" height="1010" fill="#ffffff"/>
  <defs>
    <marker id="st-a" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,6 L0,12 z" fill="#003262"/>
    </marker>
    <marker id="st-o" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L13,6 L1,11 z" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    </marker>
    <pattern id="st-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FDB515"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141d2b" stroke-width="3"/>
    </pattern>
  </defs>

  <text x="30" y="46" font-family="Saira" font-size="32" font-weight="600" fill="#003262">Mold stages on the app's track</text>
  <text x="440" y="92" font-size="22" font-weight="600" fill="#515f74">what puts the mold there</text>

  <!-- spine arrows -->
  <g stroke="#003262" stroke-width="4" marker-end="url(#st-a)">
    <line x1="250" y1="170" x2="250" y2="268"/>
    <line x1="250" y1="330" x2="250" y2="388"/>
    <line x1="250" y1="450" x2="250" y2="508"/>
    <line x1="250" y1="570" x2="250" y2="628"/>
    <line x1="250" y1="690" x2="250" y2="748"/>
  </g>

  <!-- the blocker gate -->
  <rect x="96" y="207" width="308" height="26" fill="url(#st-hatch)" stroke="#141d2b" stroke-width="3"/>
  <text x="440" y="200" font-size="23" font-weight="700">Mold design review</text>
  <text x="440" y="226" font-size="22" fill="#515f74">WO blocker step, before any blank is cut</text>
  <text x="440" y="252" font-size="22" font-style="italic">No initials, no cutting, no glue, no booking.</text>

  <!-- stage boxes -->
  <g font-size="24" font-weight="700" text-anchor="middle">
    <rect x="110" y="110" width="280" height="60" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
    <text x="250" y="148">Designed</text>
    <rect x="110" y="270" width="280" height="60" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
    <text x="250" y="308">Tooling cut</text>
    <rect x="110" y="390" width="280" height="60" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
    <text x="250" y="428">Board glued</text>
    <rect x="110" y="510" width="280" height="60" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
    <text x="250" y="548">Machined</text>
    <rect x="110" y="630" width="280" height="60" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
    <text x="250" y="668">Sealed</text>
    <rect x="110" y="750" width="280" height="60" fill="#003262" stroke="#003262" stroke-width="3"/>
    <text x="250" y="788" fill="#ffffff">Ready for layup</text>
  </g>

  <!-- what moves it -->
  <g font-size="22">
    <text x="440" y="134">created by planning: + Mold or</text>
    <text x="440" y="160">Plan from Fusion (§7.1 step 8)</text>
    <text x="440" y="294"><tspan font-weight="700">automatic:</tspan> Mark these boards cut…</text>
    <text x="440" y="320">then Mark cut (§7.3 step 4)</text>
    <text x="440" y="414"><tspan font-weight="700">by hand</tspan> after clamping</text>
    <text x="440" y="440" fill="#515f74">§7.3 step 15</text>
    <text x="440" y="534"><tspan font-weight="700">by hand</tspan> at the machine, with Home</text>
    <text x="440" y="560">location (CS-005 §7.5 step 6)</text>
    <text x="440" y="654"><tspan font-weight="700">by hand</tspan> with the sealing fields</text>
    <text x="440" y="680" fill="#515f74">CS-004 §7.4 step 4</text>
    <text x="440" y="774"><tspan font-weight="700">by hand</tspan> once the label is on</text>
    <text x="440" y="800" fill="#515f74">CS-004 §7.5 step 5</text>
  </g>

  <!-- walking back asks first -->
  <path d="M110 300 L70 300 L70 140 L106 140" fill="none" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#st-o)"/>

  <!-- Retired, off the track -->
  <rect x="200" y="870" width="220" height="60" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="310" y="908" font-size="24" font-weight="700" text-anchor="middle">Retired</text>
  <text x="440" y="894" font-size="22">off the track, from any stage;</text>
  <text x="440" y="920" font-size="22">never deleted (§7.4 step 3)</text>

  <!-- legend line -->
  <line x1="40" y1="978" x2="100" y2="978" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#st-o)"/>
  <text x="114" y="986" font-size="22">moving back a stage, or to Retired: the app asks first</text>
</svg>
