<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="Inter" fill="#141d2b">
  <!-- CS-003 §7.3 step 8: a layer sheet as app/drawings.js draws it. Solid
       heavy = this layer's blank, dashed = mold at this height (DASH_MOLD),
       dash-dot = the layer underneath (DASH_BELOW), Datum A at the near-left
       corner, the PLACEMENT ON Ln and CHECK FROM DATUM A tables, SPLIT on
       the elevation. Margin and lattice: app/slicer.js MARGIN_MIN/MAX_MM
       25.4/50.8, BLANK_QUANTUM_MM 12.7. No values invented: the tables show
       their columns only. -->
  <rect width="1000" height="960" fill="#ffffff"/>
  <defs>
    <marker id="ls-a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#003262"/>
    </marker>
    <marker id="ls-as" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11,0 L0,4.5 L11,9 z" fill="#003262"/>
    </marker>
  </defs>

  <text x="30" y="46" font-family="Saira" font-size="32" font-weight="600" fill="#003262">A layer sheet: one board placed on the one below</text>
  <rect x="30" y="68" width="940" height="36" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <text x="44" y="93" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700">LAYER 2 OF 4 · SETUP 1</text>
  <text x="600" y="146" font-size="22" fill="#515f74" text-anchor="end">top view</text>

  <!-- L1, the layer underneath: dash-dot -->
  <rect x="100" y="160" width="500" height="360" fill="none" stroke="#141d2b" stroke-width="2" stroke-dasharray="18 6 3 6"/>
  <text x="102" y="152" font-size="22" font-weight="700" fill="#515f74">L1</text>

  <!-- L2, this layer's blank: solid heavy -->
  <rect x="170" y="215" width="370" height="245" fill="none" stroke="#141d2b" stroke-width="4"/>
  <text x="174" y="207" font-size="22" font-weight="700">L2</text>

  <!-- mold at this height: dashed -->
  <rect x="230" y="270" width="250" height="135" rx="34" fill="none" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="12 7"/>
  <text x="355" y="345" font-size="22" fill="#515f74" text-anchor="middle">mold</text>

  <!-- margin between mold and blank edge -->
  <line x1="300" y1="217" x2="300" y2="268" stroke="#003262" stroke-width="1.8" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
  <text x="312" y="250" font-size="22" font-weight="600" fill="#003262">1–2 in margin</text>

  <!-- insets from the board below -->
  <g stroke="#003262" stroke-width="1.8">
    <line x1="102" y1="320" x2="168" y2="320" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
    <line x1="542" y1="390" x2="598" y2="390" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
    <line x1="420" y1="462" x2="420" y2="518" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
    <line x1="470" y1="162" x2="470" y2="213" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
  </g>
  <g font-size="22" font-weight="600" fill="#003262">
    <text x="135" y="308" text-anchor="middle">Left</text>
    <text x="608" y="398">Right</text>
    <text x="430" y="497">Front</text>
    <text x="480" y="196">Back</text>
  </g>

  <!-- Datum A at the near-left corner of the stack -->
  <polygon points="100,520 108,533 92,533" fill="#141d2b"/>
  <line x1="86" y1="520" x2="114" y2="520" stroke="#141d2b" stroke-width="2"/>
  <line x1="100" y1="533" x2="72" y2="552" stroke="#141d2b" stroke-width="1.2"/>
  <rect x="44" y="544" width="34" height="34" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="61" y="569" font-size="22" font-weight="700" text-anchor="middle">A</text>
  <text x="90" y="572" font-size="22" font-weight="600">Datum A: near-left corner of the stack</text>

  <!-- front elevation with the split -->
  <text x="690" y="268" font-size="22" fill="#515f74">front elevation</text>
  <g stroke="#141d2b" stroke-width="1.8" fill="#ffffff">
    <rect x="690" y="320" width="180" height="50"/>
    <rect x="690" y="370" width="180" height="50"/>
    <rect x="690" y="470" width="180" height="50"/>
  </g>
  <rect x="690" y="420" width="180" height="50" fill="#FDB515" stroke="#141d2b" stroke-width="4"/>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="780" y="353">L4</text><text x="780" y="403">L3</text>
    <text x="780" y="453">L2</text><text x="780" y="503">L1</text>
  </g>
  <line x1="674" y1="420" x2="886" y2="420" stroke="#141d2b" stroke-width="6"/>
  <text x="892" y="428" font-size="22" font-weight="700">SPLIT 1</text>
  <text x="892" y="360" font-size="22" fill="#515f74">setup 2</text>
  <text x="892" y="500" font-size="22" fill="#515f74">setup 1</text>
  <text x="690" y="298" font-size="22" fill="#515f74">this sheet: L2</text>

  <!-- the two tables -->
  <text x="30" y="636" font-size="22" font-weight="700">PLACEMENT ON L1, INSET FROM EACH EDGE</text>
  <g stroke="#141d2b" stroke-width="1.5" fill="#ffffff">
    <rect x="30" y="650" width="510" height="38"/><rect x="30" y="688" width="510" height="38"/>
  </g>
  <g stroke="#141d2b" stroke-width="1.2">
    <line x1="100" y1="650" x2="100" y2="726"/><line x1="230" y1="650" x2="230" y2="726"/>
    <line x1="307" y1="650" x2="307" y2="726"/><line x1="385" y1="650" x2="385" y2="726"/>
    <line x1="462" y1="650" x2="462" y2="726"/>
  </g>
  <g font-size="22" font-weight="600">
    <text x="38" y="677">Blank</text><text x="108" y="677">Board size</text>
    <text x="238" y="677">Left</text><text x="315" y="677">Right</text>
    <text x="393" y="677">Front</text><text x="470" y="677">Back</text>
  </g>
  <text x="38" y="715" font-family="ui-monospace, Menlo, monospace" font-size="22">L2</text>

  <text x="570" y="636" font-size="22" font-weight="700">CHECK FROM DATUM A</text>
  <g stroke="#141d2b" stroke-width="1.5" fill="#ffffff">
    <rect x="570" y="650" width="400" height="38"/><rect x="570" y="688" width="400" height="38"/>
  </g>
  <g stroke="#141d2b" stroke-width="1.2">
    <line x1="640" y1="650" x2="640" y2="726"/><line x1="722" y1="650" x2="722" y2="726"/>
    <line x1="805" y1="650" x2="805" y2="726"/><line x1="887" y1="650" x2="887" y2="726"/>
  </g>
  <g font-size="22" font-weight="600">
    <text x="578" y="677">Blank</text><text x="650" y="677">X min</text>
    <text x="732" y="677">Y min</text><text x="814" y="677">X max</text><text x="896" y="677">Y max</text>
  </g>
  <text x="578" y="715" font-family="ui-monospace, Menlo, monospace" font-size="22">L2</text>

  <!-- legend -->
  <line x1="30" y1="778" x2="970" y2="778" stroke="#dde3ec" stroke-width="2"/>
  <line x1="40" y1="816" x2="120" y2="816" stroke="#141d2b" stroke-width="4"/>
  <text x="136" y="824" font-size="22">blank on this layer</text>
  <line x1="40" y1="856" x2="120" y2="856" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="12 7"/>
  <text x="136" y="864" font-size="22">mold at this height</text>
  <line x1="40" y1="896" x2="120" y2="896" stroke="#141d2b" stroke-width="2" stroke-dasharray="18 6 3 6"/>
  <text x="136" y="904" font-size="22">the layer underneath</text>
  <line x1="40" y1="936" x2="120" y2="936" stroke="#141d2b" stroke-width="6"/>
  <text x="136" y="944" font-size="22">split between sections</text>

  <text x="520" y="824" font-size="22">Blanks run 1 to 2 in past the mold</text>
  <text x="520" y="852" font-size="22">and are sized to a 1/2 in lattice,</text>
  <text x="520" y="880" font-size="22">so a small shift still machines.</text>
  <text x="520" y="914" font-size="22" fill="#515f74">Set the insets first, then check</text>
  <text x="520" y="942" font-size="22" fill="#515f74">the Datum A table (§7.3 step 8).</text>
</svg>
