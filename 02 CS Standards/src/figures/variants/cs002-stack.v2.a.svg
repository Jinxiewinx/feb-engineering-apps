<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Inter" fill="#141d2b">
  <!-- CS-002 §7.3 example stack, v2 (brief A): exploded section, P1 on the mold.
       Grayscale: orientation is the hatch direction (grid = 0/90, diagonal = ±45),
       88 spread-tow is shaded, mesh is a dark band with open cells, core is open circles. -->
  <defs>
    <pattern id="g090" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M6 0 V12 M0 6 H12" stroke="#141d2b" stroke-width="1.4"/>
    </pattern>
    <pattern id="g45" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0 L12 12 M12 0 L0 12" stroke="#141d2b" stroke-width="1.4"/>
    </pattern>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#141d2b"/>
      <rect x="3" y="3" width="4" height="4" fill="#ffffff"/>
    </pattern>
    <pattern id="core" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ffffff"/>
      <circle cx="8" cy="8" r="4.5" fill="none" stroke="#141d2b" stroke-width="1.4"/>
    </pattern>
    <pattern id="board" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#515f74" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,6 L0,12 z" fill="#003262"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>

  <text x="30" y="46" font-family="Saira" font-size="30" font-weight="700" fill="#003262">Example stack, §7.3</text>
  <text x="30" y="80" font-size="22" fill="#515f74">The format, not a recommended stack. Ply order counts from the mold.</text>

  <!-- count direction -->
  <line x1="80" y1="600" x2="80" y2="130" stroke="#003262" stroke-width="4" marker-end="url(#ah)"/>
  <text transform="translate(62 365) rotate(-90)" font-size="22" font-weight="700" text-anchor="middle" fill="#003262">mold side (P1) to bag side (P7)</text>

  <!-- P7 bag side -->
  <rect x="120" y="142" width="340" height="10" fill="#dde3ec" stroke="#141d2b" stroke-width="2"/>
  <rect x="120" y="142" width="340" height="10" fill="url(#g090)"/>
  <line x1="460" y1="147" x2="490" y2="147" stroke="#515f74" stroke-width="1.5"/>
  <text x="500" y="145" font-size="22"><tspan font-weight="700">P7</tspan>  88 spread-tow · 0/90</text>
  <text x="500" y="173" font-size="22" fill="#515f74">full · bag side</text>

  <!-- P6 -->
  <rect x="120" y="207" width="340" height="20" fill="url(#g45)" stroke="#141d2b" stroke-width="2"/>
  <line x1="460" y1="217" x2="490" y2="217" stroke="#515f74" stroke-width="1.5"/>
  <text x="500" y="215" font-size="22"><tspan font-weight="700">P6</tspan>  195 twill · ±45</text>
  <text x="500" y="243" font-size="22" fill="#515f74">full</text>

  <!-- P5 -->
  <rect x="120" y="277" width="340" height="20" fill="url(#g090)" stroke="#141d2b" stroke-width="2"/>
  <line x1="460" y1="287" x2="490" y2="287" stroke="#515f74" stroke-width="1.5"/>
  <text x="500" y="285" font-size="22"><tspan font-weight="700">P5</tspan>  195 twill · 0/90</text>
  <text x="500" y="313" font-size="22" fill="#515f74">full</text>

  <!-- P4 core, chamfered -->
  <path d="M 170 381 L 252 351 L 328 351 L 410 381 Z" fill="url(#core)" stroke="#141d2b" stroke-width="2"/>
  <path d="M 202 381 A 32 32 0 0 0 200 370" fill="none" stroke="#141d2b" stroke-width="1.5"/>
  <text x="162" y="380" font-size="22" text-anchor="end">20°</text>
  <line x1="410" y1="366" x2="490" y2="366" stroke="#515f74" stroke-width="1.5"/>
  <text x="500" y="364" font-size="22"><tspan font-weight="700">P4</tspan>  Rohacell 31 IG-F 3 mm</text>
  <text x="500" y="392" font-size="22" fill="#515f74">core zone · chamfer 20° · grooves per CS-006</text>

  <!-- P3 copper mesh, zones only -->
  <rect x="190" y="427" width="180" height="18" fill="url(#mesh)" stroke="#141d2b" stroke-width="2"/>
  <line x1="370" y1="436" x2="490" y2="436" stroke="#515f74" stroke-width="1.5"/>
  <text x="500" y="434" font-size="22"><tspan font-weight="700">P3</tspan>  Cu mesh · zones A–B</text>
  <text x="500" y="462" font-size="22" fill="#515f74">grounding, 25 mm overlap onto P2</text>

  <!-- P2 -->
  <rect x="120" y="497" width="340" height="20" fill="url(#g45)" stroke="#141d2b" stroke-width="2"/>
  <line x1="460" y1="507" x2="490" y2="507" stroke="#515f74" stroke-width="1.5"/>
  <text x="500" y="505" font-size="22"><tspan font-weight="700">P2</tspan>  195 twill · ±45</text>
  <text x="500" y="533" font-size="22" fill="#515f74">full</text>

  <!-- P1 mold side -->
  <rect x="120" y="572" width="340" height="10" fill="#dde3ec" stroke="#141d2b" stroke-width="2"/>
  <rect x="120" y="572" width="340" height="10" fill="url(#g090)"/>
  <line x1="460" y1="577" x2="490" y2="577" stroke="#515f74" stroke-width="1.5"/>
  <text x="500" y="575" font-size="22"><tspan font-weight="700">P1</tspan>  88 spread-tow · 0/90</text>
  <text x="500" y="603" font-size="22" fill="#515f74">full · sacrificial/finish · show face</text>

  <!-- mold -->
  <rect x="100" y="600" width="380" height="64" fill="url(#board)" stroke="#141d2b" stroke-width="3"/>
  <rect x="150" y="614" width="280" height="36" fill="#ffffff"/>
  <text x="290" y="640" font-size="22" font-weight="700" text-anchor="middle">MOLD (sealed, CS-004)</text>

  <!-- key -->
  <rect x="30" y="700" width="44" height="22" fill="url(#g090)" stroke="#141d2b" stroke-width="1.5"/>
  <text x="84" y="719" font-size="22">0/90</text>
  <rect x="150" y="700" width="44" height="22" fill="url(#g45)" stroke="#141d2b" stroke-width="1.5"/>
  <text x="204" y="719" font-size="22">±45</text>
  <rect x="266" y="706" width="44" height="11" fill="#dde3ec" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="266" y="706" width="44" height="11" fill="url(#g090)"/>
  <text x="320" y="719" font-size="22">thin, shaded: 88 spread-tow</text>
  <rect x="672" y="700" width="44" height="22" fill="url(#mesh)" stroke="#141d2b" stroke-width="1.5"/>
  <text x="726" y="719" font-size="22">mesh</text>
  <rect x="822" y="700" width="44" height="22" fill="url(#core)" stroke="#141d2b" stroke-width="1.5"/>
  <text x="876" y="719" font-size="22">core</text>
</svg>
