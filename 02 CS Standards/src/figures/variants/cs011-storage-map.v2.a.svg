<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Inter" fill="#141d2b">
  <!-- CS-011 §7.3 storage map by site, v2 (brief A). Site names exactly as
       app/shop.js SITES. Flammables cabinet: hatched frame. Never-use places
       (food fridge, etch locker): dashed box with a heavy X. Resin and hardener
       placement deliberately not drawn (CS-011 §6; R-011-01 held for Simon). -->
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#141d2b" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1000" height="720" fill="#ffffff"/>
  <rect x="15" y="20" width="475" height="220" rx="10" fill="#ffffff"/>
  <path d="M15 30 a10 10 0 0 1 10 -10 H480 a10 10 0 0 1 10 10 V62 H15 z" fill="#dde3ec"/>
  <line x1="15" y1="62" x2="490" y2="62" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="15" y="20" width="475" height="220" rx="10" fill="none" stroke="#141d2b" stroke-width="2.5"/>
  <text x="35" y="50" font-family="Saira" font-size="26" font-weight="700" fill="#003262">RFS container</text>
  <text x="35" y="96" font-size="22" font-weight="700">Molds</text>
  <text x="35" y="126" font-size="22" font-weight="700">Foam and tooling-board stock</text>
  <text x="35" y="156" font-size="22" font-style="italic" fill="#515f74">Molds never in front of the knaack</text>
  <text x="35" y="186" font-size="22" font-style="italic" fill="#515f74">or screw boxes. Boards are logged</text>
  <text x="35" y="216" font-size="22" font-style="italic" fill="#515f74">on Inventory → Boards</text>
  <rect x="510" y="20" width="475" height="105" rx="10" fill="#ffffff"/>
  <path d="M510 30 a10 10 0 0 1 10 -10 H975 a10 10 0 0 1 10 10 V62 H510 z" fill="#dde3ec"/>
  <line x1="510" y1="62" x2="985" y2="62" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="510" y="20" width="475" height="105" rx="10" fill="none" stroke="#141d2b" stroke-width="2.5"/>
  <text x="530" y="50" font-family="Saira" font-size="26" font-weight="700" fill="#003262">Jacobs basement</text>
  <text x="530" y="96" font-size="22" font-weight="700">Finished parts <tspan font-weight="400" font-style="italic" fill="#515f74">· keycard access</tspan></text>
  <rect x="510" y="135" width="475" height="105" rx="10" fill="#ffffff"/>
  <path d="M510 145 a10 10 0 0 1 10 -10 H975 a10 10 0 0 1 10 10 V177 H510 z" fill="#dde3ec"/>
  <line x1="510" y1="177" x2="985" y2="177" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="510" y="135" width="475" height="105" rx="10" fill="none" stroke="#141d2b" stroke-width="2.5"/>
  <text x="530" y="165" font-family="Saira" font-size="26" font-weight="700" fill="#003262">Dry sealed bin</text>
  <text x="530" y="211" font-size="22" font-weight="700">Cloth</text>
  <rect x="15" y="260" width="475" height="190" rx="10" fill="url(#hatch)" stroke="#141d2b" stroke-width="2.5"/>
  <rect x="33" y="278" width="439" height="154" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <text x="51" y="312" font-family="Saira" font-size="26" font-weight="700" fill="#003262">Flammables cabinet</text>
  <text x="51" y="348" font-size="22" font-weight="700">Airtac</text>
  <text x="51" y="378" font-size="22" font-weight="700">Acetone</text>
  <text x="51" y="408" font-size="22" font-weight="700">Clear coat</text>
  <text x="455" y="408" font-size="22" font-style="italic" fill="#515f74" text-anchor="end">per §6</text>
  <rect x="510" y="260" width="475" height="90" rx="10" fill="#ffffff"/>
  <path d="M510 270 a10 10 0 0 1 10 -10 H975 a10 10 0 0 1 10 10 V302 H510 z" fill="#dde3ec"/>
  <line x1="510" y1="302" x2="985" y2="302" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="510" y="260" width="475" height="90" rx="10" fill="none" stroke="#141d2b" stroke-width="2.5"/>
  <text x="530" y="290" font-family="Saira" font-size="26" font-weight="700" fill="#003262">General Box</text>
  <text x="530" y="334" font-size="22" font-weight="700">Consumables <tspan font-weight="400" font-style="italic" fill="#515f74">· at RFS</tspan></text>
  <rect x="510" y="360" width="475" height="90" rx="10" fill="#ffffff"/>
  <path d="M510 370 a10 10 0 0 1 10 -10 H975 a10 10 0 0 1 10 10 V402 H510 z" fill="#dde3ec"/>
  <line x1="510" y1="402" x2="985" y2="402" stroke="#141d2b" stroke-width="1.5"/>
  <rect x="510" y="360" width="475" height="90" rx="10" fill="none" stroke="#141d2b" stroke-width="2.5"/>
  <text x="530" y="390" font-family="Saira" font-size="26" font-weight="700" fill="#003262">Other</text>
  <text x="530" y="434" font-size="22" font-weight="700">Anything else <tspan font-weight="400" font-style="italic" fill="#515f74">· name it after the place</tspan></text>
  <rect x="15" y="480" width="475" height="130" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="10 7"/>
  <rect x="35" y="500" width="76" height="90" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <line x1="35" y1="530" x2="111" y2="530" stroke="#141d2b" stroke-width="2"/>
  <line x1="29" y1="494" x2="117" y2="596" stroke="#141d2b" stroke-width="7"/>
  <line x1="117" y1="494" x2="29" y2="596" stroke="#141d2b" stroke-width="7"/>
  <text x="135" y="518" font-family="Saira" font-size="26" font-weight="700" fill="#003262">Food fridge</text>
  <text x="135" y="552" font-size="22" font-weight="700">Never chemicals</text>
  <text x="135" y="582" font-size="22" font-style="italic" fill="#515f74">incident, 2026-02-17 (§6)</text>
  <rect x="510" y="480" width="475" height="130" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="10 7"/>
  <rect x="530" y="500" width="76" height="90" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <line x1="568" y1="500" x2="568" y2="590" stroke="#141d2b" stroke-width="2"/>
  <line x1="524" y1="494" x2="612" y2="596" stroke="#141d2b" stroke-width="7"/>
  <line x1="612" y1="494" x2="524" y2="596" stroke="#141d2b" stroke-width="7"/>
  <text x="630" y="518" font-family="Saira" font-size="26" font-weight="700" fill="#003262">Etch locker</text>
  <text x="630" y="552" font-size="22" font-weight="700">Never finished parts</text>
  <text x="630" y="582" font-size="22" font-style="italic" fill="#515f74">agreement, 2026-04-20</text>
  <line x1="15" y1="636" x2="985" y2="636" stroke="#dde3ec" stroke-width="2"/>
  <rect x="15" y="650" width="10" height="62" fill="#FDB515"/>
  <text x="40" y="672" font-size="22">Resins and hardeners: stored as §6 says. Every shelf is a storage</text>
  <text x="40" y="702" font-size="22">record (<tspan font-family="ui-monospace, Menlo, monospace">BIN-SN6-###</tspan>) with its Site set from this map.</text>
</svg>
