<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1366" font-family="Inter, sans-serif">
  <!-- CS-014 §7.2-7.6: a delivery from the box to the shelf, read top
       down. Labels copied from inventory.js, receiving.js and scan.js.
       Grayscale: the ✨ branch is dashed and reaches the sheet only through
       the heavy solid "person checks" bar; tracked lots are several small
       boxes, a consumable is one box with a count. EH&S code is the
       made-up test tail, never a real tag. -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="1366" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" fill="#515f74">Log a delivery the day it arrives.</text>

  <!-- entries -->
  <rect x="24" y="66" width="952" height="190" rx="14" fill="#ffffff" stroke="#515f74" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="40" y="96" font-size="24" font-weight="700" fill="#141d2b">Open the Receiving desk from any of these:</text>
  <g font-size="22">
    <rect x="40" y="114" width="450" height="56" rx="28" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    <text x="64" y="150" fill="#515f74"><tspan font-weight="700" fill="#141d2b">Receive a delivery</tspan>  toolbar</text>
    <rect x="510" y="114" width="450" height="56" rx="28" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    <text x="534" y="150" fill="#515f74"><tspan font-weight="700" fill="#141d2b">Arrived ▸</tspan>  a line on Incoming</text>
    <rect x="40" y="182" width="450" height="56" rx="28" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    <text x="64" y="218" fill="#515f74"><tspan font-weight="700" fill="#141d2b">Receive delivery</tspan>  a shelf's page</text>
    <rect x="510" y="182" width="450" height="56" rx="28" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
    <text x="534" y="218" fill="#515f74"><tspan font-weight="700" fill="#141d2b">Scan → Log it</tspan>  unknown EH&amp;S tag</text>
  </g>
  <line x1="300" y1="256" x2="300" y2="286" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 1 sheet -->
  <rect x="40" y="290" width="560" height="270" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="334" font-size="28" font-weight="700" fill="#141d2b">1  Fill the sheet</text>
  <text x="64" y="372" font-size="22" fill="#141d2b">One row per kind of thing.</text>
  <text x="64" y="412" font-size="22" font-weight="700" fill="#141d2b">Pick Class first:</text>
  <text x="64" y="442" font-size="22" fill="#141d2b">Fabric · Resin · Hardener · Consumable</text>
  <text x="64" y="482" font-size="22" fill="#141d2b">Resin and hardener on separate rows.</text>
  <text x="64" y="520" font-size="22" fill="#515f74">Then How many, Shelf, Vendor lot,</text>
  <text x="64" y="546" font-size="22" fill="#515f74">EH&amp;S tag, Expires, $ each.</text>

  <!-- ✨ branch through person check -->
  <rect x="660" y="280" width="300" height="78" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="684" y="314" font-size="24" font-weight="700" fill="#141d2b">✨ From packing slip</text>
  <text x="684" y="344" font-size="22" fill="#515f74">photo or PDF</text>
  <line x1="810" y1="358" x2="810" y2="390" stroke="#141d2b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>
  <rect x="660" y="394" width="300" height="18" fill="#141d2b"/>
  <text x="810" y="442" font-size="22" font-weight="700" fill="#141d2b" text-anchor="middle">A person checks</text>
  <text x="810" y="468" font-size="22" font-weight="700" fill="#141d2b" text-anchor="middle">every row</text>
  <polyline points="660,403 632,403 632,403 604,403" fill="none" stroke="#141d2b" stroke-width="4" marker-end="url(#ah)"/>

  <!-- EH&S tag branch -->
  <rect x="660" y="490" width="300" height="190" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="684" y="526" font-size="24" font-weight="700" fill="#141d2b">EH&amp;S tag</text>
  <text x="684" y="556" font-size="22" fill="#141d2b">Scan or type it into</text>
  <text x="684" y="582" font-size="22" fill="#141d2b">the row's EH&amp;S tag cell.</text>
  <text x="684" y="610" font-size="22" font-weight="700" fill="#141d2b">One code per container.</text>
  <text x="684" y="642" font-size="22" fill="#515f74">All 24 characters, off the</text>
  <text x="684" y="668" font-size="22" fill="#515f74">face of the tag.</text>
  <line x1="660" y1="530" x2="604" y2="530" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>

  <line x1="300" y1="560" x2="300" y2="688" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="316" y="620" font-size="22" font-weight="700" fill="#141d2b">Review N records</text>
  <text x="316" y="648" font-size="22" fill="#515f74">(Ctrl+Enter)</text>

  <!-- 2 confirm -->
  <rect x="40" y="692" width="560" height="96" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="734" font-size="28" font-weight="700" fill="#141d2b">2  Create N records?</text>
  <text x="64" y="768" font-size="22" fill="#141d2b">Untick what did not arrive.</text>

  <line x1="300" y1="788" x2="300" y2="824" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 3 records -->
  <rect x="40" y="828" width="920" height="170" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="870" font-size="28" font-weight="700" fill="#141d2b">3  The records</text>
  <text x="300" y="870" font-size="22" fill="#515f74">every one starts Sealed, dated with Arrived</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" fill="#141d2b" text-anchor="middle">
    <rect x="64" y="892" width="80" height="48" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="104" y="924">FAB</text>
    <rect x="152" y="892" width="80" height="48" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="192" y="924">FAB</text>
    <rect x="240" y="892" width="80" height="48" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="280" y="924">RSN</text>
    <rect x="328" y="892" width="80" height="48" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="2"/><text x="368" y="924">RSN</text>
    <rect x="620" y="892" width="150" height="48" rx="4" fill="#ffffff" stroke="#141d2b" stroke-width="5"/><text x="695" y="924">CON ×50</text>
  </g>
  <text x="64" y="976" font-size="22" fill="#141d2b">One per roll or container</text>
  <text x="620" y="976" font-size="22" fill="#141d2b">One record with a count</text>
  <line x1="580" y1="890" x2="580" y2="986" stroke="#dde3ec" stroke-width="2"/>

  <!-- after Create bar -->
  <rect x="40" y="1020" width="920" height="64" rx="8" fill="#141d2b"/>
  <text x="64" y="1061" font-size="24" font-weight="700" fill="#ffffff">N records added</text>
  <rect x="560" y="1032" width="220" height="40" rx="6" fill="#ffffff"/>
  <text x="670" y="1060" font-size="22" font-weight="700" fill="#141d2b" text-anchor="middle">Print N labels</text>
  <rect x="800" y="1032" width="140" height="40" rx="6" fill="#ffffff"/>
  <text x="870" y="1060" font-size="22" font-weight="700" fill="#141d2b" text-anchor="middle">Undo</text>
  <text x="40" y="1120" font-size="22" fill="#141d2b"><tspan font-weight="700">A container with an EH&amp;S tag gets no FEB label.</tspan> The tag is its label.</text>
  <text x="40" y="1148" font-size="22" fill="#515f74">If the batch has tagged ones, print the rest from Inventory → Labels.</text>

  <!-- 4 shelf -->
  <rect x="40" y="1176" width="560" height="72" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="1222" font-size="28" font-weight="700" fill="#141d2b">4  Onto its shelf, same day</text>
  <text x="40" y="1282" font-size="22" fill="#515f74">A row with no Shelf lands in No location on the storage map.</text>
  <text x="40" y="1316" font-size="22" fill="#141d2b"><tspan font-weight="700">Every line in?</tspan> Set Order status to Arrived on the Budget tab;</text>
  <text x="40" y="1344" font-size="22" fill="#141d2b">receiving does not change it.</text>
</svg>
