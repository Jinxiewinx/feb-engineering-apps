<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1130" font-family="Inter" fill="#141d2b">
  <!-- CS-003 §7.3 step 12: a layer sheet as app/drawings.js draws it. Solid
       heavy = this layer's blank, dashed = mold at this height (DASH_MOLD),
       dash-dot = the layer underneath (DASH_BELOW), Datum A at the near-left
       corner, the PLACEMENT ON Ln and CHECK FROM DATUM A tables, SPLIT on
       the elevation. Title format from drawings.js (LAYER n OF m, thickness,
       grade, SETUP n). Margin and size: app/slicer.js MARGIN_MIN/MAX_MM
       25.4/50.8, BLANK_QUANTUM_MM 12.7. Cells print fmtDwgLine, in" [mm].
       No values invented: the tables show their columns and units only.
       Grayscale: line style carries layer / mold / below; the split is the
       heaviest line, with end ticks; gold only repeats "this layer". -->
  <rect width="1000" height="1130" fill="#ffffff"/>
  <defs>
    <marker id="ls-a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#003262"/>
    </marker>
    <marker id="ls-as" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11,0 L0,4.5 L11,9 z" fill="#003262"/>
    </marker>
  </defs>

  <text x="30" y="46" font-family="Saira" font-size="32" font-weight="600" fill="#003262">A layer sheet: one board placed on the one below</text>
  <rect x="30" y="68" width="940" height="36" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <text x="44" y="93" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700">LAYER 2 OF 4 — &lt;thickness&gt; &lt;grade&gt; LB BOARD · SETUP 1</text>
  <text x="620" y="146" font-size="22" fill="#515f74" text-anchor="end">top view</text>

  <!-- L1, the layer underneath: dash-dot -->
  <rect x="100" y="160" width="520" height="360" fill="none" stroke="#141d2b" stroke-width="2" stroke-dasharray="18 6 3 6"/>
  <text x="102" y="152" font-size="22" font-weight="700" fill="#515f74">L1</text>

  <!-- L2, this layer's blank: solid heavy -->
  <rect x="170" y="215" width="370" height="245" fill="none" stroke="#141d2b" stroke-width="4"/>
  <text x="174" y="207" font-size="22" font-weight="700">L2</text>

  <!-- mold at this height: dashed; the chamfered corner shows which way round -->
  <path d="M264 270 H440 L480 310 V371 Q480 405 446 405 H264 Q230 405 230 371 V304 Q230 270 264 270 Z" fill="none" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="12 7"/>
  <text x="355" y="345" font-size="22" fill="#515f74" text-anchor="middle">mold</text>

  <!-- margin between mold and blank edge -->
  <line x1="300" y1="217" x2="300" y2="268" stroke="#003262" stroke-width="1.8" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
  <text x="312" y="250" font-size="22" font-weight="600" fill="#003262">1–2 in margin</text>

  <!-- insets from the board below -->
  <g stroke="#003262" stroke-width="1.8">
    <line x1="102" y1="320" x2="168" y2="320" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
    <line x1="542" y1="400" x2="618" y2="400" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
    <line x1="420" y1="462" x2="420" y2="518" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
    <line x1="470" y1="162" x2="470" y2="213" marker-start="url(#ls-as)" marker-end="url(#ls-a)"/>
  </g>
  <g font-size="22" font-weight="600" fill="#003262">
    <text x="135" y="308" text-anchor="middle">Left</text>
    <text x="580" y="388" text-anchor="middle">Right</text>
    <text x="430" y="497">Front</text>
    <text x="480" y="196">Back</text>
  </g>
  <circle cx="135" cy="352" r="15" fill="#003262"/><text x="135" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>

  <!-- Datum A at the near-left corner of the stack -->
  <polygon points="100,520 108,533 92,533" fill="#141d2b"/>
  <line x1="86" y1="520" x2="114" y2="520" stroke="#141d2b" stroke-width="2"/>
  <line x1="100" y1="533" x2="72" y2="552" stroke="#141d2b" stroke-width="1.2"/>
  <rect x="44" y="544" width="34" height="34" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="61" y="569" font-size="22" font-weight="700" text-anchor="middle">A</text>
  <text x="90" y="572" font-size="22" font-weight="600">Datum A: near-left corner of the stack</text>
  <circle cx="530" cy="564" r="15" fill="#003262"/><text x="530" y="572" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>

  <!-- front elevation with the split -->
  <text x="690" y="268" font-size="22" fill="#515f74">front elevation</text>
  <text x="690" y="298" font-size="22" fill="#515f74">this sheet: L2</text>
  <g stroke="#141d2b" stroke-width="1.8" fill="#ffffff">
    <rect x="690" y="320" width="180" height="50"/>
    <rect x="690" y="370" width="180" height="50"/>
    <rect x="690" y="470" width="180" height="50"/>
  </g>
  <rect x="690" y="420" width="180" height="50" fill="#FDB515" stroke="#141d2b" stroke-width="4"/>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="780" y="353">L4</text><text x="780" y="403">L3</text>
    <text x="780" y="453">L2</text><text x="780" y="503">L1</text>
  </g>
  <line x1="674" y1="420" x2="886" y2="420" stroke="#141d2b" stroke-width="9"/>
  <path d="M674 408 V432 M886 408 V432" stroke="#141d2b" stroke-width="3"/>
  <text x="896" y="428" font-size="22" font-weight="700">SPLIT 1</text>
  <text x="896" y="360" font-size="22" fill="#515f74">setup 2</text>
  <text x="896" y="500" font-size="22" fill="#515f74">setup 1</text>
  <text x="680" y="556" font-size="22" font-weight="700">Never glue across a SPLIT.</text>
  <text x="680" y="582" font-size="22">Each section is its own</text>
  <text x="680" y="608" font-size="22">glue-up and setup.</text>
  <circle cx="45" cy="658" r="15" fill="#003262"/><text x="45" y="666" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
  <text x="70" y="666" font-size="22" font-weight="700">PLACEMENT ON L1, INSET FROM EACH EDGE</text>
  <rect x="30" y="680" width="940" height="38" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/><rect x="30" y="718" width="940" height="38" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <line x1="120" y1="680" x2="120" y2="756" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="310" y1="680" x2="310" y2="756" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="475" y1="680" x2="475" y2="756" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="640" y1="680" x2="640" y2="756" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="805" y1="680" x2="805" y2="756" stroke="#141d2b" stroke-width="1.2"/>
  <text x="38" y="707" font-size="22" font-weight="600">Blank</text>
  <text x="128" y="707" font-size="22" font-weight="600">Board size</text>
  <text x="318" y="707" font-size="22" font-weight="600">Left</text>
  <text x="483" y="707" font-size="22" font-weight="600">Right</text>
  <text x="648" y="707" font-size="22" font-weight="600">Front</text>
  <text x="813" y="707" font-size="22" font-weight="600">Back</text>
  <text x="38" y="745" font-family="ui-monospace, Menlo, monospace" font-size="22">L2</text>
  <text x="128" y="745" font-size="22" fill="#515f74">in" × in"</text>
  <text x="318" y="745" font-size="22" fill="#515f74">in" [mm]</text>
  <text x="483" y="745" font-size="22" fill="#515f74">in" [mm]</text>
  <text x="648" y="745" font-size="22" fill="#515f74">in" [mm]</text>
  <text x="813" y="745" font-size="22" fill="#515f74">in" [mm]</text>
  <circle cx="45" cy="788" r="15" fill="#003262"/><text x="45" y="796" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
  <text x="70" y="796" font-size="22" font-weight="700">CHECK FROM DATUM A</text>
  <rect x="30" y="810" width="940" height="38" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/><rect x="30" y="848" width="940" height="38" fill="#ffffff" stroke="#141d2b" stroke-width="1.5"/>
  <line x1="120" y1="810" x2="120" y2="886" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="332" y1="810" x2="332" y2="886" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="544" y1="810" x2="544" y2="886" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="757" y1="810" x2="757" y2="886" stroke="#141d2b" stroke-width="1.2"/>
  <text x="38" y="837" font-size="22" font-weight="600">Blank</text>
  <text x="128" y="837" font-size="22" font-weight="600">X min</text>
  <text x="340" y="837" font-size="22" font-weight="600">Y min</text>
  <text x="552" y="837" font-size="22" font-weight="600">X max</text>
  <text x="765" y="837" font-size="22" font-weight="600">Y max</text>
  <text x="38" y="875" font-family="ui-monospace, Menlo, monospace" font-size="22">L2</text>
  <text x="128" y="875" font-size="22" fill="#515f74">in" [mm]</text>
  <text x="340" y="875" font-size="22" fill="#515f74">in" [mm]</text>
  <text x="552" y="875" font-size="22" fill="#515f74">in" [mm]</text>
  <text x="765" y="875" font-size="22" fill="#515f74">in" [mm]</text>

  <!-- legend -->
  <line x1="30" y1="930" x2="970" y2="930" stroke="#dde3ec" stroke-width="2"/>
  <line x1="40" y1="968" x2="120" y2="968" stroke="#141d2b" stroke-width="4"/>
  <text x="136" y="976" font-size="22">blank on this layer</text>
  <line x1="40" y1="1008" x2="120" y2="1008" stroke="#141d2b" stroke-width="2.5" stroke-dasharray="12 7"/>
  <text x="136" y="1016" font-size="22">mold at this height</text>
  <line x1="40" y1="1048" x2="120" y2="1048" stroke="#141d2b" stroke-width="2" stroke-dasharray="18 6 3 6"/>
  <text x="136" y="1056" font-size="22">the layer underneath</text>
  <line x1="40" y1="1088" x2="120" y2="1088" stroke="#141d2b" stroke-width="9"/>
  <path d="M40 1076 V1100 M120 1076 V1100" stroke="#141d2b" stroke-width="3"/>
  <text x="136" y="1096" font-size="22">split between sections</text>

  <text x="520" y="976" font-size="22">Blanks run 1 to 2 in past the mold</text>
  <text x="520" y="1004" font-size="22">and are rounded to a 1/2 in size,</text>
  <text x="520" y="1032" font-size="22">so a small shift still machines.</text>
  <text x="520" y="1066" font-size="22" fill="#515f74">1 Set the insets first, 2 then check</text>
  <text x="520" y="1094" font-size="22" fill="#515f74">the Datum A table (§7.3 step 12).</text>
</svg>
