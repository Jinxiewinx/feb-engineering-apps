<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" font-family="Inter">
  <!-- CS-000 §7.2: from source to shop, variant b (Round 3, brief B).
       Read top to bottom as five numbered steps. Answers "I edited the
       standard, so why does Paul still say the old thing?": the corpus only
       reaches Paul through its own deploy.
       Grayscale: sources and outputs are white boxes with a thin border; the
       two deploy gates are solid dark bars (shape and fill, not hue); the
       QR re-check loop is dashed, the parent link solid. -->
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="1060" fill="#ffffff"/>

  <!-- 1. Edit -->
  <text x="40" y="44" font-family="Saira" font-size="30" font-weight="700" fill="#003262">1  Edit the source</text>
  <rect x="40" y="66" width="300" height="60" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="190" y="104" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#141d2b">src/CS-0xx.md</text>
  <rect x="40" y="142" width="300" height="60" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="190" y="180" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="23" fill="#141d2b">src/figures/*.svg</text>

  <!-- QR hanging off its parent -->
  <line x1="340" y1="88" x2="440" y2="88" stroke="#141d2b" stroke-width="3"/>
  <text x="390" y="78" text-anchor="middle" font-size="22" fill="#515f74">parent</text>
  <rect x="440" y="66" width="260" height="60" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="570" y="104" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#141d2b">src/QR-0xx.md</text>
  <line x1="570" y1="126" x2="570" y2="146" stroke="#141d2b" stroke-width="2"/>
  <path d="M470 146 H700 V222 H470 L448 184 Z" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <circle cx="474" cy="184" r="6" fill="none" stroke="#141d2b" stroke-width="2"/>
  <text x="590" y="176" text-anchor="middle" font-size="22" fill="#141d2b">Checked against</text>
  <text x="590" y="206" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" fill="#141d2b">CS-0xx Rev X</text>
  <!-- re-check loop -->
  <path d="M340 112 H392 V184 H440" fill="none" stroke="#141d2b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ar)"/>
  <text x="724" y="96" font-size="22" font-weight="700" fill="#141d2b">New parent Rev:</text>
  <text x="724" y="124" font-size="22" fill="#141d2b">re-check the QR,</text>
  <text x="724" y="152" font-size="22" fill="#141d2b">move this tag in</text>
  <text x="724" y="180" font-size="22" fill="#141d2b">the same change</text>
  <text x="724" y="208" font-size="22" fill="#515f74">§7.2 step 5</text>

  <line x1="190" y1="206" x2="190" y2="250" stroke="#141d2b" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 2. Rebuild -->
  <text x="40" y="282" font-family="Saira" font-size="30" font-weight="700" fill="#003262">2  Rebuild, in order, from the repo root</text>
  <rect x="40" y="298" width="920" height="186" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <g font-family="Saira" font-size="24" font-weight="700" fill="#141d2b">
    <text x="62" y="336">a</text><text x="62" y="370">b</text><text x="62" y="404">c</text><text x="62" y="438">d</text><text x="62" y="472">e</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#141d2b">
    <text x="94" y="336">node tools/render_figures.mjs</text>
    <text x="94" y="370">tools/.venv/bin/python tools/build_docx.py --all</text>
    <text x="94" y="404">python3 tools/gen_docs_manifest.py</text>
    <text x="94" y="438">node tools/build_ai_corpus.mjs</text>
    <text x="94" y="472">python3 tools/check_traceability.py --strict</text>
  </g>
  <text x="520" y="336" font-size="22" fill="#515f74">only if an SVG changed</text>
  <text x="940" y="472" text-anchor="end" font-size="22" font-weight="700" fill="#141d2b">must pass</text>

  <line x1="190" y1="488" x2="190" y2="514" stroke="#141d2b" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 3. Commit -->
  <text x="40" y="550" font-family="Saira" font-size="30" font-weight="700" fill="#003262">3  Commit source and rebuilt files together, push</text>

  <!-- fan out to the three outputs -->
  <path d="M500 562 V580 M185 580 H815" fill="none" stroke="#141d2b" stroke-width="3"/>
  <line x1="185" y1="579" x2="185" y2="600" stroke="#141d2b" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="500" y1="579" x2="500" y2="600" stroke="#141d2b" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="815" y1="579" x2="815" y2="600" stroke="#141d2b" stroke-width="3" marker-end="url(#ar)"/>

  <!-- outputs -->
  <rect x="40" y="606" width="290" height="112" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="54" y="634" font-family="Saira" font-size="24" font-weight="700" fill="#515f74">b</text>
  <text x="185" y="642" text-anchor="middle" font-size="26" font-weight="700" fill="#141d2b">.docx</text>
  <text x="185" y="676" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#141d2b">02 CS Standards/</text>
  <text x="185" y="704" text-anchor="middle" font-size="22" fill="#515f74">in the repo</text>

  <rect x="355" y="606" width="290" height="112" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="369" y="634" font-family="Saira" font-size="24" font-weight="700" fill="#515f74">c</text>
  <text x="510" y="642" text-anchor="middle" font-size="26" font-weight="700" fill="#141d2b">PDF in the app</text>
  <text x="500" y="676" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#141d2b">docs/standards/</text>
  <text x="500" y="704" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#141d2b">CS-0xx.pdf</text>

  <rect x="670" y="606" width="290" height="112" rx="6" fill="#ffffff" stroke="#141d2b" stroke-width="2"/>
  <text x="684" y="634" font-family="Saira" font-size="24" font-weight="700" fill="#515f74">d</text>
  <text x="825" y="642" text-anchor="middle" font-size="26" font-weight="700" fill="#141d2b">Paul's corpus</text>
  <text x="815" y="676" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#141d2b">functions/</text>
  <text x="815" y="704" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#141d2b">corpus.json</text>

  <!-- 4. Deploy -->
  <text x="40" y="770" font-family="Saira" font-size="30" font-weight="700" fill="#003262">4  Two deploys,</text>
  <text x="40" y="806" font-family="Saira" font-size="30" font-weight="700" fill="#003262">    run separately</text>

  <line x1="500" y1="718" x2="500" y2="746" stroke="#141d2b" stroke-width="3"/>
  <rect x="355" y="746" width="290" height="80" rx="4" fill="#141d2b"/>
  <rect x="355" y="746" width="290" height="10" fill="#FDB515"/>
  <text x="500" y="784" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="23" font-weight="700" fill="#ffffff">firebase deploy</text>
  <text x="500" y="812" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="23" font-weight="700" fill="#ffffff">--only hosting</text>

  <line x1="815" y1="718" x2="815" y2="746" stroke="#141d2b" stroke-width="3"/>
  <rect x="670" y="746" width="290" height="80" rx="4" fill="#141d2b"/>
  <rect x="670" y="746" width="290" height="10" fill="#FDB515"/>
  <text x="815" y="784" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="23" font-weight="700" fill="#ffffff">firebase deploy</text>
  <text x="815" y="812" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="23" font-weight="700" fill="#ffffff">--only functions</text>

  <text x="40" y="852" font-size="22" fill="#515f74">from <tspan font-family="ui-monospace, Menlo, monospace" fill="#141d2b">06 Composites App/</tspan>,</text>
  <text x="40" y="880" font-size="22" fill="#515f74">after the push</text>

  <!-- 5. Who gets it -->
  <line x1="500" y1="826" x2="500" y2="900" stroke="#141d2b" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="815" y1="826" x2="815" y2="900" stroke="#141d2b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="40" y="936" font-family="Saira" font-size="30" font-weight="700" fill="#003262">5  Who sees it</text>
  <text x="500" y="936" text-anchor="middle" font-size="25" font-weight="700" fill="#141d2b">Members read it</text>
  <text x="815" y="936" text-anchor="middle" font-size="25" font-weight="700" fill="#141d2b">Paul answers from it</text>

  <line x1="40" y1="966" x2="960" y2="966" stroke="#dde3ec" stroke-width="2"/>
  <text x="40" y="1004" font-size="23" fill="#141d2b">Announce a released revision in the weekly summary only after both deploys.</text>
  <text x="40" y="1038" font-size="23" fill="#141d2b"><tspan font-weight="700">Paul still says the old thing?</tspan> The functions deploy has not run yet.</text>
</svg>
