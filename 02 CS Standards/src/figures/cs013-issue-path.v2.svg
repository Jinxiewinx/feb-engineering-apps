<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1036" font-family="Inter, sans-serif">
  <!-- CS-013 §7.6: the issue path on one run, a four-step strip read top
       to bottom. Labels copied from projects.js RESOLUTION_METHODS,
       DISPO_WORDS and workorders.js closeout. Grayscale: the false-alarm
       exit is dashed, the closeout bar is heavy black, the
       finished state is a solid dark fill, Reopen is the only loop. -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="1036" fill="#ffffff"/>

  <text x="40" y="56" font-size="24" fill="#515f74">The run cannot complete while any issue is undisposed.</text>

  <!-- 1 Raise -->
  <rect x="40" y="84" width="580" height="124" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="124" font-size="28" font-weight="700" fill="#141d2b">1  Raise it</text>
  <text x="64" y="162" font-size="24" fill="#141d2b"><tspan font-weight="700">⚠ Raise an issue</tspan> in the Issues section</text>
  <text x="64" y="194" font-size="24" fill="#141d2b">or <tspan font-weight="700">⚑</tspan> on the step where it happened</text>

  <!-- false alarm exit -->
  <path d="M 620 290 H 810 V 212" fill="none" stroke="#141d2b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>
  <text x="634" y="320" font-size="22" fill="#141d2b">on an open issue</text>
  <rect x="660" y="84" width="300" height="124" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="682" y="124" font-size="24" font-weight="700" fill="#141d2b">Cancel ticket</text>
  <text x="682" y="156" font-size="24" font-weight="700" fill="#141d2b">(false alarm)</text>
  <text x="682" y="190" font-size="22" fill="#515f74">Not a disposition.</text>

  <line x1="330" y1="208" x2="330" y2="244" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 2 Fill all three -->
  <rect x="40" y="248" width="580" height="348" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="288" font-size="28" font-weight="700" fill="#141d2b">2  Fill all three</text>

  <rect x="64" y="306" width="532" height="98" rx="6" fill="#ffffff" stroke="#515f74" stroke-width="2"/>
  <text x="84" y="338" font-size="24" font-weight="700" fill="#141d2b">Disposition</text>
  <text x="84" y="366" font-size="22" fill="#141d2b">UAI (Use As Is) · Corrective Action</text>
  <text x="84" y="392" font-size="22" fill="#141d2b">Rework · Scrap · Other</text>

  <rect x="64" y="416" width="532" height="54" rx="6" fill="#ffffff" stroke="#515f74" stroke-width="2"/>
  <text x="84" y="451" font-size="24" fill="#515f74"><tspan font-weight="700" fill="#141d2b">What happened</tspan>  the root cause</text>

  <rect x="64" y="482" width="532" height="98" rx="6" fill="#ffffff" stroke="#515f74" stroke-width="2"/>
  <text x="84" y="514" font-size="24" font-weight="700" fill="#141d2b">What was done</text>
  <text x="84" y="542" font-size="22" fill="#515f74">The question follows the Disposition.</text>
  <text x="84" y="568" font-size="22" fill="#141d2b">Scrap: “Why could it not be saved?”</text>

  <line x1="330" y1="596" x2="330" y2="632" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 3 Resolve -->
  <rect x="40" y="636" width="580" height="96" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="676" font-size="28" font-weight="700" fill="#141d2b">3  Resolve</text>
  <text x="64" y="712" font-size="22" fill="#141d2b">on the issue's page, or in the closeout list</text>

  <!-- Reopen loop -->
  <polyline points="620,684 690,684 690,430 632,430" fill="none" stroke="#141d2b" stroke-width="4" marker-end="url(#ah)"/>
  <text x="712" y="452" font-size="26" font-weight="700" fill="#141d2b">Reopen</text>
  <text x="712" y="482" font-size="22" fill="#515f74">on the closed issue</text>
  <text x="712" y="518" font-size="22" fill="#141d2b">clears Disposition</text>
  <text x="712" y="546" font-size="22" fill="#141d2b">and What was done,</text>
  <text x="712" y="574" font-size="22" fill="#141d2b">keeps What happened;</text>
  <text x="712" y="602" font-size="22" fill="#141d2b">the run is held again</text>
  <text x="712" y="630" font-size="22" fill="#141d2b">until it closes</text>

  <!-- closeout bar -->
  <line x1="330" y1="732" x2="330" y2="802" stroke="#141d2b" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="200" y="758" width="260" height="18" fill="#141d2b"/>
  <text x="480" y="775" font-size="22" font-weight="700" fill="#141d2b">closeout: every issue disposed</text>

  <!-- 4 Complete -->
  <rect x="40" y="806" width="580" height="80" rx="10" fill="#003262" stroke="#141d2b" stroke-width="3"/>
  <text x="64" y="856" font-size="28" font-weight="700" fill="#ffffff">4  Run may be set Complete</text>

  <!-- closeout note -->
  <rect x="40" y="914" width="8" height="98" fill="#141d2b"/>
  <text x="66" y="940" font-size="24" font-weight="700" fill="#141d2b">Set Complete with an issue undisposed?</text>
  <text x="66" y="972" font-size="22" fill="#141d2b">It is refused and the closeout list opens: Resolve on each,</text>
  <text x="66" y="1002" font-size="22" fill="#141d2b">or <tspan font-weight="700">Resolve all &amp; complete work order</tspan>.</text>
</svg>
