<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1030">
  <!-- CS-004 §7.1 to §7.4: the release stack built from the board up, with
       the two clocks that decide when the next layer may go on: the fingernail
       check between XCR coats (overcoat about 2 h 50 at 20 °C, 1 h 30 at 30 °C,
       R1) and the FEB 12 h hold before wax (CS-008 §5, app/resins.js). Re-used
       mold path from §7.4 step 3.
       Grayscale: PVA hatched, wax hollow, XCR solid, board dotted; the hold is
       a full-width reversed band. -->
  <defs>
    <pattern id="ss-board" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ffffff"/>
      <circle cx="4" cy="4" r="2" fill="#515f74"/><circle cx="12" cy="11" r="2" fill="#515f74"/>
    </pattern>
    <marker id="ss-up" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,8 L0,16 z" fill="#515f74"/>
    </marker>
    <marker id="ss-a" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,6 L0,12 z" fill="#141d2b"/>
    </marker>
    <pattern id="ss-pva" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#dde3ec"/><line x1="0" y1="0" x2="0" y2="10" stroke="#141d2b" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="1030" fill="#ffffff"/>

  <text x="40" y="50" font-family="Saira" font-size="32" font-weight="700" fill="#003262">Sealing a mold, from the board up</text>
  <text x="40" y="84" font-family="Inter" font-size="22" fill="#515f74">Read from the bottom: the board first, the laminate last.</text>

  <!-- laminate -->
  <rect x="40" y="110" width="340" height="50" fill="#ffffff" stroke="#141d2b" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="420" y="132" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">Laminate goes here</text>
  <text x="420" y="160" font-family="Inter" font-size="22" fill="#515f74">CS-006 infusion, CS-007 wet layup</text>

  <!-- PVA x2 -->
  <rect x="40" y="196" width="340" height="16" fill="url(#ss-pva)" stroke="#141d2b" stroke-width="2"/>
  <rect x="40" y="216" width="340" height="16" fill="url(#ss-pva)" stroke="#141d2b" stroke-width="2"/>
  <text x="420" y="212" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">Partall #10 PVA film ×2</text>
  <text x="420" y="240" font-family="Inter" font-size="22" fill="#141d2b">each coat dried to a gloss</text>

  <!-- wax x4 -->
  <g fill="#ffffff" stroke="#141d2b" stroke-width="2">
    <rect x="40" y="270" width="340" height="11"/><rect x="40" y="285" width="340" height="11"/>
    <rect x="40" y="300" width="340" height="11"/><rect x="40" y="315" width="340" height="11"/>
  </g>
  <text x="420" y="290" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">Formula Five wax ×4 (new mold)</text>
  <text x="420" y="318" font-family="Inter" font-size="22" fill="#141d2b">thin film, let it haze, buff between coats</text>
  <text x="420" y="346" font-family="Inter" font-size="22" fill="#141d2b"><tspan font-weight="700">Re-used mold:</tspan> Clean 'N Glaze, then 1–2 coats</text>

  <!-- the FEB hold -->
  <rect x="40" y="376" width="920" height="92" fill="#141d2b"/>
  <text x="64" y="416" font-family="Saira" font-size="28" font-weight="700" fill="#ffffff">HOLD 12 h after the last XCR coat</text>
  <text x="64" y="450" font-family="Inter" font-size="22" fill="#ffffff">FEB hold. Write the last-coat time on the Seal and release mold step.</text>

  <!-- XCR coat 2 -->
  <rect x="40" y="504" width="340" height="30" fill="#003262" stroke="#141d2b" stroke-width="2"/>
  <text x="420" y="520" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">XCR coat 2</text>
  <text x="420" y="548" font-family="Inter" font-size="22" fill="#141d2b">usually needed on 30 lb board;</text>
  <text x="420" y="575" font-family="Inter" font-size="22" fill="#141d2b">60 lb board often seals in one</text>

  <!-- fingernail check between coats -->
  <line x1="210" y1="630" x2="210" y2="542" stroke="#141d2b" stroke-width="3" marker-end="url(#ss-a)"/>
  <rect x="80" y="630" width="260" height="56" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="3"/>
  <text x="210" y="666" text-anchor="middle" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">Fingernail check</text>
  <line x1="210" y1="798" x2="210" y2="688" stroke="#141d2b" stroke-width="3"/>
  <text x="420" y="628" font-family="Inter" font-size="24" fill="#141d2b"><tspan font-weight="700">Firm but tacky:</tspan> coat 2 now, no prep</text>
  <text x="420" y="656" font-family="Inter" font-size="22" fill="#515f74">about 2 h 50 at 20 °C, 1 h 30 at 30 °C;</text>
  <text x="420" y="682" font-family="Inter" font-size="22" fill="#515f74">the state decides, not the clock</text>
  <text x="420" y="728" font-family="Inter" font-size="24" fill="#141d2b"><tspan font-weight="700">Tack-free:</tspan> wait ≥ 9 h, 120 grit,</text>
  <text x="420" y="756" font-family="Inter" font-size="24" fill="#141d2b">blow off, IPA wipe, then recoat</text>

  <!-- XCR coat 1 -->
  <rect x="40" y="800" width="340" height="30" fill="#003262" stroke="#141d2b" stroke-width="2"/>
  <text x="420" y="814" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">XCR coat 1, thin, never pooled</text>
  <text x="420" y="842" font-family="Inter" font-size="22" fill="#141d2b">≤ 150 g batch, 100:41 by weight</text>
  <text x="420" y="869" font-family="Inter" font-size="22" fill="#141d2b">pot life 8 min at 20 °C, 4 min at 30 °C</text>

  <!-- board -->
  <rect x="40" y="890" width="340" height="110" fill="url(#ss-board)" stroke="#141d2b" stroke-width="4"/>
  <text x="420" y="924" font-family="Inter" font-size="24" font-weight="700" fill="#141d2b">Machined tooling board</text>
  <text x="420" y="952" font-family="Inter" font-size="22" fill="#141d2b">blow off the dust, wipe with IPA,</text>
  <text x="420" y="979" font-family="Inter" font-size="22" fill="#141d2b">never acetone</text>
</svg>
