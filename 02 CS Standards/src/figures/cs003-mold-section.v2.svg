<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" font-family="Inter" fill="#141d2b">
  <!-- CS-003 §7.1: the design rules dimensioned on a female mold section,
       plus the max-Z rule as a split inset (app/slicer.js MAX_CUT_DEPTH_MM
       152.4, the split waiver in §7.1 step 6). -->
  <rect width="1000" height="940" fill="#ffffff"/>
  <defs>
    <marker id="ms-a" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#141d2b"/>
    </marker>
    <marker id="ms-b" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#003262"/>
    </marker>
    <marker id="ms-bs" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M12,0 L0,5 L12,10 z" fill="#003262"/>
    </marker>
    <pattern id="ms-board" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#ffffff"/>
      <circle cx="3.5" cy="3.5" r="1.3" fill="#515f74"/><circle cx="10.5" cy="10.5" r="1.3" fill="#515f74"/>
    </pattern>
  </defs>

  <text x="30" y="46" font-family="Saira" font-size="32" font-weight="600" fill="#003262">The §7.1 design rules on one mold section</text>

  <!-- spindle -->
  <text x="470" y="96" font-size="22" font-weight="600" text-anchor="middle">spindle: 3-axis, from above only</text>
  <line x1="470" y1="108" x2="470" y2="160" stroke="#141d2b" stroke-width="3" marker-end="url(#ms-a)"/>

  <!-- mold body -->
  <path d="M40 480 L40 260 L250 260 L275 268 L305 420 Q311 440 333 440 L607 440 Q629 440 635 420 L665 268 L690 260 L900 260 L900 480 Z"
        fill="url(#ms-board)" stroke="#141d2b" stroke-width="3.5"/>
  <!-- glue lines, only through solid board -->
  <g stroke="#141d2b" stroke-width="2.2" stroke-dasharray="10 6">
    <line x1="40" y1="345" x2="288" y2="345"/><line x1="652" y1="345" x2="900" y2="345"/>
    <line x1="40" y1="460" x2="900" y2="460"/>
  </g>
  <rect x="52" y="382" width="212" height="64" rx="4" fill="#ffffff"/>
  <text x="60" y="408" font-size="22" fill="#141d2b">glued board stack</text>
  <text x="60" y="436" font-size="22" fill="#141d2b">Ure-Bond 90, §7.3</text>

  <!-- flange -->
  <text x="145" y="194" font-size="23" font-weight="700" fill="#003262" text-anchor="middle">flange ≥75 mm</text>
  <text x="145" y="220" font-size="22" fill="#515f74" text-anchor="middle">tape, spiral, trim</text>
  <line x1="42" y1="236" x2="248" y2="236" stroke="#003262" stroke-width="2" marker-start="url(#ms-bs)" marker-end="url(#ms-b)"/>
  <line x1="250" y1="226" x2="250" y2="256" stroke="#003262" stroke-width="1.2"/>

  <!-- scribes -->
  <path d="M236 261 l6 9 l6 -9" fill="none" stroke="#141d2b" stroke-width="2.5"/>
  <path d="M692 261 l6 9 l6 -9" fill="none" stroke="#141d2b" stroke-width="2.5"/>
  <polyline points="242,256 262,214 700,214" fill="none" stroke="#141d2b" stroke-width="1.2"/>
  <line x1="698" y1="256" x2="712" y2="214" stroke="#141d2b" stroke-width="1.2"/>
  <text x="712" y="128" font-size="23" font-weight="700" fill="#003262">scribe V-grooves</text>
  <text x="712" y="154" font-size="22">trim line + two datums,</text>
  <text x="712" y="180" font-size="22">must survive sealing</text>
  <text x="712" y="206" font-size="22" fill="#515f74">CS-004 §7.3 step 5</text>

  <!-- draft -->
  <line x1="276" y1="272" x2="276" y2="430" stroke="#141d2b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="470" y="312" font-size="23" font-weight="700" fill="#003262" text-anchor="middle">≥2° draft on</text>
  <text x="470" y="338" font-size="23" font-weight="700" fill="#003262" text-anchor="middle">deep walls</text>
  <text x="470" y="370" font-size="22" text-anchor="middle">no overhang from</text>
  <text x="470" y="396" font-size="22" text-anchor="middle">the spindle direction</text>

  <!-- fillet -->
  <circle cx="324" cy="432" r="18" fill="none" stroke="#141d2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="316" y1="449" x2="200" y2="540" stroke="#141d2b" stroke-width="1.2"/>
  <text x="40" y="566" font-size="23" font-weight="700" fill="#003262">internal fillets ≥</text>
  <text x="40" y="592" font-size="22">finishing-tool radius</text>

  <!-- divot -->
  <path d="M462 440 L470 452 L478 440 Z" fill="#141d2b"/>
  <line x1="470" y1="454" x2="470" y2="540" stroke="#141d2b" stroke-width="1.2"/>
  <text x="470" y="566" font-size="23" font-weight="700" fill="#003262" text-anchor="middle">conical divots</text>
  <text x="470" y="592" font-size="22" text-anchor="middle">mark hole locations</text>
  <text x="470" y="618" font-size="22" fill="#515f74" text-anchor="middle">§7.1 step 7</text>

  <!-- minimum section: the floor -->
  <line x1="580" y1="443" x2="580" y2="478" stroke="#003262" stroke-width="2" marker-start="url(#ms-bs)" marker-end="url(#ms-b)"/>
  <line x1="586" y1="470" x2="720" y2="540" stroke="#141d2b" stroke-width="1.2"/>
  <text x="960" y="566" font-size="23" font-weight="700" fill="#003262" text-anchor="end">no section under 15 mm</text>
  <text x="960" y="592" font-size="22" text-anchor="end">tooling board snaps</text>

  <!-- height -->
  <line x1="940" y1="262" x2="940" y2="478" stroke="#003262" stroke-width="2" marker-start="url(#ms-bs)" marker-end="url(#ms-b)"/>
  <line x1="904" y1="260" x2="952" y2="260" stroke="#003262" stroke-width="1.2"/>
  <line x1="904" y1="480" x2="952" y2="480" stroke="#003262" stroke-width="1.2"/>
  <text x="960" y="246" font-size="22" font-weight="700" fill="#003262" text-anchor="end">max Z 6 in (152.4 mm)</text>

  <!-- ===== split inset ===== -->
  <line x1="30" y1="650" x2="970" y2="650" stroke="#dde3ec" stroke-width="2"/>
  <text x="30" y="694" font-family="Saira" font-size="27" font-weight="600" fill="#003262">Over 6 in (152.4 mm): split into sections</text>

  <rect x="170" y="726" width="260" height="80" fill="url(#ms-board)" stroke="#141d2b" stroke-width="3"/>
  <rect x="170" y="806" width="260" height="100" fill="url(#ms-board)" stroke="#141d2b" stroke-width="3"/>
  <line x1="150" y1="806" x2="450" y2="806" stroke="#141d2b" stroke-width="5"/>
  <text x="458" y="814" font-size="22" font-weight="700">SPLIT</text>
  <!-- dowels across the split -->
  <rect x="216" y="784" width="14" height="44" fill="#141d2b"/>
  <rect x="370" y="784" width="14" height="44" fill="#141d2b"/>
  <line x1="384" y1="826" x2="452" y2="872" stroke="#141d2b" stroke-width="1.2"/>
  <text x="458" y="880" font-size="22">dowels</text>
  <text x="158" y="774" font-size="22" fill="#515f74" text-anchor="end">section 2</text>
  <text x="158" y="864" font-size="22" fill="#515f74" text-anchor="end">section 1</text>

  <g font-size="22">
    <text x="570" y="744">The planner splits any stack</text>
    <text x="570" y="772">over 6 in. Dowels and datums</text>
    <text x="570" y="800">go in the CAD, not at the machine.</text>
    <text x="570" y="840" fill="#515f74">Waived only when the cutter</text>
    <text x="570" y="868" fill="#515f74">stays within 6 in of a face it</text>
    <text x="570" y="896" fill="#515f74">can reach (§7.1 step 6).</text>
  </g>
</svg>
