<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1140" font-family="Inter" fill="#141d2b">
  <!-- CS-010 §7.1 path decision, v2 (brief A). Questions: thin ink border.
       Outcomes: heavy blue border with a gold strip. Bad-fit state: grey fill.
       "No" exits run right into one bus; RECONSIDER Yes joins it with its own arrowhead. The unproven-path rule is a footer line. -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#141d2b"/>
    </marker>
  </defs>
  <rect width="1000" height="1140" fill="#ffffff"/>

  <!-- start -->
  <rect x="30" y="20" width="470" height="80" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="265" y="54" font-size="22" font-weight="700" text-anchor="middle">CF part that must be grounded</text>
  <text x="265" y="84" font-size="22" text-anchor="middle">decide before any layup work</text>
  <line x1="265" y1="100" x2="265" y2="138" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Q1 geometry -->
  <rect x="30" y="140" width="470" height="110" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="50" y="174" font-family="Saira" font-size="24" font-weight="700" fill="#003262">1  GEOMETRY</text>
  <text x="50" y="206" font-size="22">Large open laminate where</text>
  <text x="50" y="234" font-size="22">mesh lays flat in the stack?</text>
  <line x1="265" y1="250" x2="265" y2="298" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="280" y="281" font-size="22" font-weight="700">Yes</text>

  <!-- Q1 No -> bad fit -->
  <line x1="500" y1="215" x2="598" y2="215" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="549" y="205" font-size="22" font-weight="700" text-anchor="middle">No</text>

  <!-- Q2 permeability -->
  <rect x="30" y="300" width="470" height="140" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="50" y="334" font-family="Saira" font-size="24" font-weight="700" fill="#003262">2  PERMEABILITY (INFUSION)</text>
  <text x="50" y="366" font-size="22">Is the in-stack conductor</text>
  <text x="50" y="394" font-size="22">a permeable mesh?</text>
  <text x="50" y="424" font-size="22" font-style="italic" fill="#515f74">Foil, sheet or paint film blocks resin</text>
  <line x1="265" y1="440" x2="265" y2="488" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="280" y="471" font-size="22" font-weight="700">Yes</text>

  <!-- Q3 mass -->
  <rect x="30" y="490" width="470" height="140" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="50" y="524" font-family="Saira" font-size="24" font-weight="700" fill="#003262">3  MASS</text>
  <text x="50" y="556" font-size="22">Is mesh light enough for</text>
  <text x="50" y="584" font-size="22">a part this size?</text>
  <text x="50" y="614" font-size="22" font-style="italic" fill="#515f74">Mesh is heavy on a whole undertray</text>
  <line x1="265" y1="630" x2="265" y2="678" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="280" y="661" font-size="22" font-weight="700">Yes</text>

  <!-- Q4 access -->
  <rect x="30" y="680" width="470" height="110" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="50" y="714" font-family="Saira" font-size="24" font-weight="700" fill="#003262">4  ACCESS</text>
  <text x="50" y="746" font-size="22">Can a bare mesh tail end at an</text>
  <text x="50" y="774" font-size="22">accessible flange (grounding point)?</text>
  <line x1="265" y1="790" x2="265" y2="838" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="280" y="821" font-size="22" font-weight="700">Yes</text>

  <!-- outcome: mesh in the stack -->
  <rect x="30" y="840" width="470" height="150" rx="10" fill="#ffffff" stroke="#003262" stroke-width="6"/>
  <rect x="33" y="843" width="12" height="144" fill="#FDB515"/>
  <text x="62" y="878" font-family="Saira" font-size="26" font-weight="700" fill="#003262">COPPER MESH IN THE STACK</text>
  <text x="62" y="910" font-size="22">Permeable mesh, bare tail at the</text>
  <text x="62" y="938" font-size="22">grounding point (§7.2)</text>
  <text x="62" y="970" font-size="22" font-style="italic" fill="#515f74">e.g. diffuser, <tspan font-family="ui-monospace, Menlo, monospace" font-style="normal">WO-SN5-006</tspan></text>

  <!-- "No" exits from Q2-Q4 into the bus -->
  <line x1="500" y1="370" x2="550" y2="370" stroke="#141d2b" stroke-width="2.5"/>
  <text x="525" y="360" font-size="22" font-weight="700" text-anchor="middle">No</text>
  <line x1="500" y1="560" x2="550" y2="560" stroke="#141d2b" stroke-width="2.5"/>
  <text x="525" y="550" font-size="22" font-weight="700" text-anchor="middle">No</text>
  <line x1="500" y1="735" x2="550" y2="735" stroke="#141d2b" stroke-width="2.5"/>
  <text x="525" y="725" font-size="22" font-weight="700" text-anchor="middle">No</text>
  <!-- Q5 Yes joins the bus from the right -->
  <line x1="600" y1="425" x2="556" y2="425" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="575" y="415" font-size="22" font-weight="700" text-anchor="middle">Yes</text>
  <!-- the bus -->
  <path d="M 550 370 V 770 H 598" fill="none" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <circle cx="550" cy="425" r="5" fill="#141d2b"/>
  <circle cx="550" cy="560" r="5" fill="#141d2b"/>
  <circle cx="550" cy="735" r="5" fill="#141d2b"/>

  <!-- bad fit -->
  <rect x="600" y="140" width="370" height="150" rx="10" fill="#dde3ec" stroke="#141d2b" stroke-width="2.5"/>
  <text x="620" y="174" font-family="Saira" font-size="24" font-weight="700" fill="#003262">BAD FIT FOR MESH</text>
  <text x="620" y="206" font-size="22">Thin-walled, tapered, or</text>
  <text x="620" y="234" font-size="22">wrapped metal substrate</text>
  <text x="620" y="268" font-size="22" font-style="italic" fill="#515f74">e.g. catch can, <tspan font-family="ui-monospace, Menlo, monospace" font-style="normal">WO-SN5-026</tspan></text>
  <line x1="785" y1="290" x2="785" y2="338" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Q5: CF at all? -->
  <rect x="600" y="340" width="370" height="110" rx="10" fill="#ffffff" stroke="#141d2b" stroke-width="2.5"/>
  <text x="620" y="374" font-family="Saira" font-size="24" font-weight="700" fill="#003262">RECONSIDER</text>
  <text x="620" y="406" font-size="22">Does the part need</text>
  <text x="620" y="434" font-size="22">CF at all?</text>
  <line x1="785" y1="450" x2="785" y2="498" stroke="#141d2b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="800" y="481" font-size="22" font-weight="700">No</text>

  <!-- outcome: no CF -->
  <rect x="600" y="500" width="370" height="130" rx="10" fill="#ffffff" stroke="#003262" stroke-width="6"/>
  <rect x="603" y="503" width="12" height="124" fill="#FDB515"/>
  <text x="632" y="538" font-family="Saira" font-size="26" font-weight="700" fill="#003262">NO CF</text>
  <text x="632" y="574" font-size="22">Drop CF for this part</text>
  <text x="632" y="604" font-size="22" fill="#515f74">§7.1, bad-fit branch</text>

  <!-- outcome: surface path -->
  <rect x="600" y="690" width="370" height="160" rx="10" fill="#ffffff" stroke="#003262" stroke-width="6"/>
  <rect x="603" y="693" width="12" height="154" fill="#FDB515"/>
  <text x="632" y="728" font-family="Saira" font-size="26" font-weight="700" fill="#003262">SURFACE PATH</text>
  <text x="632" y="760" font-size="22">Copper strip or braid bonded</text>
  <text x="632" y="788" font-size="22">with epoxy, copper tape, or</text>
  <text x="632" y="816" font-size="22">conductive paint, after cure</text>

  <!-- footer -->
  <line x1="30" y1="1022" x2="970" y2="1022" stroke="#dde3ec" stroke-width="2"/>
  <text x="30" y="1056" font-size="22"><tspan font-weight="700">Path not proven by the team yet?</tspan> Prove it on a first article by §7.3 first.</text>
  <text x="30" y="1088" font-size="22">Write the answer and a one-line why in the note on <tspan font-weight="700">Stack frozen</tspan></text>
  <text x="30" y="1116" font-size="22">(on an Other run, in the note on the acceptance-criterion step).</text>
</svg>
