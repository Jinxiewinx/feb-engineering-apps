<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FEB Composites — scan</title>
<link rel="icon" href="/favicon.svg">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003262">

<!--
  q.html — where a scanned label lands.

  WHY THIS IS A SEPARATE PAGE AND NOT A ROUTE IN THE APP
  Someone standing at a shelf holding a mold needs an answer in about a second,
  possibly with no account, possibly on somebody else's phone, on RFS wifi that
  drops. index.html is the whole workspace: Firebase auth, eleven tabs, an STL
  slicer. This is one document read and about 200 lines.

  THE RULE THIS PAGE IS BUILT AROUND
  The ID is in the URL, so it is knowable with no network at all. That means the
  page must PAINT THE ID BEFORE IT ASKS FIREBASE ANYTHING. A dead-wifi scan still
  tells you what you are holding; everything else is enrichment. tools/
  test_q_landing.mjs asserts this at under 100ms, against a request that never
  resolves.

  WHAT IT MAY SHOW
  Only pub/<ID>, which is a whitelist projection built by pubProjection() in
  labels.js and enforced a second time by a hasOnly() clause in firestore.rules.
  No names, no emails, no layup stacks, no storage URLs (a getDownloadURL token
  is a bearer credential and works regardless of storage.rules), nothing from
  budget. If you are tempted to add "just one more useful field" here, add it to
  pubProjection and the rules first, and think about the fact that this URL is
  readable by anyone in the world who can guess an ID.
-->

<style>
  /* Self-contained rather than importing the design system: this page must
     render with one HTTP request. The tokens below are copied from
     05 Design System/tokens.css and must stay recognisably FEB, but they are
     not load-bearing enough to justify a second round trip on shop wifi. */
  :root {
    --blue: #003262; --gold: #FDB515; --accent: #2f6be4;
    --ink: #141d2b; --muted: #515f74; --faint: #616e83;
    --canvas: #eef1f6; --card: #fff; --line: #dde3ec;
    --radius: 6px; --r-lg: 14px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8edf5; --muted: #9aa8bd; --faint: #8493a8;
            --canvas: #0e1622; --card: #16202f; --line: #26344a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; background: var(--canvas); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 460px; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header .mark { width: 26px; height: 26px; flex: 0 0 auto; }
  header b { font-size: 15px; letter-spacing: .01em; }
  header span { color: var(--faint); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--r-lg); padding: 18px; }

  /* The two things that must be legible across a shop with the phone at arm's
     length, and the only two that are knowable offline. */
  .cls { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
         color: var(--faint); font-weight: 700; }
  .id { font-size: clamp(26px, 8vw, 34px); font-weight: 800; letter-spacing: -.02em;
        line-height: 1.05; margin: 2px 0 0;
        /* An ID is a code: it must never be broken across lines mid-token, and
           it must never widen the layout viewport (which zooms the whole page
           out on mobile Safari). */
        overflow-wrap: anywhere; }
  .name { font-size: 19px; font-weight: 600; margin-top: 6px; overflow-wrap: anywhere; }

  .rows { margin-top: 16px; border-top: 1px solid var(--line); }
  .row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row dt { flex: 0 0 84px; color: var(--faint); font-size: 13px; margin: 0; }
  .row dd { margin: 0; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }

  /* Body weight, not small print: this says what the thing IS. A rule down the
     left rather than a tint behind it, so it survives greyscale and a phone in
     bright sun; the sentence carries the meaning on its own and the gold is
     decoration. Every pub document ever written has had note:"" — this is the
     first thing that fills it, so nothing that exists today changes. */
  .note { margin: 14px 0; padding: 10px 12px; font-size: 14px; font-weight: 600;
          color: var(--ink); background: var(--card);
          border: 1px solid var(--line); border-left: 4px solid var(--gold);
          border-radius: var(--radius); }
  .state { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius);
           background: color-mix(in srgb, var(--accent) 8%, transparent);
           color: var(--muted); font-size: 14px; }
  .state.bad { background: color-mix(in srgb, #c0392b 10%, transparent); }

  .go { display: block; margin-top: 18px; text-align: center; text-decoration: none;
        background: var(--blue); color: #fff; font-weight: 600;
        padding: 13px 16px; border-radius: var(--radius);
        /* 44px minimum target: this gets tapped with gloves on. */
        min-height: 46px; }
  .go:hover { background: #024a86; }
  footer { margin-top: 20px; color: var(--faint); font-size: 12.5px; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M40 18 H86 L60 52 H14 Z" fill="#2f6be4"/>
      <path d="M40 50 H86 L60 84 H14 Z" fill="#fdb515"/>
    </svg>
    <b>FEB Composites</b><span>scan</span>
  </header>

  <main class="card">
    <div class="cls" id="cls">&nbsp;</div>
    <h1 class="id" id="id">&nbsp;</h1>
    <div class="name" id="name"></div>
    <dl class="rows" id="rows" hidden></dl>
    <div class="state" id="state">Looking this up…</div>
    <a class="go" id="go" href="/">Open in the app</a>
  </main>

  <footer>Formula Electric at Berkeley · <a href="/">feb-composites.web.app</a></footer>
</div>

<script>
/* A classic script, deliberately, not type="module". Dynamic import() works
   here just as well (it is how firebase gets loaded below), and keeping the
   page in global scope means tools/test_q_landing.mjs can drive render()
   directly instead of the test having to stand up a fake Firestore. A page this
   small gains nothing from module scope. */
/* Paint first, ask Firebase second. The ID is in the URL, so a scan with no
   signal still answers "what am I holding". Everything below this line is
   enrichment on top of an already-useful page. */

const raw = decodeURIComponent(location.pathname.replace(/^\/+[Qq]\/+/, "")).trim();
const ID = raw.toUpperCase().replace(/[^0-9A-Z-]/g, "");

const $ = id => document.getElementById(id);
const setText = (el, s) => { $(el).textContent = s; };

// The class word from the prefix, so the page can say PART or MOLD before any
// network call. Kept in step with ID_PREFIX in fb.js and labelClass() in
// labels.js; a prefix missing here degrades to the prefix itself, never to a
// blank or a wrong word.
const CLS = {
  WO: "Work order", P: "Part", CP: "Cured part", MOLD: "Mold", PNL: "Test panel",
  BRD: "Tooling board", FAB: "Fabric lot", RSN: "Resin lot", CON: "Consumable",
  JIG: "Jig", BIN: "Storage", STK: "Stack plan", DOC: "Document",
  RDS: "R&D study", CPN: "R&D coupon",
};
const prefix = (ID.match(/^([A-Z]+)-/) || [])[1] || "";

if (!ID) {
  setText("cls", "Not a code");
  setText("id", "—");
  $("state").textContent = "That link has no record ID in it. Check the label, or open the app and search.";
  $("state").className = "state bad";
} else {
  setText("cls", CLS[prefix] || prefix || "Record");
  setText("id", ID);
  // Hash route, not a path: the app is a single page and this is never scanned,
  // so it does not have to stay inside the QR alphanumeric charset.
  $("go").href = "/#/" + ID;
  load();
}

/* A hanging request is the normal RFS failure, not a refused one: the wifi
   associates, DNS resolves, and nothing ever comes back. Without this the page
   sits on "Looking this up…" forever and the user cannot tell the difference
   between slow and dead. Five seconds is long enough for a bad connection to
   still win and short enough that nobody stands there wondering. */
const LOOKUP_TIMEOUT_MS = 5000;
let settled = false;
function giveUp(msg) {
  if (settled) return;
  settled = true;
  const el = $("state");
  if (!el) return;
  el.textContent = msg;
  el.className = "state bad";
}
setTimeout(() => giveUp("Couldn't reach the database — it's taking too long. The ID above comes from the label itself, so it's still correct."), LOOKUP_TIMEOUT_MS);

async function load() {
  // Loaded from the CDN the same way fb.js does.
  try {
    const [{ initializeApp }, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"),
    ]);
    /* ABSOLUTE, not "./". This page is served at /Q/<ID> by a hosting rewrite,
       so a relative URL resolves to /Q/firebase-config.js — which the same
       rewrite happily answers with q.html itself. The import then "succeeds"
       against a lump of HTML, FIREBASE_CONFIG never gets set, and every scan
       reports "couldn't reach the database" while the network is perfectly
       fine. Only reproducible on the deployed host; the local test server has
       no rewrite. */
    await import("/firebase-config.js").catch(() => {});
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.projectId) throw new Error("not configured");

    const db = fs.getFirestore(initializeApp(cfg));
    const snap = await fs.getDoc(fs.doc(db, "pub", ID));

    if (settled) return;                 // the watchdog already spoke
    if (!snap.exists()) {
      giveUp("No record with this ID yet. Either the label was printed before the record was saved, or this code belongs to another season.");
      return;
    }
    settled = true;
    render(snap.data());
  } catch (e) {
    // Offline, blocked, or misconfigured all land here, and all have the same
    // honest answer: the ID above is right, the rest needs a connection.
    giveUp("Couldn't reach the database. The ID above comes from the label itself, so it's still correct.");
  }
}

function render(d) {
  if (d.cls) setText("cls", CLS[d.cls] || d.cls);
  if (d.name) setText("name", d.name);

  const rows = [
    ["Stage", d.status],
    ["Location", d.location],
    ["Work order", d.wo && d.wo !== ID ? d.wo : ""],
    ["Revision", d.rev],
    ["Updated", fmt(d.updatedAt)],
  ].filter(([, v]) => v);

  if (rows.length) {
    $("rows").innerHTML = rows
      .map(([k, v]) => `<div class="row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`)
      .join("");
    $("rows").hidden = false;
  }
  if (d.note) {
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = d.note;
    // ABOVE the facts, not below them. `note` is the one line on this page that
    // qualifies WHAT THE OBJECT IS rather than reporting one of its fields, so
    // it changes how every row under it should be read.
    $("rows").before(n);
  }
  $("state").remove();
}

function fmt(ts) {
  if (!ts) return "";
  const s = String(ts);
  return s.length >= 10 ? s.slice(0, 10) : s;
}
// textContent everywhere above; this is only for the one innerHTML block, and
// it is here rather than imported because this page loads no app code.
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
</script>
</body>
</html>
