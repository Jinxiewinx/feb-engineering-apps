    #modal .modal { padding: 18px 16px; }
    #modal .modal .row2 { grid-template-columns: 1fr; }

    /* 16px form controls so iOS doesn't zoom the page on focus. Dense grids
       (timeline, detail sub-tables) already scroll horizontally, so this is safe.

       `.rte` is in this list because it is a contenteditable div, not a form
       control, so it fell through this rule and every other rule written for
       `input, select, textarea`. The composer was the one place in the app you
       type the most, and focusing it zoomed the viewport on every iPhone. */
    input, select, textarea, .rte { font-size: 16px; }

    /* Part details: two short columns beat one very long one — nine fields at
       one per row is most of a phone screen of label/value pairs. */
    .pgrid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .linkgrid { grid-template-columns: 1fr; gap: 8px; }
    /* The stepper writes to a database the whole team reads, so its steps are
       the last thing that may shrink on a phone. The label moves ABOVE the
       steps rather than beside them (which is what squeezed them in the first
       place), the steps take the full width of the card, and each one is at
       least 38px tall and 33% of the row wide — comfortably past a 34px target
       at 393px, and past it for a gloved thumb in the shop. Long names wrap
       onto more rows; they never get thinner. */
    .pstage { grid-template-columns: minmax(0, 1fr); padding: 9px 10px; gap: 7px; }
    .pstage .ps-cap { grid-column: 1; }
    .pstage .ps-steps { gap: 7px; }
    .pstep { min-height: 38px; flex: 1 0 auto; min-width: calc(33.333% - 5px); padding: 8px 12px;
      white-space: normal; text-align: center; }
    .undobar { flex-wrap: wrap; }
    /* The pinned season tiles are worth their space on a wide screen, where the
       index and the part share it. On a phone the index IS the other screen and
       already carries them, so here they only push the record down 110px. */
    .pstats.compact { display: none; }
    /* Seven stations, mostly "open", is six screens of nothing on a phone —
       the same reasoning as .tl-cell.empty in the Timeline. Show what is
       actually booked; the count is in the heading either way. */
    .stn.off { display: none; }
    /* Two tiles, one row. Two classes, to match the specificity of the base
       rule that caps them at 210px — with one class this lost and the tiles
       stacked one per row, eating the top of the phone screen. */
    /* Four at-a-glance tiles at a 70px floor still fit on one line at 393, so
       they each get about 84px — and "PURCHASES" at 11px uppercase is wider
       than that, so its last letter crossed the tile's border and "WORK
       ORDERS" broke onto two lines while its neighbours stayed on one. Two up,
       two down, with a floor that cannot be beaten by a long word. */
    .gitem { min-width: calc(50% - 5px); }
    .gitem .gl { overflow-wrap: anywhere; }
  }

  /* Touch devices get larger tap targets regardless of width. */
  @media (pointer: coarse) {
    /* Belt-and-braces for the viewport meta's maximum-scale=1: the two inputs
       a phone actually types into get real 16px type, so even a browser that
       ignores the meta has no sub-16px input to zoom in on. */
    #scan-manual, .rxgrid input, .rxgrid select { font-size: 16px; }
    .lc-open { min-height: 40px; display: inline-flex; align-items: center; }
    button, .icon-btn, .hamburger { min-height: 40px; }
    .mtxcell { min-height: 40px; min-width: 40px; }
    /* A rail row is a div[onclick]. A short work-order name over one meta line
       measured 35px at 393 in the phone mini-rail; found when fixtures first
       carried a LIVE run. */
    .pitem, .pmini { min-height: 44px; }
    /* A chip is a reference AND the way you get to it, and it was 22px — half a
       fingertip, and on the Dashboard the only route into a record. Padding
       rather than min-height: a chip sits inline in a sentence and in a table
       cell, so growing the box is what makes it hittable without pushing the
       text off its own baseline. 36px + the row's own padding clears a gloved
       thumb; a bare min-height would have left a 12px glyph floating in it. */
    .chip { padding: 10px 12px; min-height: 40px; }
    /* The Tickets kind filter — All / Projects / Issues — is three <span
       onclick> at 31px. Found the moment the tap-target check learned to look
       at [onclick] at all; it had been failing silently since it was written. */
    .kindfilter span { padding: 11px 14px; }
    /* The filename under a file card. A 40px min-height rather than more
       padding: the name is one clipped line either way, and padding alone put
       the text off-centre in the strip. */
    .fileitem .fn a { min-height: 40px; display: flex; align-items: center; }
    /* The part name in a work-order group header is a way into that part, so it
       is a tap target and measured as one — 14px of bare text otherwise. Same
       min-height idiom as the filename above, for the same reason. */
    .pgrouphd .pg-open { min-height: 40px; display: inline-flex; align-items: center; }
    /* Same trap, same fix, on the blueprint's part name. `all: unset` throws
       away the button's own minimum, and the stretched ::after is not part of
       the element's own rect — so the tap-target audit measures the 16px of
       text and nothing else, however large the line around it is. */
    .sl-open { min-height: 40px; display: inline-flex; align-items: center; }
    .sline { min-height: 44px; }
    /* No Cmd key on a phone, so this is an instruction nobody can follow. */
    .kbdhint { display: none; }
    /* Same reasoning as the phone rules above, but keyed on the pointer: a
       touchscreen at any width gets the bigger step. */
    .pstep { min-height: 40px; padding: 9px 14px; }
    .sb-item { padding: 11px 12px; }
    /* Scoped to the CONTROL, not to the container it happens to sit in. This
       used to read `.filters select, .filters input, .toolbar select`, so a
       control earned a thumb-sized target only by being inside one of two
       specific bars. Everything else missed: the Tickets search box measured
       24px, the Parts one 31px, and the People role select 21px, all on a
       phone. Which container a control lives in has nothing to do with how big
       a finger is. */
    /* `.rte` again: same contenteditable-is-not-a-form-control problem. It kept
       its 60px desktop height on a phone while the toolbar above it grew to
       three 40px rows, so the chrome was twice the size of the writing area. */
    input:not([type=checkbox]):not([type=radio]), select, textarea { min-height: 40px; }
    /* A checkbox is sized by its own box, so min-height does nothing to it and
       there is no honest way to make it 40px without it looking broken. 24px
       plus a 44px row is the compromise: the box is two-thirds bigger than the
       15px it was, and the row around it gives the thumb somewhere to land.
       This is the Weekly Plan goal list, ticked off in the shop with gloves
       on, so it is worth the two rules.

       .task-row is repeated in the selector on purpose. This block is the one
       place in the stylesheet where "later wins" is not enough: the rule up in
       the weekly-plan section is a class plus an attribute, so it outranks a
       bare element selector wherever that sits. Matched here rather than
       reordered, because moving it would break the file's one organising
       rule. */
    input[type=checkbox], input[type=radio],
    .task-row input[type=checkbox] { width: 24px; height: 24px; }
    .task-row { min-height: 44px; }
    .picker .opt { padding: 9px 10px; }
  }

  @media print {
    /* A folded material group prints its containers: this page is the stock
       walk, and a walk sheet missing eight of ten jugs is not a walk sheet. */
    .invgrp-body.folded { display: block; }
    /* Force light tokens on paper no matter the on-screen theme, so a work order
       printed in dark mode is still black-on-white (print.css and the fallback
       path both read --ink / --surface). */
    :root, :root[data-theme="dark"] {
      color-scheme: light;
      --ink: #000; --muted: #333; --faint: #555;
      --canvas: #fff; --card: #fff; --surface: #fff; --surface-2: #fff; --fill: #fff; --hover: #fff;
      --line: #000; --border-2: #000; --brand-ink: #003262;
    }
    /* margin: 0, and the 0.45in lives as PADDING inside the printed elements
       instead. The browser draws its own header and footer (the site URL and
       the date) into the @page margin band; with no band there is no chrome,
       and the paper carries only the sheet. The effective content box stays
       7.6in x 10.1in, which PAGE_IN (print.js) and the drawing sheet
       constants (drawings.js) are derived from — change one, change all. */
    @page { size: letter; margin: 0; }
    /* The token block above has just re-pointed these for paper; read them,
       so a change to the print palette lands in one place rather than four. */
    body { background: var(--surface); }

    /* A work order prints as the purpose-built traveler in #printroot, never as
       a restyled screen view — body.sheet says a sheet is mounted. Every other
       tab still prints the old way, so the status board keeps working. */
    body.sheet #app, body.sheet #modal, body.sheet #toasts { display: none !important; }
    body:not(.sheet) #printroot { display: none !important; }
    #printroot, body.sheet #printroot { display: block !important; background: var(--surface) !important; padding: 0 !important; }
    #printroot .no-print { display: none !important; }
    /* zoom:1 undoes the fit-to-screen shrink print.css applies while previewing
       on a phone. Without it the sheet prints at whatever fraction the screen
       needed — a Letter traveler landing at half size in the corner of the page.
       Horizontal padding stays (it used to collapse to 0 here): with @page
       margin 0 the element's own padding IS the side margin now. Vertical
       margins come from table.pgflow's repeating spacer rows instead,
       because padding on a flowing element exists only on its first and
       last page, and the traveler flows across two. */
    #printroot .ws-page { width: auto; min-height: 0; padding: 0 0.45in; margin: 0; box-shadow: none !important; zoom: 1 !important; }
    /* A drawing sheet DOES want to fill its page: the title block floats to the
       foot with margin-top:auto, and with min-height:0 there is no foot to float
       to, so it would sit halfway up under the drawing. 10.92in border-box =
       the old 10.02in content floor + 0.9in of padding, just under the 11in
       page so rounding can't spill one sheet onto two. Full padding is fine
       HERE, unlike the traveler: a drawing sheet is one element per physical
       page, so its padding exists on every page it prints. */
    #printroot .dwg-page { padding: 0.45in; min-height: 10.92in; }
    #printroot.gray .ws-page { filter: none; }   /* proof toggle is a screen aid only */
    /* Repeats the identifying footer on every physical page — inside the
       padded band, since with @page margin 0 the paper edge is at 0. */
    #printroot .ws-foot { position: fixed; bottom: 0.45in; left: 0.45in; right: 0.45in; background: var(--surface); }

    /* Fallback path: other tabs, unchanged. */
    nav.sidebar, header.topbar, .filters, .toolbar, button, .no-print, .rte-toolbar { display: none !important; }
    /* ...except a Timeline cell, which is a button because tapping it opens
       the assign picker. Without this the blanket rule above prints an empty
       schedule: every assignment in the grid is inside one of these. Empty
       cells still go, since paper has no picker to open. */
    #main .tl-cell { display: flex !important; border: none; }
    #main .tl-cell.empty { display: none !important; }
    #main .tlgrid { overflow: visible; box-shadow: none; }
    /* ...and a chip, which is a <button> for the tap-target audit's sake but
       on paper is just the record's name. Without this the status board's
       every work order, blocker and deadline vanished from the printout. */
    #main .chip { display: inline !important; border: none; background: none; padding: 0; font: inherit; color: inherit; }
    /* ...and the same for a blueprint line's name, which is a <button> for
       exactly the reasons the chip is: focusable, Enter-able, and a real tap
       target the audit can measure. On paper it is the part's name and nothing
       else. Without this the printed Season tab is a page of dates and status
       chips with no idea what any of them is about. */
    #main .sl-open { display: inline !important; font: inherit; font-weight: 600; color: inherit; }
    /* One line per part on paper, as on screen. It was two columns while a
       line was five short fields; at eight it no longer fits beside itself, and
       a season printed in two half-width columns would drop the last three
       columns off both. The column names print with it — a page of blank cells
       needs them more than the screen does, since paper has no tooltip. */
    #main .sline { break-inside: avoid; box-shadow: none; border-color: transparent; }
    #main .shead { break-inside: avoid; break-after: avoid; }
    /* The budget list's inline editors print as the plain values they show:
       a form control on paper is chrome around a number. */
    .list .statusdrop select, .buy-cost input, .buy-cat { border: none; background: none; padding: 0; appearance: none; color: inherit; }
    /* The status board prints one section under the next; side-by-side cards
       waste a page's width on paper. columns:1 because the screen layout is
       masonry columns now, and display:block alone would leave it multi-column
       on paper. */
    .rgrid { display: block; columns: 1; }
    .rgrid .card { margin-bottom: 8px; break-inside: avoid; }
    /* A canvas is not a dependable printed artifact, and the exploded SVG
       already is one — it's what gets initialled for CS-003 §7.2. */
    .meshview { display: none !important; }
    body:not(.sheet) #app { display: block; } .content { display: block; }
    /* 0.45in, not 0: with @page margin 0 this padding is the only thing
       keeping a fallback-path tab (the Reports board, Documents) off the
       paper edge. Sheet-path prints hide #app entirely, so this never adds
       to a traveler's margins. */
    main { max-width: none; padding: 0.45in; }
    /* Paper wants the record, not the navigation: print the selected part (or
       the season overview when none is selected), never the index beside it. */
    .mdsplit, .tksplit { display: block; } .mdindex, .keyhint, .mdnav, .secnav { display: none !important; }
    /* Folds are screen furniture. Paper gets the whole record — without this,
       a section somebody left folded silently vanishes from the printout. */
    .wosec-body { display: block !important; }
    /* The disposition record prints in full. A four-line clamp is a screen
       affordance; a truncated root cause on a printed nonconformance is not. */
    .conarr-t { -webkit-line-clamp: none; display: block; overflow: visible; }
    /* Paper never truncates: the attachment cap is a screen affordance. */
    .tkmeta .tkband-attach.capped { max-height: none; overflow: visible; }
    .tkmeta .tkband-attach.capped::after { display: none; }
    /* Paper can't be tapped: a stage prints as the value it is, not as six
       buttons one of which is filled in. */
    .pstep:not(.cur) { display: none !important; }
    .pstep.cur { box-shadow: none; border-color: var(--line); }
    .card { border: 1px solid var(--line); border-radius: 0; box-shadow: none; break-inside: auto; margin-bottom: 8px; padding: 10px 14px; }
    /* The print .card above is a SHORTHAND, so it resets anything the tier
       rules set on the border. Restate both tiers after it or the appendix
       comes back as eight identical boxes on paper, and the warned tint (which
       does not print anyway) leaves nothing behind. */
    .wosec[data-tier="ref"] { border: 0; border-top: 1px solid var(--line); padding: 8px 2px; }
    /* The hero is a screen affordance. On paper a traveler wants its content,
       not a photo band on every page, and min(22vh,…) resolves vh against the
       page box rather than the viewport. The image is still in Links & files. */
    .pt-hero { display: none !important; }
    .wosec[data-warn] { border: 1.5pt solid #000; }
    .card h2, .card h3 { break-after: avoid; }
    .grid, .stackviz { break-inside: avoid; }
    table.sub thead { display: table-header-group; } table.sub tr { break-inside: avoid; }
    .step { break-inside: avoid; } .step .buyoff button { display: none; }
    a { color: var(--ink); text-decoration: none; }

    /* ---- comment threads on paper ----
       None of this existed. print.css is entirely the work-order traveler, and
       the fallback path below has no rule for prose, user tables or images — so
       a printed thread was unstyled and untested.

       Links first, because the rule above silently DESTROYS them: colour is
       dropped and the underline removed, so a hyperlink prints as ordinary
       black text and the address is simply gone. In a document type whose whole
       point is carrying links, that is the worst of the lot. These selectors
       are (0,1,1) so they beat the bare `a` regardless of order. */
    .prose a { color: var(--ink) !important; text-decoration: underline !important; }
    .prose a[href^="http"]::after { content: " <" attr(href) ">"; font-size: 8pt; font-weight: 400; word-break: break-all; }
    .prose .cgal a::after { content: none; }   /* its href is the image already on the page */

    /* --fill and --surface-2 are both #fff on paper, so every background tint
       that carried a distinction on screen is gone. The borders do the work. */
    .prose code, .prose pre { background: none; border: 0.75pt solid var(--line); }
    .prose pre { overflow: visible; white-space: pre-wrap; word-break: break-word; break-inside: avoid; }
    .tblwrap { overflow: visible !important; }
    .prose table { width: 100%; font-size: 9pt; break-inside: auto; }
    .prose thead { display: table-header-group; }   /* header repeats across pages */
    .prose tr { break-inside: avoid; }
    .prose th, .prose td { border: 0.75pt solid var(--line); padding: 3pt 5pt; }
    .prose th { background: none; border-bottom-width: 1.5pt; }
    .prose tbody tr:nth-child(even) td { background: none; }

    /* Nothing print-sized an image before, so a phone photo printed as a full
       page and could split across a break mid-photo. */
    .prose img { max-width: 100%; max-height: 3.2in; width: auto; break-inside: avoid; border: 0.75pt solid var(--line); background: none; }
    .cgal { grid-template-columns: repeat(3, 1fr); gap: 6pt; break-inside: avoid; }
    .cgal img { max-height: 1.4in; }

    /* 68ch is right in a 1180px column and wrong on a 7.6in page, where it
       would leave an inch of margin. On paper the page margin is the measure. */
    .prose, .prose > *, .prose p, .prose ul, .prose ol,
    .prose h1, .prose h2, .prose h3, .prose h4, .prose blockquote { max-width: none; }
    .prose { font-size: 10pt; line-height: 1.4; }
    .prose h1 { font-size: 15pt; } .prose h2 { font-size: 13pt; }
    .prose h3 { font-size: 11.5pt; } .prose h4 { font-size: 10pt; }
    .prose h1, .prose h2, .prose h3, .prose h4 { break-after: avoid; }

    /* A long comment SHOULD split — break-inside:avoid on a document-length
       block just pushes a mostly-empty page. What must not split is a comment
       away from the name on it. The .card print rule does not reach these. */
    .comment { break-inside: auto; border-radius: 0; box-shadow: none;
      border: 0.75pt solid var(--line); background: none; margin-bottom: 8pt; padding: 8pt 10pt; }
    .comment .chead { break-after: avoid; }

    #lightbox, .rte-bubble, .rte-insert, .composer, .composer-stub { display: none !important; }
    /* On paper a description is just the text. Its click-to-edit chrome is an
       affordance for a screen, and a faint box around a paragraph reads as a
       rendering fault once printed. */
    .richfield { border-color: transparent !important; background: none !important; padding: 0; margin: 0; }
    .rf-empty { display: none; }
  }
  /* ---- the boot splash ----
     Markup in the body, rules here, and BOTH ahead of every script: the app is
     33 classic <script> tags and a Firebase module, and until core.js has run
     there is no #main to write "Connecting…" into. What the team saw on a cold
     load at RFS was a white page, then an empty navy sidebar, then a bare card.

     It draws the mark's own two plies. febMark() is a Berkeley-blue
     parallelogram over a California-gold one, which is a two-ply layup already
     — so they arrive on the bias, the way you actually lay a 45, and settle
     into the stack the logo is.

     Everything here is scoped under #splash and nothing else reads these
     names, so this block cannot reach the app. */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
    background: var(--sb-bg); color: #fff;
    /* The sheet is navy in BOTH themes, so it cannot use --amber: the light
       value (#a25c00) is a brown meant for white paper and is almost unreadable
       here. This is the dark-theme amber, pinned locally and on purpose,
       because this element is always dark regardless of what the app is. */
    --sp-warn: #e0a53a;
    /* Opacity only, and pointer-events off with it: a splash that lingers as an
       invisible sheet over the app eats the first tap on the login field. */
    transition: opacity .28s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  .sp-mark { position: relative; width: 96px; height: 96px; }
  .sp-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
  /* Each ply slides in along its own skew, top one first. translate is on the
     <path>, so it moves in the SVG's own 100-unit space and scales with the
     mark instead of fighting the layout box. */
  .sp-ply { animation: sp-lay .7s cubic-bezier(.2,.8,.25,1) both; }
  .sp-ply.b { animation-delay: .12s; }
  @keyframes sp-lay {
    from { transform: translate(38px, -26px); opacity: 0; }
    to   { transform: translate(0, 0); opacity: 1; }
  }
  .sp-word { font-family: var(--font-display, inherit); font-weight: 700; font-size: 20px; letter-spacing: .3px;
    animation: sp-fade .5s ease .5s both; }
  .sp-word span { color: var(--gold); }
  /* The season's own lore, the same pool the dashboard's fact of the day draws
     from. A cold boot on shop wifi is dead time; this is the one place in the
     app where making someone wait can teach them something. */
  .sp-fact { max-width: 46ch; text-align: center; font-size: 13px; line-height: 1.55;
    color: var(--sb-text); animation: sp-fade .5s ease .75s both; }
  /* Only after the connection has visibly taken too long, so a fast load never
     flashes a worry at anyone. */
  .sp-slow { font-size: 12px; color: var(--sb-text); opacity: 0; transition: opacity .4s ease; }
  #splash.slow .sp-slow { opacity: .8; }
  @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---- the start-light gantry ----
     Five lamps, filling as five REAL boot milestones land, under a caption
     naming what is still outstanding. It is a readiness readout that happens to
     look like a start line, and that is the only reason it is allowed to look
     like one — a gantry that filled on a timer would be a fake progress bar,
     which is the same lie as a hardcoded clock.

     LAMPS FILL BY COUNT, not one named milestone per position. The milestones
     genuinely finish out of order — fonts usually beat auth, and on a warm
     cache the first data can land before the roster read returns — so a gantry
     that lit its third lamp before its first would read as broken rather than
     as honest. Five done is five lit, and the caption carries the detail.

     GOLD, NOT RED. Real start lights are red; in this app red is --bad and
     carries a status meaning on every other screen, so five red lamps on boot
     would be the loudest wrong signal in the product. Gold on navy is what the
     mark already is. */
  .sp-lights { display: flex; gap: 10px; animation: sp-fade .5s ease .35s both; }
  .sp-lamp { box-sizing: border-box; width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.05);
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
                box-shadow var(--t) var(--ease); }
  .sp-lamp.on  { background: var(--gold); border-color: var(--gold-2);
    box-shadow: 0 0 10px rgba(253,181,21,.55); }
  /* A step that FAILED, and it differs by SHAPE, not only by hue. Amber against
     gold is very nearly the same colour at 15px — the first build of this had a
     correctly-marked failed lamp that was simply invisible in a screenshot, and
     an invisible failure signal is the same as no failure signal. So a failed
     lamp is a hollow ring: unmistakably not a filled one, at any size, and
     legible to anyone who cannot separate the two hues at all.
     It also reads correctly as a thing that did not light. */
  .sp-lamp.bad { background: transparent; border: 3px solid var(--sp-warn); box-shadow: none; }
  /* min-height so the caption changing length never reflows the gantry above
     it — a jumping start line reads as a glitch. */
  .sp-step { margin: 0; min-height: 1.3em; font-size: 12px; letter-spacing: .04em;
    text-align: center; color: var(--sb-text); animation: sp-fade .5s ease .35s both; }
  #splash.failed .sp-step { color: var(--sp-warn); }
  /* Continue and Retry sit on one row; Retry exists only in the failed state,
     because a retry offered on a healthy boot is a button that does nothing
     anybody wants. */
  .sp-acts { display: flex; gap: 10px; align-items: center; }
  .sp-retry { display: none; }
  #splash.failed.ready .sp-retry { display: inline-block; }

  /* ---- saying go ----
     THE BUTTON IS THE DOOR, not an accelerator. Nothing else takes this sheet
     down: hideSplash no longer schedules its own dismissal, so the app waits
     behind the splash until somebody says go, however long that is.

     The affordance appears only under .ready, which core.js adds when the boot
     is genuinely finished — so it is a REPORT that the app has arrived, never a
     promise that it might. That is what makes a press safe, and it is also why
     the button can now be trusted to be the only way out: there is nothing to
     be stranded on. Under .failed it arms anyway, with different words, because
     a gate nobody can open is worse than a broken app you were warned about. */
  .sp-go, .sp-retry { opacity: 0; pointer-events: none; transition: opacity .3s ease;
    font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 999px;
    border: 1px solid var(--gold); background: none; color: var(--gold); cursor: pointer; }
  .sp-go:hover, .sp-retry:hover { background: var(--gold); color: var(--sb-bg); }
  /* Retry is the quieter of the two: the sheet has just told you something is
     wrong, and the useful press is usually still Continue. */
  .sp-retry { border-color: rgba(255,255,255,.35); color: var(--sb-text); font-weight: 500; }
  .sp-retry:hover { background: rgba(255,255,255,.12); color: #fff; }
  /* The house 44px floor, and unconditionally rather than under
     @media (pointer: coarse) — for two reasons. It matters more here than
     anywhere else in the app, because this is now the only way into the
     product, on a phone, in a shop, in gloves; and a splash has room to be
     generous on a desktop too, where 44px is a comfortable primary action
     rather than the dense-toolbar compromise the coarse block exists to undo.
     Keeping it out of that block also leaves the app's one coarse-pointer
     section the last one in the file, which test_app.mjs relies on to find it. */
  .sp-go, .sp-retry { min-height: 44px; padding: 11px 22px; }
  .sp-hint { font-size: 11.5px; color: var(--sb-text); opacity: 0; transition: opacity .3s ease; }
  #splash.ready .sp-go, #splash.ready .sp-retry { opacity: 1; pointer-events: auto; }
  #splash.ready .sp-hint { opacity: .7; }
  /* Arrival outranks a four-second worry: if the connection took long enough to
     earn the slow line and then landed, the slow line is no longer true. */
  #splash.ready .sp-slow { display: none; }

  /* A press the sheet cannot obey yet — the app is still connecting. The dip
     says the input was heard, which is the difference between a tap that is
     queued and a tap that was swallowed. */
  @keyframes sp-press { 50% { transform: scale(.975); } }
  #splash.press .sp-mark { animation: sp-press .14s ease; }

  /* ---- leaving: the mold opens ----
     The mark ARRIVES as two plies laid on the bias (sp-lay). Leaving, they part
     along that same bias and the sheet is drawn off on the 45 — the way a ply
     comes off a mold. Each ply leaves along its OWN diagonal rather than
     reversing sp-lay, because a reversal reads as an undo and this is meant to
     read as an opening. */
  @keyframes sp-part-a { to { transform: translate( 30px, -20px) scale(1.06); opacity: 0; } }
  @keyframes sp-part-b { to { transform: translate(-30px,  20px) scale(1.06); opacity: 0; } }
  #splash.enter .sp-ply.a { animation: sp-part-a .34s cubic-bezier(.4,0,.9,.4) both; }
  #splash.enter .sp-ply.b { animation: sp-part-b .34s cubic-bezier(.4,0,.9,.4) both; }
  /* LIGHTS OUT, and it goes first. On a real start line the lights do not fade
     down, they all extinguish together, and that instant IS the go signal —
     which is exactly what the press just was. Snapped off in 120ms rather than
     released through the .17s token transition, because a gantry that dims
     politely is a gantry that was never a start line. */
  @keyframes sp-out { to { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.28); box-shadow: none; } }
  #splash.enter .sp-lamp { animation: sp-out .12s linear both; }
  /* The text goes next, quietly. It is not the subject of the shot. */
  @keyframes sp-drop { to { opacity: 0; transform: translateY(6px); } }
  #splash.enter .sp-word, #splash.enter .sp-fact, #splash.enter .sp-go,
  #splash.enter .sp-retry, #splash.enter .sp-hint, #splash.enter .sp-slow,
  #splash.enter .sp-step { animation: sp-drop .18s ease .06s both; }

  /* ---- and the sheet is drawn off on the bias ----
     A CLIP, NOT A MOVE. The sheet used to translate 46% up and right, which
     shrinks it into a corner — it read as the window being minimised rather
     than as the app arriving. Clipping instead means the app is uncovered in
     place, already rendered, from the first frame.

     This also settles the objection the old comment raised against a
     cross-fade: that it "would spend 280ms as grey, because what is behind a
     navy full-bleed sheet is a white app". A wipe is never grey — at every
     frame each pixel is either fully navy or fully app.

     The cut runs along the same diagonal the plies arrive on (sp-lay comes in
     from up and to the right), and it retreats that way too, so the sheet
     leaves the way a ply comes off a mold. Both keyframes have four points, in
     the same order, which is what makes clip-path interpolate at all. The
     percentages overshoot the box hard so the start frame provably covers every
     aspect ratio and the end frame provably covers none.

     pointer-events goes off with the FIRST frame, not at the end: a sheet still
     catchable while it leaves eats the first tap on whatever it is uncovering,
     which is the same hazard the DOM removal in hideSplash exists to prevent. */
  @keyframes sp-wipe {
    from { clip-path: polygon(-200%  -50%, 300% 450%, 300% -300%, -200% -300%); }
    to   { clip-path: polygon(-200% -350%, 300% 150%, 300% -300%, -200% -300%); }
  }
  #splash.enter { animation: sp-wipe .32s cubic-bezier(.55,0,.85,.35) .12s both;
    transition: none; pointer-events: none; will-change: clip-path; }

  /* The app arrives rather than merely being uncovered: the rail first, then
     the page, on the same 12px rise. Short and once — this class is removed as
     soon as it has played, so nothing in the app is left carrying an animation
     it did not ask for. */
  @keyframes sp-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  #app.sp-arrive .sidebar { animation: sp-rise .26s var(--ease) both; }
  #app.sp-arrive .content { animation: sp-rise .26s var(--ease) .06s both; }
  /* The global reduce-motion rule clamps durations to .01ms, which lands every
     element on its `to` frame — the stacked mark, all three lines up. That is
     the right still image, so there is nothing to undo here beyond the
     transition, which would otherwise hold the sheet up for a third of a
     second with nothing moving. */
  @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
  /* Paper never gets the splash: ⌘P mounts #printroot and hides #app, and a
     fixed full-bleed sheet would print as one navy page in front of it. */
  @media print { #splash { display: none !important; } }
</style>

</head>
<body>
<div id="splash">
  <div class="sp-mark">
    <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path class="sp-ply a" d="M40 18 H86 L60 52 H14 Z" fill="#2f6be4"/>
      <path class="sp-ply b" d="M40 50 H86 L60 84 H14 Z" fill="#fdb515"/>
    </svg>
  </div>
  <div class="sp-word">FEB <span>Composites</span></div>
  <div class="sp-lights" id="sp-lights" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-label="Starting up">
    <span class="sp-lamp"></span><span class="sp-lamp"></span><span class="sp-lamp"></span><span class="sp-lamp"></span><span class="sp-lamp"></span>
  </div>
  <p class="sp-step" id="sp-step" aria-live="polite">Starting up&hellip;</p>
  <p class="sp-fact" id="sp-fact">Twill weave drapes around curves better than plain weave, and has fewer fiber crimps.</p>
  <div class="sp-slow">Still connecting — the shop wifi at RFS drops sometimes.</div>
  <div class="sp-acts">
    <button type="button" class="sp-go" id="sp-go">Continue</button>
    <button type="button" class="sp-retry" id="sp-retry">Retry</button>
  </div>
  <div class="sp-hint kbdhint">or press Enter</div>
</div>
<script>
  /* When the splash appeared, measured from here rather than from core.js.
     core.js is the tenth of thirty-three scripts, so a stamp taken there has
     already lost most of the parse the floor is meant to be covering. */
  window.__splashT0 = Date.now();

  /* Upgrade the fact to the day's own, once facts.js has parsed. Static text
     ships in the markup above because that is what paints on a cold load;
     FACTS is not defined yet at this point in the document.

     factOfTheDay(), NOT a random pick over FACTS. Three reasons, and the first
     is that the CSS comment above has always claimed this drew from "the same
     pool the dashboard's fact of the day draws from" and it never did: a raw
     random over FACTS misses FACT_POOL's double-weighting of the team's own
     lore. Second, consistency is what makes a 1.6-second glimpse worth having —
     the fact you half-read here is the one waiting on the dashboard, so you can
     finish it. Third, it is deterministic per UTC day, so the whole team sees
     the same fact and nothing has to be stored to keep it that way. */
  window.addEventListener("DOMContentLoaded", function () {
    try {
      var f = typeof factOfTheDay === "function" ? factOfTheDay(0) : null;
      var el = document.getElementById("sp-fact");
      if (f && f.t && el) el.textContent = f.t;
    } catch (e) { /* the shipped fact is a fine fact */ }
  });

  /* Anywhere on the sheet, or Enter / Space / Escape. All three keys route to
     the same armed path in splashGo, so none of them can strand anyone on the
     "Connecting…" card. Bound here rather than in core.js so the sheet answers
     a press from the first frame, before the app's scripts have run — at which
     point splashGo does not exist yet, hence the typeof guard. */
  document.getElementById("splash").addEventListener("click", function (e) {
    /* Retry is the one control on the sheet that is NOT "go". Without this test
       it would be swallowed by the go-anywhere handler and reload nothing,
       because the click bubbles to the sheet either way. Checked with closest()
       rather than on the button itself so a press that lands on the button's
       text node still counts. */
    if (e.target && e.target.closest && e.target.closest("#sp-retry")) {
      if (typeof splashRetry === "function") splashRetry();
      return;
    }
    if (typeof splashGo === "function") splashGo();
  });
  document.addEventListener("keydown", function (e) {
    if (!document.getElementById("splash")) return;
    if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
      e.preventDefault();
      if (typeof splashGo === "function") splashGo();
    }
  });
  /* THE SHEET NO LONGER LEAVES ON ITS OWN. It owns the screen until somebody
     presses Continue, and Continue does not arm until the boot has genuinely
     finished — so these two timers are about what to SAY while waiting and how
     to fail honestly, never about dismissing.

     At 12s something is wrong rather than slow. The right answer is to arm the
     button with different words, not to dismiss: splashFail marks whatever is
     still outstanding as failed, says which step it was, and offers Continue
     anyway alongside Retry. Nobody is locked out and nobody is told the app
     loaded when it did not. */
  setTimeout(function () { var el = document.getElementById("splash"); if (el) el.classList.add("slow"); }, 4000);
  setTimeout(function () {
    if (typeof splashFail === "function") { splashFail("Something is not responding."); return; }
    /* core.js never parsed, so there is no gate to arm and no app to gate — a
       thrown module, a bad deploy, a Firebase config that will not load. This
       is the one case that still dismisses by hand, because leaving a
       full-bleed navy sheet over the page forever is strictly worse than
       showing whatever did manage to render underneath it. */
    var el = document.getElementById("splash");
    if (el) { el.classList.add("gone"); setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el); }, 400); }
  }, 12000);
</script>
