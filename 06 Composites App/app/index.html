  #lightbox .lb-actions button:hover, #lightbox .lb-actions a:hover { background: var(--sb-hover); color: #fff; }
  /* Hover does not exist on a phone, and these four are now the primary way
     through a set of photos rather than an afterthought. Give the tap something
     to answer with, and give the keyboard a visible ring. */
  #lightbox .lb-actions button:active, #lightbox .lb-actions a:active { background: var(--sb-hover); color: #fff; transform: scale(.94); }
  #lightbox .lb-actions button:focus-visible, #lightbox .lb-actions a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* The coarse-pointer floor at the foot of this file is written for `button`,
     and #lb-dl is an <a> — so the download control rendered ~34px next to three
     40px neighbours. Same rule, stated for the anchor. */
  @media (pointer: coarse) {
    #lightbox .lb-actions button, #lightbox .lb-actions a { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
    /* …but `display` here outranks the UA's [hidden]{display:none}, and
       lbShow() hides the arrows with .hidden when there is only one photo. On a
       phone that left two dead controls on every single-photo set. */
    #lightbox .lb-actions button[hidden] { display: none; }
  }
  #lightbox .lb-stage {
    position: relative; z-index: 1; flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; overscroll-behavior: contain;
    padding: 0 max(8px, var(--sa-r)) 8px max(8px, var(--sa-l));
  }
  /* touch-action: none, because the viewer owns the gesture now (see
     installLightbox): pinch scales the photo itself, double-tap toggles fit
     and 2x, a drag pans while zoomed. Like .meshview canvas, unlike the old
     lightbox, which delegated pinch to the browser's page zoom and could
     never show more detail than the fitted image had. The transform needs
     overflow: hidden here — the zoomed photo intentionally exceeds the
     stage, and a scrollbar would fight the pan. */
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; background: var(--canvas); touch-action: none; transform-origin: center center; }
  #toasts { position: fixed; right: max(16px, var(--sa-r)); bottom: max(16px, var(--sa-b)); z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 10px 14px; border-radius: var(--radius); color: #fff; font-size: 13.5px; box-shadow: var(--shadow-md); max-width: 340px; opacity: 1; transition: opacity .3s, transform .3s; }
  .toast.hide { opacity: 0; transform: translateY(6px); }
  .toast.ok { background: var(--ok); } .toast.err { background: var(--bad); } .toast.info { background: var(--blue); }

  /* ---- modal ---- */
  #modal { position: fixed; inset: 0; display: none; z-index: 50; }
  #modal.open { display: block; }
  /* The backdrop is the scroll container, so its padding is what holds every
     modal card clear of the edges — and that means this one rule also covers
     the ⋯ menu, global search and the notifications panel, since core.js builds
     all three through openModal(). */
  #modal .backdrop { position: absolute; inset: 0; background: rgba(9,30,66,.54); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
    padding: max(40px, calc(var(--sa-t) + 12px)) max(16px, var(--sa-r)) max(40px, calc(var(--sa-b) + 12px)) max(16px, var(--sa-l)); }
  #modal .modal { background: var(--surface); border-radius: var(--r-md); width: 100%; max-width: 640px; box-shadow: var(--shadow-lg); padding: 22px 24px; }
  /* A modal that SHOWS rather than asks: a PDF to read, a table to correct.
     640px is right for a form and wrong for a drawing. */
  #modal .modal.wide { max-width: 980px; }
  /* .docview is 78vh on its own page, which inside a modal pushes the footer
     off the bottom. Same reasoning as .dl-prev .docview above. */
  #modal .modal .docview { height: min(68vh, 700px); }
  #modal .modal h2 { margin: 0 0 14px; font-size: 18px; }
  #modal .modal .field { margin-bottom: 12px; }
  #modal .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .moredetails { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; }
  .moredetails > summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--accent);
    list-style: none; padding: 4px 0; user-select: none; }
  .moredetails > summary::-webkit-details-marker { display: none; }
  .moredetails > summary::before { content: "▸ "; display: inline-block; transition: transform var(--t-fast) var(--ease); }
  .moredetails[open] > summary::before { content: "▾ "; }
  .moredetails[open] { padding-bottom: 4px; }
  /* Sticky against the backdrop (the actual scroll container) so Create/Save
     stays reachable on a short laptop screen — the new-ticket form is tall
     enough to push it below the fold at 800px. */
  #modal .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;
    position: sticky; bottom: -22px; z-index: 1; background: var(--surface);
    padding: 10px 0; margin-bottom: -10px; }

  /* ---- scanner ---- */
  /* The camera preview is capped by aspect-ratio rather than a fixed height so
     it stays inside a 320px phone modal without letterboxing. object-fit:cover
     because a squashed preview makes aiming at a 21mm code harder than it
     already is with gloves on. */
  .scanbox { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 46vh;
    border-radius: var(--radius); overflow: hidden; background: #000; }
  .scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* A target to aim at. Purely an affordance: detection uses the whole frame,
     so a code outside the box still reads — the retical just stops people
     holding the phone a foot away. */
  .scanret { position: absolute; inset: 18%; border: 2px solid var(--gold);
    border-radius: 8px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }

  /* ---- label builder ---- */
  /* The list is capped and scrolls rather than growing the modal: by March there
     are a few hundred labelable records, and a modal taller than the viewport
     puts the Preview button out of reach on a laptop. The .foot above is sticky
     for the same reason. */
  .chk { display: flex; align-items: center; gap: 8px; padding: 4px 2px; cursor: pointer; }
  .chk input { flex: 0 0 auto; }
  /* The custom-label composer's live preview (labels.js clPreviewHtml). The
     label itself is styled by print.css, which is a plain stylesheet and not
     wrapped in @media print, so what sits in the modal is the label at print
     size. These rules only give it somewhere to sit. */
  .cl-prev { margin: 10px 0 4px; overflow-x: auto; }
  .cl-prev .roll-page { margin: 0; box-shadow: 0 1px 6px rgba(0,0,0,.22); }
  /* Reserves its line whether or not there is a problem to report, so the
     fields below do not jump every time the text becomes valid. */
  .cl-warn { min-height: 1.25em; margin-bottom: 8px; }
  .lbpick { margin-top: 14px; }
  .lblist { max-height: 34vh; overflow: auto; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 4px 8px; background: var(--surface-2); }
  .lblist .chk { border-top: 1px solid var(--line); }
  .lblist .chk:first-child { border-top: none; }
  /* One sublocation in the EH&S import picker (ehsimport.js). */
  .lblist .ehsub { border-top: 1px solid var(--line); }
  .lblist .ehsub:first-child { border-top: none; }
  .lblist .ehsub .chk { border-top: none; }
  /* The per-row unticks under a ticked sublocation. */
  .ehsub-rows { margin: 0 0 8px 26px; border-left: 2px solid var(--border-2); padding-left: 8px; }
  .ehsub-rows .ehsrow { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .ehsub-rows .ehsrow .muted { margin-left: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ehsub-rows .ehsrow-pad { width: 13px; flex: none; }

  /* ---- documents ---- */
  .doccat { margin-bottom: 8px; }
  .doclist { display: flex; flex-direction: column; }
  .docrow { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  .docrow:hover { background: var(--hover); }
  .docrow .di { font-size: 18px; width: 24px; text-align: center; }
  .docrow .dsz { margin-left: auto; font-size: 11.5px; color: var(--faint); }
  .docview { width: 100%; height: 78vh; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  /* ---- linked Google documents ----
     Deliberately built from .docrow / .doclist / .docview, which the Documents
     tab already defines: a linked doc on a work order and a bundled datasheet
     in the library should look like the same kind of thing, because they are.
     Only the bits that have no equivalent are new. */
  .doclink { border-top: 1px solid var(--line); }
  .doclink:first-child { border-top: none; }
  .doclink .docrow { border-top: none; }
  /* The title takes the slack so the type tag and Open button stay right-aligned
     the way .dsz does in the library, and a long doc name ellipsises instead of
     pushing them off the row. */
  .dl-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dsz .sm { margin-left: 8px; }
  .dl-cv { display: inline-flex; color: var(--faint); margin-left: 6px; vertical-align: middle; }
  /* An embedded Google frame goes silently blank when the viewer is signed into
     the wrong account, and a cross-origin iframe fires no error we can catch. So
     the frame is never the only thing here: the note under it is permanent, not
     an error state, because we cannot know whether it loaded. */
  .dl-prev { padding: 0 4px 10px; }
  .dl-prev .docview { height: 60vh; }
  .dl-prev p { margin: 6px 0 0; }
  /* ---- .prose — long-form typography ----
     ONE scope for every place this app renders a document: comment bodies, the
     ticket description, and the CS-standards markdown viewer. Those were three
     different answers to the same question, and two of them were "nothing" —
     .ctext had a single rule (images) so comment prose rendered at inherited
     14px with no paragraph rhythm, unbordered tables, and headings that came
     out SMALLER than the body text they headed.

     Styled by ELEMENT inside a trusted scope, never by class on the content:
     sanitizeHtml() deliberately forbids a class attribute so pasted markup
     cannot adopt app chrome. The scope class goes on the container we render.

     TWO WIDTHS, and they only work together. Prose is capped at a measure
     (50-75 characters is the readable band); tables, code blocks, galleries and
     images are never capped, because a layup schedule squeezed into 68ch stops
     being a table. Capping is applied to text-level elements BY NAME at any
     depth rather than with a full-bleed grid, because execCommand nests blocks
     inside <div> wrappers and `> *` would silently miss a table one level down. */
  .prose { font-size: 15px; line-height: 1.65; color: var(--ink); }
  .prose > *, .prose p, .prose ul, .prose ol, .prose h1, .prose h2, .prose h3,
  .prose h4, .prose blockquote { max-width: 68ch; }
  /* The ticket detail's wide column is the exception: the whole point of the
     widescreen revamp (metadata band, collapsed rail) was to hand this column
     the width, and a 68ch cap left the right half of every comment card
     empty. Simon asked for the text to use it. Everywhere else the measure
     cap stands. */
  .tkmain .prose > *, .tkmain .prose p, .tkmain .prose ul, .tkmain .prose ol,
  .tkmain .prose h1, .tkmain .prose h2, .tkmain .prose h3, .tkmain .prose h4,
  .tkmain .prose blockquote { max-width: none; }
  /* ---- long tokens ----
     A pasted Drive URL is about 120 characters with no space in it, and a CAD
     filename in the team's own convention (SN6_Undertray_..._REV-C.SLDPRT) is
     one word to the line breaker because underscores are not break
     opportunities. Neither can wrap by default, so one of them makes the
     widest line on the page ~680px, the document scrolls sideways, and mobile
     Safari fits the layout viewport to THAT — the whole page zooms out. This
     was the bug Simon reported and it is one declaration.

     `anywhere` rather than `break-word`: only `anywhere` also shrinks the
     element's min-content width, which is what a grid track and a table cell
     size themselves from. With `break-word` the text wraps and the box stays
     680px wide, which looks fixed in a screenshot and still scrolls the page.

     Applied to text the TEAM writes, not to the app's own chrome, so an id or
     a status pill still refuses to break mid-word. */
  .prose, .comment, .richfield, .chead, .meta, .dl-t, .gitem .gl { overflow-wrap: anywhere; }
  /* NOT IN A TABLE CELL, and this is the whole reason the rule is written as
     two declarations instead of one.

     A table already has the right answer to being too wide for a phone: it
     scrolls sideways inside its own box. table.sub gets that below 900px and a
     pasted table gets it from .tblwrap. But a cell that may break anywhere has
     a min-content width of one character, so instead of overflowing and
     scrolling, every column collapsed to its narrowest possible form and the
     table "fit". A pasted pull-test table came out with the header reading C /
     o / u / p / o / n down the page, "5110" split as "511 / 0", and a
     four-letter criterion broken as "mas / s". It measured clean — no
     overflow, nothing clipped, nothing off-screen — and was unreadable, which
     is the exact failure mode of fixing a layout by the numbers alone. Two
     independent reviewers looking at the screenshots called it the worst thing
     on the page.

     So cells wrap at spaces and hyphens like normal text, the table takes the
     width it needs, and the scroller does its job. */
  table td, table th { overflow-wrap: normal; word-break: normal; }
  .prose table, .prose pre, .prose .tblwrap, .prose .cgal,
  .prose > img, .prose > a > img { max-width: 100%; }

  /* Headings must reset .card h3's label styling. Both rules are specificity
     (0,1,1) and .card h3 declares text-transform/letter-spacing/color that a
     font-size-only override inherits — which is why every h3 in every CS
     standard renders as a 14px uppercase grey label today. */
  .prose h1, .prose h2, .prose h3, .prose h4 {
    font-family: var(--font-display); color: var(--ink);
    text-transform: none; letter-spacing: .01em; line-height: 1.25;
    margin: 1.4em 0 .45em; font-weight: 700;
  }
  .prose h1 { font-size: 22px; }
  .prose h2 { font-size: 19px; color: var(--brand-ink); }
  .prose h3 { font-size: 17px; }
  .prose h4 { font-size: 15px; }
  .prose > :first-child { margin-top: 0; }
  .prose p { margin: 0 0 .85em; }
  .prose p:last-child { margin-bottom: 0; }
  /* Without these, lists inherit the UA's 40px indent, which is enormous
     against 15px text. */
  .prose ul, .prose ol { margin: 0 0 .85em; padding-left: 1.5em; }
  .prose li { margin: .25em 0; }
  .prose li > ul, .prose li > ol { margin: .25em 0; }
  /* Underlined, not colour-only: these get printed, and colour is the first
     thing a laser drops. The glyph says the link leaves the app. */
  .prose a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .prose a[href^="http"]::after { content: "\2197"; font-size: .8em; color: var(--faint); margin-left: 3px; }
  .prose .cgal a::after, .prose a:has(> img)::after { content: none; }
  /* The border is not decoration. --fill is #1a2431 against a #141c28 card in
     dark (invisible) and #fff on paper (also invisible); the hairline is what
     carries the distinction in all three. */
  .prose code {
    background: var(--fill); border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em;
    /* A filename in inline code is one long token, so on a phone it wraps to
       three lines and reads as three separate filenames. The fix is NOT
       box-decoration-break: clone — clone gives every fragment its own full
       border and radius, which is the thing that makes them look separate.
       `slice` (the default) draws the border only at the true start and end of
       the run, so the broken edges stay open and the fragments read as one
       wrapped thing. Stated rather than left implicit, since the wrong value
       here looks like a fix and is the bug. */
    box-decoration-break: slice; -webkit-box-decoration-break: slice;
    /* And no rounding on the broken edges either, for the same reason. */
    border-radius: 3px;
  }
  .prose pre {
    background: var(--fill); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; margin: .85em 0; overflow-x: auto; font-size: 13px; line-height: 1.5;
  }
  .prose pre code { background: none; border: none; padding: 0; font-size: inherit; }
  /* --border-2, not --line: --line on a card is ~1.3:1 in BOTH themes, so a
     dense table's gridlines all but disappear. */
  .prose table { border-collapse: collapse; margin: .85em 0; width: 100%; font-size: 13.5px; }
  .prose th, .prose td { border: 1px solid var(--border-2); padding: 6px 9px; text-align: left; vertical-align: top; }
  .prose th { background: var(--surface-2); font-weight: 700; }
  .prose tbody tr:nth-child(even) td { background: var(--surface-2); }
  .prose blockquote { border-left: 3px solid var(--gold); margin: .85em 0; padding: 2px 14px; color: var(--muted); }
  .prose blockquote > :last-child { margin-bottom: 0; }
  .prose hr { border: none; border-top: 1px solid var(--line); margin: 1.4em 0; }
  /* Framed, using the .meshview canvas idiom — the app's only "here is a piece
     of media" pattern. The backdrop is load-bearing in dark mode: without it a
     white-background photo is a blinding slab and a transparent PNG renders
     dark-on-dark and vanishes entirely. */
  .prose img {
    max-width: 100%; height: auto; display: block; margin: .85em 0;
    border: 1px solid var(--line); border-radius: var(--r-md); background: var(--canvas);
  }
  .prose a > img { margin: 0; }
  /* Figures in the CS standards markdown (documents.js mdToHtml). The browser
     default figure margin indents 40px each side, which reads as a mistake
     next to full-width tables. */
  .prose figure.mdfig { margin: .85em 0; }
  .prose figure.mdfig figcaption { font-size: 12.5px; color: var(--muted); margin-top: .35em; }
  /* A user-authored table carries no data-label, so the app's responsive
     card-collapse is unavailable to it, and reflowing a layup schedule into
     cards would destroy the column relationships anyway. It scrolls instead. */
  .tblwrap { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; margin: .85em 0; }

  /* ---- "there is more to the right" ----
     A touch device draws no scrollbar until you touch, so a code block or a
     wide table that scrolls looked exactly like one that had been cut off: the
     last glyph sliced in half at the edge of the box and nothing to say why.
     Both reviewers read the same shopsabre command as data loss.

     The four-layer trick: two cover gradients painted in the element's own
     background colour with `background-attachment: local` (so they travel with
     the content and slide out of the way once you scroll), and two shadows
     with `scroll` (so they stay pinned to the box). Where content overflows,
     the cover has moved and the shadow shows. Where it doesn't, the cover sits
     on top of the shadow and nothing is drawn. No JS, no resize observer, and
     it cannot get out of sync with the actual scroll position.

     --shadow-edge is a token so the two themes get their own value; the fade
     colour has to be the surface underneath, which differs per element. */
  .prose pre {
    background-repeat: no-repeat;
    background-size: 34px 100%, 34px 100%, 12px 100%, 12px 100%;
    background-position: left center, right center, left center, right center;
    background-attachment: local, local, scroll, scroll;
  }
  .prose pre {
    background-image:
      linear-gradient(to right, var(--fill), transparent),
      linear-gradient(to left, var(--fill), transparent),
      radial-gradient(farthest-side at 0 50%, var(--shadow-edge), transparent),
      radial-gradient(farthest-side at 100% 50%, var(--shadow-edge), transparent);
  }
  /* A TABLE gets a scrollbar instead of the shadow, and this is not a
     preference — the shadow does not work there. The background trick paints on
     the scroll container, and a table's own cells paint on top of it: a header
     tint and a zebra row hide the shadow while a plain row lets it through, so
     the same table showed two grey smudges on two rows and nothing on the
     others. Worse than no cue at all.

     A styled scrollbar is honest by construction — no overflow, no scrollbar,
     no way for it to be wrong — which the shadow was not.

     UNVERIFIED ON A REAL PHONE, and worth saying so: headless Chromium draws
     an overlay scrollbar that takes no space (offsetHeight == clientHeight) and
     does not appear in a screenshot, so this could not be checked here. On iOS
     the reported behaviour is that styling ::-webkit-scrollbar makes it
     persistent rather than gesture-only; if that turns out to be false on the
     team's phones, a wide table on a phone has no scroll affordance at all and
     this needs a different answer. Check it on a handset. */
  .tblwrap, table.sub { scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
  .tblwrap::-webkit-scrollbar, table.sub::-webkit-scrollbar {
    height: 6px; -webkit-appearance: none;
  }
  .tblwrap::-webkit-scrollbar-thumb, table.sub::-webkit-scrollbar-thumb {
    background: var(--border-2); border-radius: 3px;
  }
  .tblwrap::-webkit-scrollbar-track, table.sub::-webkit-scrollbar-track { background: transparent; }
  .tblwrap table { margin: 0; }
  .tblwrap::-webkit-scrollbar { height: 10px; }
  .tblwrap::-webkit-scrollbar-thumb { background: var(--border-2); border: 3px solid var(--card); border-radius: 999px; }
  /* Two or more images in a row become a grid. Three phone photos inline are
     ~2,650px of vertical scroll; as a grid they are ~380px, and the lightbox is
     how you actually look at one. */
  /* 118px is not arbitrary: measured, the comment body is 255px wide on a 393px
     phone once the thread card and the per-comment card have taken their
     padding. Two columns need a floor at or under (255-8)/2 = 123. Anything
     larger silently collapses to ONE column, which puts the stack of
     full-width photos straight back — the exact thing the gallery exists to
     prevent. Wider screens get proper thumbs from the media query below. */
  .cgal { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: .85em 0; }
  @media (min-width: 640px) { .cgal { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
  .cgal a { display: block; border-radius: var(--r-md); overflow: hidden; }
  .cgal img {
    width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; margin: 0;
    border-radius: var(--r-md); border: 1px solid var(--line); background: var(--canvas); cursor: zoom-in;
  }
  .cgal a:hover img { border-color: var(--accent); }

  /* ---- 3D mold-in-stock viewer (meshview.js) ----
     Screen only; the printed/signed artifact stays the exploded SVG below it. */
  .meshview { position: relative; margin: 8px 0 4px; }
  .meshview canvas { width: 100%; height: 380px; display: block; border: 1px solid var(--line);
    border-radius: var(--r-md); background: var(--canvas); touch-action: none; cursor: grab; }
  .meshview canvas:active { cursor: grabbing; }
  .meshview-hint { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px;
    font-size: 12px; color: var(--muted); }
  .mv-swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 2px; }
  .mv-swatch.mv-mold { background: var(--brand-blue); }
  .mv-swatch.mv-stock { background: rgba(253,181,21,.55); border: 1px solid var(--border-2); }
  .meshview-hint button { margin-left: auto; }
  .meshview-note { margin-top: 6px; }
  @media (max-width: 640px) { .meshview canvas { height: 260px; } }

  /* ---- lineage bar ----
     Part › Run › Mold › Plan › Drawings, on every record in the chain. Chip
     grammar so it reads as navigation rather than as data; ghosts are dashed
     because a missing mold link is worth seeing, not worth hiding. Scrolls
     sideways on a phone instead of wrapping into an unreadable stack. */
  .lineage { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap;
    overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
  .lineage .ln-node { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap;
    padding: 3px 9px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--fill); color: var(--ink); font: inherit; font-size: 12px; }
  .lineage button.ln-node { cursor: pointer; transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .lineage button.ln-node:hover { background: var(--hover); border-color: var(--border-2); }
  .lineage .ln-kind { font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted); }
  .lineage .ln-id { font-weight: 600; }
  .lineage .ln-note { font-size: 11px; color: var(--muted); }
  .lineage .ln-cur { background: var(--accent-soft); border-color: var(--accent); }
  .lineage .ln-cur .ln-kind { color: var(--accent); }
  .lineage .ln-ghost { background: transparent; border-style: dashed; color: var(--muted); }
  .lineage .ln-ghost .ln-id { font-weight: 400; font-style: italic; }
  .lineage .ln-sep { color: var(--faint); padding: 0 1px; }

  /* ---- layup stack ----
     Was a run of full-width coloured bars with all four fields crammed into
     one middle-dot string — the only sub-collection in the app that wasn't a
     table.sub, sitting three lines above the BOM that is one. Now it IS a
     table.sub, so it inherits the header, the row rules and the inline inputs
     for free, and the colour moved to a swatch column exactly like the printed
     traveler has always done (print.css "ply stack"). Colour is now a hint
     beside a text tag rather than the whole message. */
  .stack { margin: 8px 0; }
  .stack-cap { margin-bottom: 4px; }
  table.sub.stk td.sw, table.sub.stk th.sw { width: 8px; padding: 0; }
  table.sub.stk td.sw { background: var(--ply-other); }
  table.sub.stk tr.cf td.sw { background: var(--ply-cf); }
  table.sub.stk tr.spread td.sw { background: var(--ply-spread); }
  table.sub.stk tr.core td.sw { background: var(--ply-core); }
  table.sub.stk tr.mesh td.sw { background: var(--ply-mesh); }
  table.sub.stk td.plyno, table.sub.stk th.plyno { width: 34px; color: var(--muted); font-variant-numeric: tabular-nums; }
  table.sub.stk td.mat { font-weight: 600; }
  /* The text carrier. Without it the material class lives only in the swatch
     hue, which fails greyscale, a colour-blind reader and the B&W proof. */
  .plytag { display: inline-block; min-width: 42px; text-align: center; margin-right: 6px;
    padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; background: var(--fill); color: var(--muted); border: 1px solid var(--line); }
  tr.cf .plytag { background: var(--ply-cf); color: #fff; border-color: var(--ply-cf); }
  tr.spread .plytag { background: var(--ply-spread); color: #fff; border-color: var(--ply-spread); }
  tr.core .plytag { background: var(--ply-core); color: #3a2c05; border-color: var(--ply-core); }
  tr.mesh .plytag { background: var(--ply-mesh); color: #fff; border-color: var(--ply-mesh); }
  :root[data-theme="dark"] tr.cf .plytag, :root[data-theme="dark"] tr.spread .plytag { color: #0b0f16; }
  table.sub.stk td.rowact, table.sub.stk th.rowact { width: 1%; white-space: nowrap; text-align: right; }
  table.sub.stk td.rowact button { padding: 1px 5px; font-size: 11px; line-height: 1.4; }
  table.sub.stk tr.drift td { background: var(--warn-bg); }
  .stack-foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  /* Spec vs as-built: the part holds the plan, a run holds what it actually
     laid. The badge is the only thing that says they stopped agreeing. */
  .stack-diff { display: inline-flex; align-items: center; gap: 6px; margin: 6px 0;
    padding: 4px 9px; border: 1px solid var(--warn-border); background: var(--warn-bg);
    color: var(--amber); border-radius: var(--radius); font-size: 12px; }
  .stack-diff button { font-size: 12px; }
  .stkcmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stkcmp h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  @media (max-width: 640px) { .stkcmp { grid-template-columns: 1fr; } }

  /* ---- steps: the traveler spine ----
     Identity from structure, not washes: a hairline spine runs down the
     number column and each step's number sits on it as a circular node whose
     fill is the step's state — green ✓ walked, gold NOW, outline future,
     amber ring blocker, slate ◷ hold, red ✗ failed. The spine is solid where
     the run has been walked and dashed below the NOW node. A 22-step record
     reads as solid green → one gold node → dashed, from arm's length. */
  .steps { position: relative; }
  .step { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; }
  .step .step-title { font-size: 15px; }
  .steps .num { position: relative; z-index: 1; width: 28px; height: 28px; min-width: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  /* Spine segments, per row so solid/dashed can switch: top half above the
     node, bottom half below. Trimmed at the container's ends. */
  .step::before, .step::after { content: ""; position: absolute; left: 13px; width: 2px; background: var(--line); }
  .step::before { top: 0; height: 6px; }
  .step::after { top: 34px; bottom: 0; }
  .steps > .step:first-child::before, .steps > :first-child .step:first-child::before { display: none; }
  .steps > .step:last-child::after, .steps > :last-child .step:last-child::after { display: none; }
  /* Not walked yet: dashed. The NOW row's own lower segment is the switch. */
  .step.future::before, .step.future::after, .step.upnext::after {
    background: none; width: 0; border-left: 2px dashed var(--line); }
  .step .body { flex: 1; min-width: 0; } .step .meta { font-size: 13px; color: var(--muted); }
  /* The right cluster: buy-off (or the signed state) plus the camera and the
     issue flag — every control on one edge (Simon's call), the body is pure
     reading. Shrinkable, not flex:none: in the desktop wo-detail grid a steps
     column can be ~240px, and a rigid cluster pushed the icon buttons out of
     the card and into the landscape safe-area inset. Letting it shrink is what
     makes the flex-wrap actually engage; the floor is the widest single
     control (the buy-off button), which still fits the column. */
  .step .buyoff { flex: 0 1 auto; display: flex; gap: 6px; align-items: center; font-size: 13px; flex-wrap: wrap; justify-content: flex-end; }
  /* A blocker is a person withholding a signature (amber ring + edge), a hold
     is the clock (slate node wearing the ◷). They stopped sharing a wash long
     ago; now neither is a wash at all. */
  .step.is-blocker:not(.done):not(.failed) .num { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .step.is-held .num { background: var(--hold-bg); border-color: var(--hold-border); color: var(--hold); }
  .step.done .num, .steps .num.done { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .step.failed .num { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .step.done .body { color: var(--muted); }
  .step.done .step-title { color: var(--muted); }
  /* An accent edge only where a row needs to shout: amber blocker, red fail,
     gold NOW. The row shifts 13px left to carry it, so its spine segments
     move to 26px to stay plumb with the others. */
  .step.is-blocker:not(.done):not(.failed), .step.failed, .step.upnext {
    border-left: 3px solid var(--warn-border); margin-left: -13px; padding-left: 13px; }
  .step.failed { border-left-color: var(--bad); }
  .step.upnext { border-left-color: var(--gold); }
  .step.is-blocker:not(.done):not(.failed)::before, .step.is-blocker:not(.done):not(.failed)::after,
  .step.failed::before, .step.failed::after, .step.upnext::before, .step.upnext::after { left: 26px; }
  /* The one gold node; its numeral is ink, never white. Redundant cues on
     purpose: the only gold node, the only gold edge, the only .primary. */
  .step.upnext .num { background: var(--gold); border-color: var(--gold); color: var(--brand-ink); }
  .step.upnext .step-title { font-weight: 700; background: var(--gold-bg); border-radius: var(--radius);
    padding: 2px 8px; margin-left: -8px; }
  .step-badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--amber); vertical-align: 1px; }
  .step-badge.hold { background: var(--hold-bg); border-color: var(--hold-border); color: var(--hold); }
  .step-badge.now { background: var(--gold-bg); border-color: var(--gold); color: var(--brand-ink); }
  .step .buyoff .ok { display: inline-flex; align-items: center; gap: 4px; }
  /* A signed run compressed to one line: the group summary wears a done node
     and the count; the full rows are inside, one tap away. */
  details.step-group > summary.step-disclose { display: flex; align-items: center; gap: 12px; min-height: 40px;
    cursor: pointer; list-style: none; font-size: 12px; color: var(--muted); }
  details.step-group > summary.step-disclose::-webkit-details-marker { display: none; }
  details.step-group > summary.step-disclose .num { flex: none; }
  details.step-group > summary.step-disclose::after { content: "▸"; color: var(--faint); }
  details.step-group[open] > summary.step-disclose::after { content: "▾"; }
  /* A signed row's history, one tap away. The summary is a ≥40px target. */
  .step-more > summary.step-disclose { cursor: pointer; list-style: none; font-size: 12px; color: var(--muted);
    min-height: 40px; display: inline-flex; align-items: center; gap: 4px; }
  .step-more > summary.step-disclose::-webkit-details-marker { display: none; }
  .step-more > summary.step-disclose::before { content: "▸"; color: var(--faint); transition: transform var(--t-fast) var(--ease); }
  .step-more[open] > summary.step-disclose::before { content: "▾"; }

  /* ============================================================
     PARTS — master–detail split.
     Above 900px the tab is two panes: a persistent index that never goes away
     and the selected part beside it. The collapse to one-pane-at-a-time lives
     with every other width rule in the responsive block at the end of this
     sheet, not here — the only thing the markup carries is a selected flag.
     ============================================================ */
  /* The rail was a fixed 336px, so every pixel the window gained went to the
     detail pane and the index stayed the same width it had on a laptop. It is
     the thing you scan, so it grows too — but slowly, and it stops at 420
     because a wider rail just pads its two-line rows. */
  .mdsplit { display: grid; grid-template-columns: clamp(300px, 24vw, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
  /* A record open in the detail pane yields the rail's clamp() track to the
     discussion; a toolbar toggle brings the rail back for browsing. Generic
     name on purpose — any .mdsplit tab can add the class later. Deliberately
     NOT the <=900 one-pane-at-a-time selected flag: that one is pinned to the
     responsive block by test_app and may not appear up here, even in prose. */
  .mdsplit.rail-off { grid-template-columns: minmax(0, 1fr); }
  .mdsplit.rail-off > .mdindex { display: none; }
  .mddetail { min-width: 0; }
  /* The index outlives the detail, so it gets the card chrome and its own
     scroll: walking 33 parts must never scroll the part you're reading. */
  .mdindex { position: sticky; top: calc(var(--topbar-h) + 10px); max-height: calc(100dvh - var(--topbar-h) - 32px); display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
  .pindex-head { padding: 10px 11px 9px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .pindex-head .toolbar { margin-bottom: 8px; }
  .psum { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .psum-chip { padding: 3px 10px; font-size: 11px; border-radius: 999px; color: var(--muted); background: var(--surface);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .psum-chip b { font-family: var(--font-display); font-size: 13px; color: var(--ink); margin-right: 2px; }
  .psum-chip.bad b { color: var(--bad); }
  .psum-chip.on { background: var(--blue); border-color: var(--brand-ink); color: #fff; }
  .psum-chip.on b { color: #fff; }
  .psum-chip.bad.on { background: var(--bad); border-color: var(--bad); }
  .pfilters { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .pfilters > input { grid-column: 1 / -1; }
  .pfilters input, .pfilters select { width: 100%; min-width: 0; font: inherit; font-size: 12.5px; padding: 5px 7px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  .pfilters .sortdir { padding: 4px 9px; line-height: 1; }
  .pfilternote { margin-top: 7px; font-size: 12px; color: var(--muted); }
  /* Names the C/M/L marks once, where a table would put a column header. */
  .plegend { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 9px; margin-top: 8px; }
  .plegend .pl-k { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .plist { flex: 1; overflow-y: auto; padding: 6px; scrollbar-gutter: stable; scrollbar-width: thin; }
  .plist::-webkit-scrollbar { width: 10px; }
  .plist::-webkit-scrollbar-thumb { background: var(--border-2); border: 3px solid var(--card); border-radius: 999px; }
  /* Sticky at the foot of the scroller: it fades whatever is under it while
     there is more to scroll to, and comes to rest below the last row once
     there is not.

     THE MARGIN IS ZERO, and that is the whole fix. It used to be -26px, which
     pulled the fade back over the last row UNCONDITIONALLY — so scrolling to
     the bottom, or opening any list short enough not to scroll, left the final
     row's stage chips and subteam washed out under a gradient with nothing
     below it to scroll to. The old comment claimed it "sits harmlessly at the
     end of a short list"; it did not, and it was wrong in all four rails at
     once (parts, work orders, molds, tickets).
     With no negative margin it occupies its own 26px at the end of the
     scroller, so the last row can always be read in full, and sticky still
     floats it over the rows above whenever there IS more to scroll. The cost
     is 26px of empty card at the very bottom, which is invisible: the gradient
     ends in var(--card), on var(--card). */
  .plistfade { position: sticky; bottom: -6px; height: 26px; margin: 0; pointer-events: none;
    background: linear-gradient(to top, var(--card) 20%, transparent); }
  /* One header per subteam, only when the rail is grouped. */
  .pgrouphd { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; position: sticky; top: -6px; z-index: 1;
    margin: 8px 0 3px; padding: 5px 9px; border-radius: var(--radius); background: var(--surface-2); font-size: 11px; color: var(--muted); }
  .pgrouphd:first-child { margin-top: 0; }
  .pgrouphd .pg-name { font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
  .pgrouphd .pg-n { white-space: nowrap; }
  .pgrouphd .pg-late { display: inline-flex; align-items: center; gap: 3px; color: var(--bad); font-weight: 700; }
  .pempty { padding: 22px 12px; text-align: center; }
  .keyhint { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px; padding: 6px 10px;
    border-top: 1px solid var(--line); background: var(--surface-2); }
  .keyhint span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  kbd { font: 600 10.5px/1.5 var(--font); border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 4px; background: var(--surface); color: var(--muted); }

  /* One index row. Two lines at index width, one line when the index owns the
     whole screen (see the responsive block). */
  .pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; align-items: center;
    padding: 7px 9px; margin-bottom: 2px; border: 1px solid transparent; border-radius: 7px; cursor: pointer;
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .pitem:hover { background: var(--hover); }
  .pitem .pi-name { grid-row: 1; grid-column: 1; font-weight: 600; font-size: 13.5px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .pi-due { grid-row: 1; grid-column: 2; display: inline-flex; align-items: center; gap: 3px;
    font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .pitem .pi-sub { grid-row: 2; grid-column: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pitem .pi-who { grid-row: 2; grid-column: 2; display: inline-flex; justify-self: end; }
  .pitem .pi-who .avatar { margin-left: -5px; box-shadow: 0 0 0 2px var(--card); }
  .pitem .pi-who .avatar:first-child { margin-left: 0; }
  .pitem.isdone .pi-name { font-weight: 500; color: var(--muted); }
  .pitem.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  /* Multi-select on the rail. A picked row reads as picked without borrowing
     .sel: selection means "this is the record in the pane beside you", and
     during a bulk delete that is a different question. */
  .pitem .wopick { margin-right: 6px; vertical-align: -1px; accent-color: var(--accent); }
  .pitem.picked { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--bad, var(--accent)); }
  .pitem.sel .pi-name { color: var(--brand-ink); }
  /* A sub-ticket in the Tickets rail, drawn under its parent. The indent plus
     a hairline guide is the whole genealogy at rail altitude; the lineage bar
     on the pane carries the named version. */
  .pitem.pi-child { margin-left: 14px; border-left: 2px solid var(--line); border-radius: 0 7px 7px 0; }
  /* The sub-ticket fold caret on a parent row. Compact on purpose — it lives
     inside the name slot of a dense rail row; when folded it carries the
     hidden-child count so a collapsed parent still admits what's under it. */
  .pi-fold { font: inherit; font-size: 11px; line-height: 1; padding: 2px 5px; margin-right: 4px;
    border: none; border-radius: var(--radius); background: none; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 2px; vertical-align: -1px; }
  .pi-fold:hover { background: var(--fill); color: var(--ink); }
  .pitem.pi-child.sel { border-left-color: var(--accent); }
  /* Tickets' filter row has two controls after the search box (kind select,
     clear button); the select spans the two flexible tracks so the button
     sits in the auto column instead of stretching to half the rail. */
  .tkouter .pfilters > select { grid-column: 1 / 3; }

  /* The three-stage rail. One mark per stage instead of a pill AND a bar for
     each: colour says which state, the underline says how far, the tooltip and
     the detail pane carry the exact wording. */
  .prog3 { display: inline-flex; gap: 3px; flex: none; }
  .prog3 .sg { position: relative; display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
    width: 26px; height: 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill);
    color: var(--muted); font-size: 9.5px; font-weight: 800; }
  .prog3 .sg b { position: relative; z-index: 1; }
  .prog3 .sg i { position: absolute; left: 0; bottom: 0; height: 3px; background: currentColor; opacity: .9; }
  .prog3 .sg.st-mid { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .prog3 .sg.st-done { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  /* "Doesn't apply" and "not started" both draw an empty chip, so on a
     photocopy — or to anyone who does not separate violet from grey — they were
     the same mark. The bias hatch is the second channel, and a 45 is the right
     thing for it to be. The old opacity:.6 was trying to do this job and could
     not: it makes a mark quieter, not different. */
  .prog3 .sg.st-na { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro);
    background-image: repeating-linear-gradient(45deg, var(--retro-border) 0 1px, transparent 1px 5px); }

  /* ============================================================
     WORK ORDERS — rail row extras, and the in-pane section tabs.
     The split itself is .mdsplit above; nothing here re-declares it, and the
     one-pane-at-a-time collapse stays where every other width rule lives, in
     the responsive block at the end of this sheet. A test enforces that.
     ============================================================ */
  /* How far through its buy-offs a run is — the one number the flat table
     never carried. A bar AND the fraction: a bar alone can't tell 4/9 from
     40/90, and the fraction alone doesn't scan down a column of rows. */
  .wprog { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 11px; color: var(--muted); }
  .wprog .wp-bar { width: 34px; height: 5px; border-radius: 999px; background: var(--fill); overflow: hidden; }
  .wprog .wp-bar i { display: block; height: 100%; background: var(--ok); }
  .wprog b { font-family: var(--font-display); color: var(--ink); }
  /* At most one of these per row, and never together: blocked is something to
     go and fix, curing is something to wait for. */
  /* 11px, not 10: the type audit's floor. Found when fixtures first carried a
     live curing run and the badge finally rendered under it. */
  .wflag { padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .wflag.blocked { background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad); }
  .wflag.curing { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--amber); }
  /* A group header that names a part is a way INTO that part, not just a label. */
  .pgrouphd .pg-open { font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
  .pgrouphd .pg-open:hover { color: var(--brand-ink); text-decoration: underline; }
  /* A part with no runs. Dashed, because there is nothing under it to select —
     it is the shape of a gap, and the button is the only thing to do with it. */
  /* NOT sticky, unlike its parent rule: a header sticks so the rows scrolling
     under it stay labelled, and this one has no rows. Sticky, two adjacent
     "no run yet" headers parked in the same slot and — with the transparent
     background below — printed their names through each other. Static also
     removes it from the positioned stacking order, so it slides UNDER a stuck
     opaque header instead of painting over it in transit. */
  .pgrouphd.norows { position: static; border: 1px dashed var(--border-2); background: none; }
  .pgrouphd .pg-start { margin-left: auto; padding: 2px 8px; }

  /* The section jump bar (WO, Parts and Tickets). Buttons rather than anchors,
     because an <a href="#…"> would overwrite the deep link this app keeps in
     the URL hash. They scroll; they do not switch. Each carries a count per
     section and a dot when something in one needs attention. */
  .secnav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 0 0 12px;
    position: sticky; top: var(--topbar-h); z-index: 4; background: var(--canvas); padding: 6px 0; border-bottom: 1px solid var(--line); }
  .secnav-btn { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12.5px; line-height: 1.1;
    min-height: 30px; padding: 5px 11px; border-radius: var(--radius); border: 1px solid transparent; background: none;
    color: var(--muted); cursor: pointer; transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .secnav-btn:hover { background: var(--hover); color: var(--ink); border-color: var(--line); }
  /* A section with nothing in it is still listed, muted. Dropping it would mean
     the bar changes shape per record, and an empty section is the one you most
     need to be able to find in order to fill it in. */
  .secnav-btn.empty { opacity: .62; }
  .secnav-n { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .secnav-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .secnav-btn.warn .secnav-dot { background: var(--bad); }
  .wosec { min-width: 0; margin-bottom: 12px; }
  /* ---- two tiers ----
     A work panel is a card. A reference section is a ruled row: no fill, no
     border, no shadow, no radius. Eight identical cards at a 12px pitch, with a
     --card/--canvas delta of a few percent and a --line hairline, is the wall
     Simon described; this makes four of them stop being cards at all, and the
     page reads as panels and then an appendix — which is what it is.

     Deliberately NO left spine on the work tier. The header already carries a
     3px skewed gold bar 11px from the card edge, and a second vertical accent
     beside it reads as a rendering fault. Card-versus-flat needs no third mark. */
  .wosec[data-tier="ref"] { background: none; border: 0; border-radius: 0; box-shadow: none;
    border-top: 1px solid var(--line); padding: 10px 4px 12px; margin-bottom: 0; }
  .wosec[data-tier="ref"] + .wosec[data-tier="ref"] { margin-top: 0; }
  /* The appendix label steps back down to grey — work headings are the ink ones. */
  .wosec[data-tier="ref"] > .wosec-hd > span:first-child { color: var(--muted); }
  .wosec[data-tier="ref"] > .wosec-hd::after { background: none; border-color: transparent; }
  /* A section in trouble is the only tinted thing on the page, and it is a card
     whatever its kind. Four carriers, all of them already paired with the word
     the header renders: the tint, the gold slash turning --bad, the label
     turning --bad, and the dot. */
  .wosec[data-warn="bad"] { background: var(--bad-bg); border-color: var(--bad-border); }
  .wosec[data-warn="bad"] > .wosec-hd > span:first-child { color: var(--bad); }
  /* Waiting on a clock, not on a person. Amber, and the label stays ink: a run
     curing on schedule must not read as the thing that needs you. */
  .wosec[data-warn="hold"] { background: var(--warn-bg); border-color: var(--warn-border); }
  .wosec[data-warn="hold"] > .wosec-hd > span:first-child::before { background: var(--amber); }
  /* ---- section header (WO + Parts, core.js sectionCard) ----
     The .bmod-hd recipe applied per section card: gold speed-slash + Saira
     uppercase label, the SAME badge()/warn() answers the jump bar shows (one
     source of truth), and the attention dot always beside a word — hue is
     never the only carrier. The header is a <button> that toggles the fold:
     a class fold, not a <details>, because a closed details skips painting
     its content and folded sections would vanish from a browser print. The
     print block force-shows .wosec-body instead. */
  .wosec-hd { display: flex; align-items: center; gap: 8px; margin: 0; list-style: none; }
  button.wosec-hd { appearance: none; -webkit-appearance: none; width: 100%; background: none; border: 0;
    padding: 0; font: inherit; text-align: left; cursor: pointer; min-height: 40px; color: inherit; }
  /* THE ONE HEADING ON THE PAGE THAT IS INK. Before this there were seven
     uppercase micro-label registers within 2.5px of each other — section label,
     inner h3, sub-fold summary, field-group heading, field label, facts label,
     photo group — all "small grey capitals". The eye cannot build a tree out of
     that, which is what "all of the text looks similar" was describing. Three
     levels now, and they differ by CASE and COLOUR rather than by a pixel:
     section = ink Saira caps, subsection = grey caps, group = sentence-case ink
     with a rule under it. */
  .wosec-hd > span:first-child { position: relative; padding-left: 11px; font-family: var(--font-display);
    font-size: 13.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink); }
  .wosec-hd > span:first-child::before { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 3px;
    border-radius: 0 2px 2px 0; background: var(--gold); transform: skewX(-12deg); }
  .wosec-hd.warn > span:first-child::before { background: var(--bad); }
  .wosec-n { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
  .wosec-w { font-size: 11.5px; font-weight: 600; color: var(--bad); }
  /* Gold is "new", amber/red is "trouble" — the dot colors never trade jobs. */
  .secnav-dot.gold { background: var(--gold); }
  .wosec-new { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  /* The caret is a 28px chip, not a 13px glyph: Simon reported nobody could
     tell the sections expand. It reads as the button it is. */
  .wosec-hd::after { content: "▾"; width: 28px; height: 28px; margin-left: auto; flex: none;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); font-size: 15px; color: var(--muted);
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .wosec-hd:hover::after { background: var(--hover); color: var(--ink); }
  .wosec.folded > .wosec-hd::after { content: "▸"; }
  .wosec:not(.folded) > .wosec-hd { margin-bottom: 10px; }
  .wosec.folded > .wosec-body { display: none; }
  /* The content fills its card (Simon: the text rattled around in the box).
     Scoped to the detail panes; labels, .tny, .meta and pills keep their own
     explicit sizes — the hierarchy is the point, only the body reading size
     moves. */
  .mddetail .wosec-body { font-size: 15px; }
  .mddetail .wosec-body table.sub { font-size: 14px; }
  .mddetail .grid .f .ro { font-size: 15px; }
  /* Field labels in a detail pane go sentence case, so the only capitals left
     in a section body are the two that name things. Scoped to .mddetail
     .wosec-body on purpose: index.html:724 is ONE rule serving both `.grid .f
     label` and `.field label`, and `.field` is every modal in the app. The
     cost is deliberate and worth naming — the same register now reads 12px
     sentence case in a section and 11px caps in a modal. */
  .mddetail .wosec-body .grid .f label { font-size: 12px; font-weight: 500;
    text-transform: none; letter-spacing: 0; }
  /* Row that holds a trailing add-button under a list. */
  .addrow { margin-top: 8px; }
  /* Sub-fold inside a section card (BOM, event log): reference data that
     folds even when populated. The summary wears the h3 register plus a
     count, stays a ≥40px target, and is a real anchor woJump can open. */
  .wo-subfold > summary.wo-subhd { cursor: pointer; list-style: none; min-height: 40px;
    display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 10px; }
  .wo-subfold > summary.wo-subhd::-webkit-details-marker { display: none; }
  .wo-subfold > summary.wo-subhd::before { content: "▸"; color: var(--faint); transition: transform var(--t-fast) var(--ease); }
  .wo-subfold[open] > summary.wo-subhd::before { content: "▾"; }
  .w110 { width: 110px; }
  /* Second-tier group label inside a section card (Identity / People / Mass /
     Mold on the Details card): below h3, above a field grid. */
  /* A group heading that reads as a heading. It used to be 11px uppercase
     --faint beside 11px uppercase --muted field labels: the same register,
     differing only by weight and .01em of tracking, so "Identity" looked like
     one more field name rather than the thing naming the four below it. */
  .fgroup-label { font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: 0;
    color: var(--ink); margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .fgroup-label:first-child { margin-top: 0; }
  /* ---- WO photos ----
     Real <img loading="lazy"> tiles (not CSS backgrounds) so the lightbox
     collects them and the browser defers offscreen loads. */
  .phgrp { margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .phgrp:first-of-type { margin-top: 0; }
  .photogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  .phtile { margin: 0; min-width: 0; }
  .phimg { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius);
    border: 1px solid var(--line); cursor: pointer; display: block; background: var(--fill); }
  .phtile figcaption { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phcap { width: 100%; margin-top: 2px; font-size: 12px; padding: 3px 6px; }
  .step-photos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .step-photos:empty { display: none; }
  .phmini { width: 48px; height: 48px; object-fit: cover; border-radius: var(--radius);
    border: 1px solid var(--line); cursor: pointer; display: block; background: var(--fill); }
  .ph-uploading { font-size: 11px; color: var(--muted); border: 1px dashed var(--border-2);
    border-radius: var(--radius); padding: 14px 10px; animation: phpulse 1.2s ease-in-out infinite; }
  @keyframes phpulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  /* Five controls in the rail head where Parts has four, so the third select
     (group/sort) is told to span the two flexible columns and leave the `auto`
     one to the reverse button. Without this it lands in the auto track and a
     label like "Group: subteam" gets squeezed to nothing. Not a width rule —
     it is a different control count, at every width. */
  .wosplit .pfilters > select:nth-of-type(3) { grid-column: 1 / 3; }
  /* The always-visible header: identity, status, and anything blocking. Sits
     outside every section on purpose — a gate you can navigate away from is a
     gate that gets walked past. */
  .wohead { margin-bottom: 10px; }
  /* The hero facts band: status (colored select), steps progress, due, mass,
     engineer faces. Labeled slots instead of a middle-dot sentence; the
     leftover quiet facts (rev, process, last saved) stay a tny muted line. */
  .wo-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 8px 0 6px; }
  .wo-facts .wprog { font-size: 12px; }
  .wo-facts .wprog .wp-bar { width: 90px; height: 7px; }
  .wo-facts .wprog b { font-size: 15px; }
  .wo-fact { display: inline-flex; align-items: baseline; gap: 5px; }
  .wf-lab { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .wf-num { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--ink); }
  .wf-num.late { color: var(--bad); }
  /* A place name, not a number: the display face's tabular figures and 16px
     are tuned for "412" and make "Etch locker shelf 2" shout. */
  .wf-num.wf-where { font-family: var(--font); font-size: 14px; font-weight: 600; }
  .wf-eng { display: inline-flex; }
  .wf-eng + .wf-eng { margin-left: -6px; }
  .wohead h2 { margin-top: 0; }
  .wohead .gate { margin-top: 10px; }

  /* Part detail */
  /* ---- the hero ----
     What the part looks like, above the jump bar. Sized small on purpose: above
     it already sit the topbar, a toolbar that wraps to two rows on a phone, the
     lineage bar, the season stat strip and the .wohead card with its deadline
     banner. A tall band here pushes the first section off a 393px screen, which
     is the device this is read on. 22vh capped at 160px measured clear. */
  .pt-hero { margin: 0 0 12px; position: relative; }
  /* A FIXED height, not a max: with only a max the box is the image's intrinsic
     ratio, so it is 0px until the file arrives and the whole page below it
     jumps down when it does. A stable box costs nothing and the crop is what
     object-fit is for. */
  .pt-hero img { display: block; width: 100%; height: min(22vh, 160px);
    object-fit: cover; border-radius: var(--r-md); border: 1px solid var(--line);
    background: var(--fill); cursor: zoom-in; }
  .pt-hero-swap { position: absolute; right: 8px; bottom: 8px; }
  /* Only ever seen in edit mode, which is where you land the moment a part is
     created — so the offer is in front of you exactly when you have the photo. */
  .pt-hero-empty { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-style: dashed; box-shadow: none; background: var(--surface-2); }
  .pt-hero-empty p { margin: 2px 0 0; max-width: 52ch; }
  .pt-hero-empty button { margin-left: auto; }
  /* ---- the mold list ----
     Chips with a remove press plus one select that adds. A part can be made on
     several molds; a split mold is two halves. */
  .moldf .moldchips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 5px; min-height: 26px; }
  .moldchip { display: inline-flex; align-items: center; gap: 5px; cursor: default; }
  .moldchip.bad { border-color: var(--bad-border); background: var(--bad-bg); color: var(--bad); }
  .moldchip .x { all: unset; cursor: pointer; padding: 0 3px; border-radius: 4px;
    color: var(--muted); font-size: 14px; line-height: 1; }
  .moldchip .x:hover { color: var(--bad); background: var(--bad-bg); }
  .moldchip .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .moldf .moldadd { width: 100%; }
  /* `all: unset` throws the tap-target floor away — the trap .rd-open and
     .lc-open both carry a note about. */
  @media (pointer: coarse) { .moldchip .x { min-width: 32px; min-height: 32px;
    display: inline-flex; align-items: center; justify-content: center; } }
  .mdnav { margin-left: auto; display: inline-flex; gap: 4px; }
  .pdue { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 11px; font-size: 13px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .pdue.late { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .pdue.late .muted { color: var(--bad); }
  .editnote { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 7px 11px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--accent-soft); border-radius: var(--radius); background: var(--info-bg); color: var(--brand-ink); }
  /* The stage stepper: the whole enum as tappable steps, so advancing a stage
     is one click with no edit mode and no dropdown to open. Steps are laid out
     with flex-wrap and sized by their own text — they get taller on a phone
     (see the responsive block), they never get narrower. */
  .pstages { display: grid; gap: 6px; }
  .pstage { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 12px; align-items: center;
    padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .pstage .ps-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .pstage .ps-steps { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .pstage .ps-cap { grid-column: 2; margin-top: -2px; }
  /* ---- a stepper per mold ----
     Set apart from the part's own three rows, because these write a different
     RECORD: the part says where the part is, each of these says where one piece
     of tooling is. The stepper itself is moldStageRow() from the Molds tab,
     reused whole. Only rendered when a part has two or more molds. */
  .ps-split { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-2); }
  .ps-split-lab { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--faint); margin-bottom: 4px; }
  .pstage-wrap + .pstage-wrap { margin-top: 10px; }
  /* A mold name is long — "UNDERTRAY LEFT SIDE POD OUTBOARD SKIN LOWER SECTION
     TWO" is real — so it gets its own line above the stepper rather than a
     narrow label column that would ellipsise it to nothing. */
  .ps-moldname { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; }
  .ps-moldname .link { font: inherit; text-align: left; }
  .ps-split .pstage { margin-top: 0 !important; }
  .ps-moldwarn { margin-top: 3px; }
  .pstep { font: inherit; font-size: 12.5px; font-weight: 600; line-height: 1.1; min-height: 30px; padding: 6px 13px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    /* Wraps rather than overflows: in a narrow split pane "Mold CAD/CAM Done"
       is wider than the column, and nowrap made it hang off the edge (and,
       in landscape, under the island) instead of taking a second line. */
    white-space: normal; text-align: center; max-width: 100%;
    border: 1px solid var(--border-2); border-radius: 999px; background: var(--card); color: var(--muted);
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .pstep:hover { background: var(--hover); color: var(--ink); border-color: var(--accent); }
  /* A step already behind you is a muted fill and nothing more. NOT green, and
     NOT ticked: in this app green-with-a-tick means finished, and a green
     "Not Started" is the exact class of colour bug the tab was rebuilt to fix. */
  .pstep.past { background: var(--fill); color: var(--muted); border-color: var(--line); }
  .pstep.cur { cursor: default; font-weight: 700; box-shadow: inset 0 0 0 1px currentColor; }
  .pstep.cur:hover { border-color: currentColor; }
  .pstep.cur.st-0 { background: var(--fill); border-color: var(--border-2); color: var(--muted); }
  .pstep.cur.st-mid { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .pstep.cur.st-done { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .pstep.cur.st-na { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro); }
  .pstep.na:not(.cur) { border-style: dashed; }

  /* The undo bar. A stepper click writes for the whole team, so every write
     leaves one of these until it is undone or dismissed — a toast fades before
     you have finished noticing you mis-tapped. */
  /* Sticky under the topbar, because the tap that needs undoing can be most of
     a page down — on a phone you set a stage near the foot of the detail pane,
     and an undo bar pinned to the top of the tab would be offscreen at exactly
     the moment it is wanted. Below the topbar's z-index, above the panes. */
  /* One checkbox row per board in the mark-cut confirm. */
  .cutrow { display: flex; align-items: flex-start; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); cursor: pointer; }
  .cutrow:first-of-type { border-top: none; }
  .cutrow input { margin-top: 3px; flex: none; }
  /* ---- the offcut review pane (the mark-cut modal) ----
     One .ccboard per board leaving the rack: its own .cutrow at the top, then
     the remnants coming back off it. The rows WRAP rather than forming a
     table, because at 320px a five-column table is a horizontal scrollbar and
     this is read standing at the saw. */
  .ccboard { border-top: 1px solid var(--line); padding: 4px 0 10px; }
  .ccboard:first-child { border-top: none; }
  .ccboard.off { opacity: .5; }
  .ccoffs { padding-left: 26px; }
  .ccoff { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 0; }
  .ccoff > input[type="checkbox"] { flex: none; margin: 0; }
  .ccoff-label { flex: 1 1 150px; min-width: 0; }
  .ccoff-dims { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 12px; }
  .ccoff-dims input { width: 72px; flex: none; }
  /* Under the useful-remnant bar: shown, greyed, and unticked. Hiding a piece
     would make the pane lie about what comes off the board; whether a sliver is
     worth keeping is the judgement of whoever is holding it. */
  .ccoff.scrap { opacity: .62; }
  /* ---- the technique step editor ----
     One row per step: sequence, title, and three closed-set dropdowns. Wraps
     rather than tabulating, for the same reason .ccoff does — this is a wide
     row and a phone is 320px. */
  .tqrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 7px 0; border-top: 1px solid var(--line); }
  .tqrow:first-of-type { border-top: none; }
  .tqseq { flex: 0 0 18px; text-align: right; }
  .tqtitle { flex: 1 1 200px; min-width: 0; }
  .tqrow select { flex: 1 1 150px; min-width: 0; }
  .tqact { display: flex; gap: 2px; margin-left: auto; }
  .tqwarn { flex: 1 1 100%; color: var(--amber); }
  /* ---- Recently deleted ----
     One row per DELETION, not per record: a work order and the issues that went
     with it were one decision and are one thing to put back. Wraps, for the
     reason the two panes above wrap. */
  /* ---- the technique catalog, on Reports ----
     One card per technique: name and gate on the left, the first few steps as a
     readable chain in the middle, the lead's actions on the right. Wraps, like
     every other row added in September 2026 — a phone is 320px. */
  .tqlist { margin-top: 10px; }
  .tqcard { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
    padding: 9px 0; border-top: 1px solid var(--line); }
  .tqcard:first-child { border-top: none; }
  .tqcard.arch { opacity: .6; }
  .tq-name { flex: 1 1 200px; min-width: 0; }
  .tq-steps { flex: 2 1 260px; min-width: 0; }
  .trashlist { margin-top: 10px; }
  .trashrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    padding: 9px 0; border-top: 1px solid var(--line); }
  .trashrow:first-child { border-top: none; }
  .trash-what { flex: 1 1 220px; min-width: 0; }
  .trash-who { flex: 0 1 auto; }
  .undobar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 8px 12px; font-size: 13px;
    border: 1px solid var(--ok-border); border-radius: var(--r-md); background: var(--ok-bg); color: var(--ink);
    position: sticky; top: calc(var(--topbar-h) + 8px); z-index: 4; box-shadow: var(--shadow-md); }
  .undobar .ub-i { display: inline-flex; color: var(--ok); }
  .undobar .ub-t { flex: 1; min-width: 0; }
  .pgrid { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .linkgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
  /* The children section stacks several blocks (runs, mold, then this grid);
     without a rule they butt straight into one another. */
  .pengrow + .linkgrid { margin-top: 12px; }
  .lg-label { text-transform: uppercase; letter-spacing: .04em; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .pengrow { margin-top: 12px; }
  .engchip { padding: 2px 9px 2px 3px; }
  .engchip.on { background: var(--blue); border-color: var(--brand-ink); color: #fff; }
  .pnote { margin-bottom: 12px; }
  .pnote .notebody { padding: 2px 0; }

  /* The four season numbers, above the right pane in BOTH its states. Compact
     is the one that sits above an open part: same four, half the height, so it
     costs a strip rather than a screenful of the record you came to read. */
  .pstats { margin-bottom: 12px; }
  .pstats.compact { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; margin: 0 0 10px; }
  .pstats.compact .stat-tile { padding: 7px 11px; display: flex; align-items: baseline; gap: 7px; }
  .pstats.compact .bignum { font-size: 17px; }
  .pstats.compact .stat-label { margin-top: 0; }
  .pbehind { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 11px; }
  /* `flex: 1` let the sentence eat every spare pixel, which at the old 1180px
     cap put its button a hand's width away and at 1600 stranded it 1130px off
     the end of the text it belongs to. It grows to fit its words and stops. */
  .pbehind span { flex: 0 1 auto; min-width: 180px; max-width: 70ch; }

  /* Right pane with nothing selected: the season read the list never had. */
  .stagebreak { margin-bottom: 11px; }
  .stagebreak .sb-label { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  .stagebreak .sb-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--fill); }
  .sb-seg.st-0 { background: var(--border-2); }
  .sb-seg.st-mid { background: var(--amber); }
  .sb-seg.st-done { background: var(--ok); }
  .sb-seg.st-na { background: var(--retro); }
  .sb-nums { margin-top: 4px; }
  .sb-nums .mid { color: var(--amber); } .sb-nums .done { color: var(--ok); } .sb-nums .na { color: var(--retro); }
  /* ---------- the Inventory storage map ---------- */
  .locgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 10px 0 18px; }
  .loccard { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 13px 14px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow);
    color: var(--ink); font: inherit; transition: box-shadow var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .loccard:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .loccard .lc-hd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .loccard .lc-name { font-weight: 700; font-size: 14px; }
  .loccard .lc-flam { color: var(--amber); }
  .loccard .lc-body { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .loccard .lc-warn { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .loccard .lc-warn.bad { color: var(--bad); }
  .loccard .lc-warn.warn { color: var(--amber); }
  .loccard .lc-foot { margin-top: auto; }
  /* The stretched link: one real button on the name, its ::after covering the
     whole card, and Confirm as a sibling above it on the z-axis. Replaces a
     <button> that contained <div>s and had no room for a second control. */
  .loccard { position: relative; }
  .lc-open { all: unset; cursor: pointer; font: inherit; color: var(--ink); font-weight: 700; }
  .lc-open::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-md); }
  .lc-open:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
  .loccard .lc-act { position: relative; z-index: 1; margin-top: auto; align-self: flex-start; }
  /* A shelf with something wrong on it leads with what is wrong, and wears a
     spine so it is findable in a grid without reading every card. */
  .loccard.alert { border-left: 3px solid var(--bad); }
  /* An empty shelf is quieter than a full one, but it is still a card and still
     the same click target. It used to collapse into a text strip, which hid the
     shelves you most need to be reminded you own and broke "click a location to
     see what is on it" — only the name was hittable there. */
  .loccard.isempty { background: var(--surface-2); box-shadow: none; }
  .loccard.isempty .lc-name { font-weight: 600; }
  .loccard.isempty:hover { background: var(--card); }
  .inv-nowhere-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px;
    margin: 10px 0 4px; border-radius: var(--r-md); border: 1px dashed var(--warn-border);
    background: var(--warn-bg); color: var(--ink); }
  .inv-nowhere-bar b { font-weight: 700; }

  /* ---- getting the data back out ---- */
  .xgroup { padding: 12px 0; border-top: 1px solid var(--line); }
  .xgroup:first-of-type { border-top: 0; }
  .xg-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; margin-bottom: 3px; }
  .xg-name { font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
  /* The last-resort copy box, for when the browser refuses the clipboard AND
     a download silently does nothing — which is iOS Safari, which is the phone
     in the shop. It has to stay monospace to keep its columns legible, so it
     opts out of the 16px iOS zoom guard: a readonly field cannot be typed in,
     so there is nothing to zoom for. */
  .copyout { width: 100%; height: 34vh; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; white-space: pre; overflow: auto; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--surface-2); color: var(--ink); padding: 8px; }
  .inv-site .pgrouphd { position: static; margin-top: 14px; }
  .invrow .sm { flex: none; }
  /* ---- location contents: sections and grouped materials ---- */
  /* Each kind is a section with the house group-header strip and a left
     accent. The accent is enhancement only — the uppercase label is the
     distinction that survives grayscale, per the print rule. The
     folded-groups-print-open rule lives in the app's ONE @media print block
     further down — a second print block here confused the design-system
     token check, which reads the first block it finds. */
  /* Each kind is its own CARD — the Boards idiom, per Simon (2026-08-28):
     a header strip inside one long card was not enough distinction. The
     kind's accent runs down the card's left spine, the way an alerted
     loccard wears its red one; the uppercase label is still what survives
     grayscale. .card's own 14px bottom margin is the section gap. */
  .invsec { border-left: 4px solid var(--border-2); }
  .invsec .pgrouphd { margin-bottom: 6px; }
  .invsec.sec-resin { border-left-color: var(--accent); }
  .invsec.sec-consumables { border-left-color: var(--amber); }
  .invsec.sec-fabric { border-left-color: var(--ok); }
  .invsec.sec-molds, .invsec.sec-boards { border-left-color: var(--brand-ink); }
  /* A material with several containers folds to one line. The caret column
     keeps group and single rows aligned; the member list indents under it.
     The fold is a class so print still paints it (see the @media print rule),
