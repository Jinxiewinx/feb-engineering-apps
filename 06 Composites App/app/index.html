     unlike a closed <details>. */
  .invrow.invgrp { cursor: pointer; }
  .invrow.invgrp .grp-caret { width: 14px; flex: none; color: var(--muted); }
  .invrow.invgrp .grp-n { color: var(--brand-ink); }
  .invgrp-body { margin-left: 22px; border-left: 2px solid var(--border-2); }
  .invgrp-body.folded { display: none; }
  .invrow.invmem .pm-name { font-weight: 500; }
  .ehs-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted);
    background: var(--surface-2); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
  /* The tag is shown as the label prints it, in four-character groups, so the
     eye can walk screen and sticker together. A hair of extra tracking is what
     makes the groups read as groups at 12px.

     The last group carries the weight and the rest is dimmed: across the 627
     real tags in the RSS export only the last five characters vary at all, so
     an undifferentiated strip is mostly shared prefix. See invEhsShort. The
     dim half must stay legible rather than decorative — it is what gets
     compared against the sticker — so this is 0.5, not 0.25. */
  .ehs-code { letter-spacing: 0.02em; }
  .ehs-code .ehs-dim { opacity: 0.5; font-weight: 400; }
  .ehs-code b { font-weight: 600; color: var(--ink); }
  /* A code that does not fit the printed grammar: almost always a typo, so it
     is marked where somebody is standing in front of the shelf. */
  .ehs-code.ehs-odd { color: var(--bad); }
  .invrow .bad { color: var(--bad); font-weight: 600; }
  /* On a phone the NAME is the row (Simon, 2026-08-28: the width was hiding
     it behind the mix ratio and the TDS button). The knowledge tail and the
     state breakdown go; the name gets its width back and may wrap to a
     second line rather than ellipsize. Count, expiry, code and pill stay —
     those are what a person at the shelf is checking. */
  @media (max-width: 700px) {
    .invrow.invgrp .matinfo, .invrow.invgrp .grp-states { display: none; }
    /* .pmini.invrow beats the base .pmini .pm-name nowrap, which sits later
       in the file and would win a specificity tie. */
    .pmini.invrow .pm-name { white-space: normal; overflow: visible; }
  }
  /* Material knowledge (materials.js): the info strip on a lot's detail page
     and the lite ratio/TDS tail on a group row. */
  .matstrip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 2px;
    padding: 6px 10px; background: var(--surface-2); border-radius: var(--r-md); font-weight: 600; }
  .matinfo { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 400; }
  .matinfo .sm { padding: 1px 6px; }
  /* Select… (mass delete) — same look as the WO picker. */
  .invrow.picked, table.list tr.picked { background: var(--accent-soft); }
  .invrow input[type="checkbox"], table.list .pickcell input { accent-color: var(--accent); flex: none; }
  table.list .pickcell { width: 34px; }
  /* The shared picker (core.js pickBar) on the lists that are not tables. */
  .docrow.picked, .sline.picked, .rdrow.picked { background: var(--accent-soft); }
  .tl-wk.picked .tl-wkhd { background: var(--accent-soft); }
  .docrow .wopick, .rdrow .wopick, .tl-wkhd .wopick, .sl-pick .wopick { accent-color: var(--accent); flex: none; margin-right: 6px; }
  .sl-pick { display: flex; align-items: center; gap: 4px; cursor: pointer; min-width: 0; }
  .sl-pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rdpick { margin-bottom: 6px; }
  /* The Fusion section on a mold card: a stack of label/value rows. */
  .fusionblk { display: grid; gap: 6px; }

  /* ---- the receiving desk ---- */
  /* The sheet is the budget line-item grid one size up, and wears the same
     dress on purpose. Fixed layout so row 200 s long material name cannot
     re-measure every column above it, and a sticky header so the column
     meanings survive a long scroll. */
  .rxhead { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .rxhead .f { margin: 0; }
  table.sub.rxgrid { table-layout: fixed; }
  table.sub.rxgrid td { vertical-align: middle; padding: 4px 6px; }
  table.sub.rxgrid thead th { position: sticky; top: calc(var(--topbar-h) + 8px); z-index: 3;
    background: var(--surface-2); box-shadow: inset 0 -1px 0 var(--line); }
  .rxgrid .rxc-cls { width: 116px; }
  /* The count and what it will become share one cell. A column of its own read
     "1 record" on nine rows in ten — ink spent on something that does not vary
     across rows — and it cost 100px the material name needed more. */
  /* The count and its readout share one line. Two things make that fit without
     the column reclaiming width the material name needs: the readout is kept
     short ("1 of 3", not "1 record of 3"), and the input is sized for the three
     digits a delivery line actually carries rather than for a paragraph. The
     nowrap is what stops the span dropping to a second line — it broke between
     the input and the text, which is how "3 / 1 record / of 3" happened. */
  .rxgrid .rxc-qty { width: 128px; white-space: nowrap; }
  .rxgrid .rxc-qty input { width: 46px; margin-right: 6px; }
  .rxgrid .rxc-bin { width: 170px; }
  .rxgrid .rxc-vendorLot { width: 92px; }
  /* Sized for the tag serial, not for the multi-tag case — several codes in
     one cell is rare (a 3-jug line) and scrolls inside the input fine. */
  .rxgrid .rxc-ehs { width: 110px; }
  .rxgrid .rx-ehs { display: flex; gap: 4px; align-items: center; }
  .rxgrid .rx-ehs input { flex: 1 1 auto; min-width: 0; }
  .rxgrid .rx-ehs .sm { flex: none; padding: 2px 5px; }
  .rxgrid .rxc-expiresOn { width: 122px; }
  .rxgrid .rxc-unitCost { width: 64px; }
  /* Wide enough for the button it holds: 13px icon + 18px padding + borders,
     plus the cell's own 16px. table-layout: fixed never grows a column, so a
     30px column did not squeeze the button — it let it overflow the table's
     right edge and hang past the card border at every width. */
  .rxgrid .rxc-x { width: 52px; }
  /* The sheet is full width, not a pane in a split. Measured: the split left
     it 784px at 1440 and 490px at 1100, which eight columns and a material
     name cannot live in — so it overflowed sideways at the design width, and
     every fix available amounted to hiding the columns people came to fill. */
  /* ---- the R&D bench ----
     An index strip ABOVE a full-width sheet, not a pane beside it, for exactly
     the reason written on the receiving desk above: a split leaves the grid
     490px at 1100, and the coupon grid carries MORE columns than receiving's
     eight, so it fails harder here. App-only classes, tokens only — nothing in
     this family is lifted into 05 Design System, which is still an open
     decision and must not be resolved by accident. */
  /* ---- the programme strip and the bench ----
     The tab's two storeys. A masthead and a sticky, horizontally snap-scrolling
     strip of programme cards (one per study, one per R&D part, with that part's
     runs as chips inside it), over a full-width BENCH that renders whatever is
     selected: the coupon sheet, or the real part detail, or the real traveler.

     A horizontal strip rather than a rail, on purpose. The note above says why
     the sheet cannot live in a pane, and the same measurement kills a rail for
     the part detail too — the bench gives it MORE width than the Parts tab
     does. It also gives the tab a silhouette nobody mistakes for Parts or Work
     Orders, which is the point.

     Hueless, like the .tpill.rnd capsule it takes its cue from: --ink on
     --card, the display face, a heavy top rule and a word. Gold is "now",
     purple is retro, slate is hold, amber is in-work; there is no spare hue and
     the house rule says hue is never the only carrier anyway. */
  .rdmast { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 0 10px; }
  .rdmast-t { font-family: var(--font-display); font-size: 22px; font-weight: 600;
    letter-spacing: .01em; color: var(--ink); margin: 0; }
  .rdmast-n { color: var(--muted); font-size: 12px; margin: 0; }
  .rdmast-q { flex: 1 1 200px; min-width: 150px; max-width: 320px; }
  .rdmast-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  /* Only the strip is sticky. Two sticky bands is most of a 393px screen.
     Same recipe as .wosec-hd: top is --topbar-h, which core.js MEASURES. */
  /* --rd-strip-h is declared on #main, NOT on .rdstrip: the bench is the
     strip's SIBLING, so a custom property set on the strip never reaches it and
     the two rules below that subtract the strip's height would silently fall
     back to their default and be wrong at every breakpoint but one. */
  #main { --rd-strip-h: 212px; }
  .rdstrip { position: sticky; top: var(--topbar-h); z-index: 5;
    background: var(--canvas); border-bottom: 1px solid var(--line);
    padding: 8px 0 10px; margin: 0 0 12px; max-width: 100%;
    display: grid; grid-auto-flow: column; grid-auto-columns: 340px; gap: 10px;
    overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity; scroll-padding-inline: 2px;
    height: var(--rd-strip-h); }
  /* A fixed card height does three jobs at once: a long study name cannot
     reflow the strip, the snap points stay regular, and the anchor rule below
     has a number to subtract. */
  .rdcard { position: relative; scroll-snap-align: start; min-width: 0; overflow: hidden;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-md); border-top: 3px solid var(--ink);
    box-shadow: var(--shadow); padding: 9px 11px 10px;
    display: flex; flex-direction: column; gap: 6px;
    transition: box-shadow var(--t-fast) var(--ease); }
  .rdcard:hover { box-shadow: var(--shadow-md); }
  /* An INSET ring, not a thicker border: a border-width change resizes the card
     and shifts every snap point in the strip the moment you select one. */
  .rdcard.on { box-shadow: inset 0 0 0 2px var(--ink); }
  .rdcard.late { border-top-color: var(--bad); }
  /* Runs started before anybody knew what they were a run OF. A dashed top rule
     rather than the solid one, because the card is a holding pen and not a
     programme unit in its own right. */
  .rdcard-loose { border-top-style: dashed; }
  .rdcard-loose p { margin: 0; }
  /* The card is a fixed-height flex column, so every row that is not the runs
     foot has to be flex:none. Without it the browser SHRANK them to make room —
     .rdcard-meta came out 0px tall with 18px of text inside it, which reads as
     a missing line rather than as a squeeze. */
  .rdcard > * { flex: none; }
  .rdcard-hd { display: flex; align-items: center; gap: 6px; min-width: 0; }
  /* THE STRETCHED LINK. The name is a real button; its ::after covers the whole
     card, so pressing anywhere opens the record. Everything that is its own
     target — run chips, batch rows, the checkbox — is a sibling lifted above it
     on the z axis below. Same recipe as .loccard on the storage map, including
     the reason: a <button> wrapping the card's divs had nowhere to put a second
     control. */
  .rdcard-nm { font-size: 15.5px; font-weight: 700; line-height: 1.25;
    display: block; width: 100%; white-space: normal; text-overflow: clip;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .rdcard-nm::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-md); }
  .rdcard-nm:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rdcard-meta { font-size: 12px; color: var(--muted); min-width: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rdcard-id { font-variant-numeric: tabular-nums; }
  .rdcard-facts { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
  /* The stage rail is a 16px strip in a rail row, where it sits beside a name
     on one line. On a card it is one of two things you read from across a
     bench, so it gets the size the space was going spare on anyway. */
  .rdcard .prog3 .sg { width: 34px; height: 21px; font-size: 11.5px; border-radius: 5px; }
  /* Work orders get their own ruled foot, labelled. A run is a different kind
     of record from the part that holds it, and a chip floating in the card's
     whitespace read as neither — it looked like a stray button. Studies use the
     same foot for their batches, so the two card kinds rhyme. */
  .rdruns { margin-top: auto; padding-top: 7px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 0;
    position: relative; z-index: 1; }
  .rdruns-lab { font-family: var(--font-display); font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
    white-space: nowrap; flex: none; }
  .rdruns-chips { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
  .rdchip-id { font-variant-numeric: tabular-nums; }
  /* Everything with a target of its own rides above the stretched link. */
  .rdcard .rdcard-more, .rdcard-hd input[type="checkbox"], .rdcard .rdthumb {
    position: relative; z-index: 1; }
  /* 11px, not the 10.5 the other uppercase micro-labels use: this one is a
     word on a card rather than a count inside a chip, so test_appui measures it
     as body text and holds it to the floor. */
  .rdkind { font-family: var(--font-display); font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; }
  .rdcard-nm { min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .rdtally { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11.5px;
    color: var(--muted); }
  /* The card height is fixed on purpose (see .rdstrip), so the one part of it
     that can grow without limit — the batch list, or a part's runs — scrolls
     inside the card instead of being silently clipped by the overflow above.
     A half-visible batch row reads as a rendering fault, not as "there is more". */
  /* A study with six batches must not push the card past its fixed height, so
     the list scrolls inside the foot rather than growing it. */
  .rdcard-more { overflow-y: auto; margin: 0 -3px; padding: 0 3px;
    display: flex; flex-direction: column; gap: 2px; min-height: 0;
    max-height: 62px; flex: 1 1 auto; }
  .rdtally b { font-family: var(--font-display); color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .rdtally .zero { opacity: .45; }
  .rddue { font-size: 11.5px; color: var(--muted); }
  .rddue.late { color: var(--bad); font-weight: 600; }
  .rdthumb { width: 56px; height: 42px; object-fit: cover; border-radius: var(--radius);
    border: 1px solid var(--line); flex: none; }
  .rdruns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; }
  .rdchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .rdchip b { font-family: var(--font-display); color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .rdchip:hover { border-color: var(--border-2); color: var(--ink); }
  .rdchip.on { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
  .rdchip.ghost { border-style: dashed; background: none; }
  .rdchip-flag { color: var(--bad); }
  .rdchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Adding rows and adding a batch act on the OPEN STUDY, so they sit on its
     sheet rather than in the masthead, which speaks for the whole programme.
     A thinner rule than .rdacts above it: this is the second row, not a peer. */
  .rdadd { margin-top: -4px; padding-top: 6px; border-top: 1px solid var(--line); }
  /* What a study GROUPS: the parts filed under it, and the one place to file
     one. A study is a folder as well as a grid of coupons. */
  .rdgroup { margin: 10px 0 2px; padding-top: 8px; border-top: 1px solid var(--line); }
  .rdgroup-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .rdgroup-body { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 6px; min-width: 0; }
  .rdgroup .moldchip { max-width: 100%; min-width: 0; }
  .rdgroup .moldchip .rd-open { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* min(340px, 100%), not 340px: a 320px phone is narrower than the cap, and a
     bare max-width made the document 373px wide inside a 320px viewport. */
  .rdgroup .moldadd { width: 100%; max-width: min(340px, 100%); }
  .rdin { color: var(--muted); }
  .rdbench { min-width: 0; }
  .rdmoved { max-width: 60ch; }
  .rdmoved p { color: var(--muted); font-size: 13.5px; }
  /* The bench's section anchors clear the topbar AND the stuck strip. Without
     this they land underneath it and ptJump()/woJump() look broken. */
  #main .rdbench [id^="pt-"], #main .rdbench [id^="wo-"] {
    scroll-margin-top: calc(var(--topbar-h) + var(--rd-strip-h) + 58px); }
  /* The part and run detail bring their own sticky furniture, written for a tab
     whose only sticky band is the topbar. In the bench there are two, so the
     jump bar and the undo bar stack UNDER the strip rather than landing on top
     of it. The strip outranks both on z, because it is the thing you navigate
     with and it must never be the thing that gets covered. */
  .rdbench .secnav { top: calc(var(--topbar-h) + var(--rd-strip-h)); z-index: 3; }
  .rdbench .undobar { top: calc(var(--topbar-h) + var(--rd-strip-h) + 8px); z-index: 3; }
  @media (max-width: 1200px) { #main { --rd-strip-h: 204px; } .rdstrip { grid-auto-columns: 300px; } }
  @media (max-width: 900px) {
    #main { --rd-strip-h: 214px; }
    /* One line of detail on a phone, not two: the strip is stuck and every row
       it keeps is a row of the record underneath that you cannot see. */
    .rdcard-meta { -webkit-line-clamp: 1; }
    .rdcard-more { max-height: 46px; }
    .rdstrip { grid-auto-columns: 78vw; scroll-snap-type: x mandatory; }
    .rdmast-acts { margin-left: 0; }
  }
  @media (max-width: 430px) {
    #main { --rd-strip-h: 220px; }
    .rdstrip { grid-auto-columns: calc(100vw - 32px); scroll-padding-inline: 16px; }
    .rdmast-q { max-width: none; }
  }
  /* .rd-open carries `all: unset`, which throws the tap-target floor away —
     the trap already noted below. The chips and cards need it restated. */
  @media (pointer: coarse) {
    .rdchip { min-height: 40px; }
    .rdcard .rd-open { min-height: 40px; }
  }
  .rdsheet { margin-top: 10px; }
  .rdempty { max-width: 62ch; }
  .rdempty p { color: var(--muted); font-size: 13.5px; }
  .rdrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px;
    border-radius: var(--radius); border: 1px solid transparent;
    transition: background var(--t-fast) var(--ease); }
  .rdrow:hover { background: var(--hover); border-color: var(--line); }
  .rdrow.on { background: var(--hover); border-color: var(--border-2); }
  /* One indent, and only one: a batch sits under its project and nothing sits
     under a batch. The rule is enforced in rnd.js; this is it made visible. */
  .rdchild { margin-left: 20px; }
  .rdchild::before { content: "└"; color: var(--muted); font-size: 12px; margin-right: -4px; }
  .rd-open { all: unset; cursor: pointer; font-weight: 600; font-size: 13.5px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px; }
  .rd-open:hover { color: var(--accent); }
  .rd-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  /* `all: unset` throws away the tap-target floor, the same trap .lc-open and
     .sl-open carry a note about. */
  @media (pointer: coarse) { .rd-open { min-height: 40px; } .rdrow { min-height: 44px; } }
  /* The shared fold header for Materials, Columns and Compare on a study's
     sheet. Named .rdparts-hd because the R&D-parts fold is where it started;
     that fold is gone (the parts are cards on the strip now) and the three
     sheet folds still use it, so the name outlived its origin. Built from a
     class and a real button, NOT <details> — a closed <details> skips painting
     and vanishes from print, which is why the house rule forbids it and why
     .wosec.folded looks the way it does. */
  .rdparts-hd { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; font-size: 12px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); }
  .rdparts-hd:hover { color: var(--ink); }
  .rdparts-hd:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  @media (pointer: coarse) { .rdparts-hd { min-height: 40px; } }
  .rdhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rdhead h2 { margin: 0; }
  .rdq { margin: 4px 0 10px; font-size: 13.5px; color: var(--muted); }
  .rdn { width: 62px; }
  /* The study's own status, on its head rather than in the grid — it describes
     the study, not any coupon in it. Sized to its longest value so the head
     does not reflow when it changes. */
  .rdstat { width: 104px; }
  .rdnorows { margin: 10px 2px; }
  .rdcols, .rdcmp, .rdmat { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
  .rdcols.folded .rdcols-body, .rdcmp.folded .rdcmp-body, .rdmat.folded .rdmat-body { display: none; }
  /* The closed fold carries the answer, because "what went into this" is read
     far more often than it is set. Truncated rather than wrapped: a summary
     that grows to two lines pushes the grid down on every study. */
  /* min-width: 0 is what makes the ellipsis actually happen. A nowrap child of
     a flex row refuses to shrink below its content width without it, so on a
     phone the summary pushed the fold header to 494px inside a 393px viewport
     and the whole page scrolled sideways — which the UI suite fails, correctly.
     max-width caps it on a desktop, where there is room to spare. */
  .rdparts-hd { max-width: 100%; overflow: hidden; }
  .rdmatsum { text-transform: none; letter-spacing: 0; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; flex: 0 1 auto; max-width: 46ch; }
  .rdmat-body p { margin: 2px 8px 6px; }
  .rdmat-body .grid { padding: 0 8px 6px; }
  /* An inherited value is muted and says so, because a batch showing its
     project's resin otherwise looks identical to one that set its own — and
     then an override is invisible until it bites somebody. */
  .rd-inh { font-style: italic; }
  .rdcol { display: flex; align-items: center; gap: 8px; padding: 4px 8px; flex-wrap: wrap; }
  .rdcolnew input, .rdcolnew select { min-width: 0; }
  .rdunit { width: 68px; }
  .rdcols p { margin: 2px 8px 6px; }

  /* The coupon grid. table-layout: fixed is what makes a DYNAMIC column set
     work without computing track sizes into the markup — the spine takes fixed
     widths and the user columns share what is left.

     Season's discipline, restated for a table: exactly ONE column may shrink to
     nothing, and it is notes, not the label. Nothing scrolls sideways. */
  .rdgridwrap { overflow-x: auto; }
  table.sub.rdgrid { table-layout: fixed; }
  .rdgrid th, .rdgrid td { vertical-align: middle; }
  .rdgrid input, .rdgrid select { width: 100%; min-width: 0; box-sizing: border-box; }
  .rdgrid .rdc-label { width: 84px; }
  .rdgrid .rdc-batch { width: 122px; }
  .rdgrid .rdc-status { width: 116px; }
  .rdgrid .rdc-user { width: 108px; }
  .rdgrid .rdc-notes { width: auto; min-width: 0; }
  .rdgrid .rdc-act { text-align: right; }
  /* A result column is what the study is FOR. A hairline on its leading edge
     separates measured from chosen without spending a colour on it — statuses
     already own colour in this app. */
  .rdgrid .rdc-result { box-shadow: inset 1px 0 0 var(--line); }
  .rdgrid tr:focus-within td { background: var(--hover); }
  .rdgrid .rowact { padding: 2px 5px; color: var(--muted); }
  .rdgrid .rowact:hover { color: var(--bad); }
  .rdcmptable td { font-variant-numeric: tabular-nums; }
  .rdcmp .toolbar { margin: 4px 0; }
  .rdacts { margin: 8px 0 4px; flex-wrap: wrap; }
  /* Three buttons in a 34px column would not fit, so the column widens only
     when it has to — the grid's other tracks are fixed and notes takes the
     slack, so this costs the notes field and nothing anybody types into more
     often. */
  .rdgrid .rdc-act { width: 96px; white-space: nowrap; }
  .rdgrid .rowact { padding: 2px 4px; }
  .rdgrid .rowact.has { color: var(--accent); }
  /* The count rides ON the photo button rather than beside it: a coupon that
     has a photo should be visible while scanning down the column, without
     opening anything. */
  .rdphn { font-size: 9.5px; font-weight: 700; margin-left: 1px; vertical-align: super; }
  .rdphotos { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .rdphotos .phtile { margin: 0; width: 132px; }
  .rdphotos .phimg { width: 132px; height: 96px; object-fit: cover; border-radius: var(--radius);
    border: 1px solid var(--line); cursor: zoom-in; display: block; }
  .rdphadd { align-self: center; }


  /* Below the desktop band each row becomes a card, the receiving idiom: the
     table parts go display:block, the head is hidden, and every cell prints its
     column name ABOVE the field from data-label. Never beside it — a 96px label
     gutter is ruinous at 393px, which is already written down on .rxgrid. */
  @media (max-width: 1200px) {
    .rdgrid, .rdgrid thead, .rdgrid tbody, .rdgrid tr, .rdgrid td { display: block; width: auto; }
    .rdgrid thead { display: none; }
    .rdgrid tr { position: relative; margin-bottom: 8px; padding: 8px 10px 10px;
      border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card); box-shadow: var(--shadow); }
    .rdgrid td { border-top: 0; padding: 4px 0; }
    .rdgrid td::before { content: attr(data-label); display: block; font-size: 11px;
      letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    /* The card's title, so it needs no label of its own. */
    .rdgrid .rdc-label { font-size: 15px; padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .rdgrid .rdc-label::before { content: none; }
    .rdgrid .rdc-result { box-shadow: none; }
    .rdgrid .rdc-act { position: absolute; top: 6px; right: 8px; padding: 0; }
    .rdgrid .rdc-act::before { content: none; }
  }

  .rxsheet { margin-top: 10px; }
  .rxindex .toolbar { margin: 0; }
  .rxindex-body { max-height: 30vh; overflow: auto; margin-top: 8px; }
  .rxindex-body .pgrouphd { position: sticky; top: 0; z-index: 1; background: var(--card); }
  /* Output, never an input — the budget grid s "each" cell restated. Muted at
     one record, because one line making one record is not news; brand ink the
     moment it diverges, because that IS the news and it is exactly what the
     confirm is about to ask you to approve. */
  /* Sits BESIDE the count input, always on one line. The column stays narrow
     on purpose — a wide one costs the material name 50px on every row — so the
     readout is kept short enough to fit ("1 of 3", not "1 record of 3") and
     told never to wrap. It wrapped before, and a three-line cell reading
     "3 / 1 record / of 3" looks broken rather than informative. */
  .rx-fan { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  .rx-fan.many { color: var(--brand-ink); font-weight: 700; }
  .rx-na { color: var(--faint); }
  .rxgrid tr:focus-within td { background: var(--hover); }
  .rxfoot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .rxbusy { margin: 0 0 10px; padding: 7px 10px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface-2); }
  .rxline .pm-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 640px) {
    .locgrid { grid-template-columns: 1fr; }
    /* The id crowds the name into "UT …" on a phone; the row opens the record,
       which shows it. Names beat ids at this width. */
    .invrow > .tny { display: none; }
  }
  .pmini { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-top: 1px solid var(--line);
    border-radius: var(--radius); cursor: pointer; }
  .pmini:hover { background: var(--hover); }
  .pmini .pm-name { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pmini .pm-due { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ---- timeline grid ----
     Stations are ROWS, weeks are COLUMNS. It used to be the other way round,
     which put the growing axis (weeks, one per week of the season, forever) on
     the axis that makes the page longer, and the fixed axis (seven stations,
     set in timeline.js) on the axis that has to fit. That is what forced the
     old `min-width: 900px` and made the tab 2.3 screens wide on a phone. It is
     also the transpose of the mockup this tab was designed from
     (06 Composites App/design/timeline-weeklyplan-mockup-20260728.png), and the wrong way
     round for the question the tab exists to answer, which is "when is Mold 1
     free" — a single horizontal scan now, a column-hunt across eleven columns
     before.

     The DOM is week-major: one .tl-wk per week, holding a header and one cell
     per row. `display: contents` on it means grid-auto-flow:column lays each
     of those groups out as one column, with no computed grid coordinates and
     no inline styles anywhere. That is also what lets the same markup fall
     back to one card per week below 900 without reordering a thing — a
     transposed TABLE could not, because CSS cannot regroup cells by column. */
  .tlgrid {
    display: grid; grid-template-columns: 168px; grid-auto-columns: minmax(136px, 1fr);
    grid-auto-flow: column; grid-template-rows: auto repeat(9, minmax(40px, auto));
    overflow-x: auto; overscroll-behavior-x: contain; scroll-padding-left: 168px;
    scrollbar-width: thin;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-md); box-shadow: var(--shadow);
  }
  /* The fade at the scrollable edge. A styled scrollbar is not enough on its
     own: macOS hides overlay scrollbars until you actually scroll, so a season
     wider than the window read as a grid whose last column had been cut off
     mid-word rather than one there is more of. The .more-* classes are set
     from the real scroll position by syncTimelineScroll(), so the fade appears
     only on the side that has something behind it and never on a season that
     fits. */
  .tlwrap { position: relative; }
  .tlwrap::before, .tlwrap::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 34px; pointer-events: none;
    opacity: 0; transition: opacity var(--t) var(--ease); z-index: 3; border-radius: var(--r-md);
  }
  .tlwrap::before { left: 168px; background: linear-gradient(to right, var(--card), transparent); }
  .tlwrap::after { right: 0; background: linear-gradient(to left, var(--card), transparent); }
  .tlwrap.more-left::before, .tlwrap.more-right::after { opacity: 1; }
  .tlgrid::-webkit-scrollbar { height: 10px; }
  .tlgrid::-webkit-scrollbar-thumb { background: var(--border-2); border: 3px solid var(--card); border-radius: 999px; }
  .tl-stations, .tl-wk { display: contents; }
  /* The station rail pins while the weeks scroll past it. Needs an opaque
     background of its own or the cells slide under it. */
  .tl-corner, .tl-strow {
    position: sticky; left: 0; z-index: 2; background: var(--surface-2);
    border-right: 1px solid var(--line); border-top: 1px solid var(--line);
    padding: 9px 12px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); display: flex; align-items: center;
  }
  .tl-corner { border-top: none; }
  /* Other and Notes are per-week free text, not stations. Same rows, heavier
     rule above them so the seven real stations read as a group. */
  .tl-strow.tl-sep { border-top: 2px solid var(--border-2); }
  /* Deliberately NOT sticky. It is a grid item, and a vertical `position:
     sticky` on one detaches it from the row its station label is in — the
     header floats up to the topbar while the rail scrolls away, and the two
     stop describing each other. The grid is ten rows tall, so there is nothing
     to gain: it is the WEEKS that scroll here, and that is horizontal, which
     the station rail already pins for. */
  .tl-wkhd {
    background: var(--surface-2); padding: 8px 11px; border-bottom: 1px solid var(--line);
    font-family: var(--font-display); font-weight: 600; color: var(--brand-ink);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 40px;
  }
  /* A 136px column is narrow enough to break "Jul 28" across two lines, which
     reads as two dates. */
  /* The date is a button (it opens the date picker), so most of this undoes the
     app's outlined button styling to leave it reading as the header text it
     has always looked like. */
  .tl-wkdate {
    white-space: nowrap; font: inherit; color: inherit; background: none; border: none;
    padding: 2px 5px; margin: -2px -5px; border-radius: var(--radius); cursor: pointer;
    transition: background var(--t-fast) var(--ease);
  }
  .tl-wkdate:hover { background: var(--hover); }
  /* One trash can per week is eleven trash cans across a season. Present, and
     quiet until you are actually in that column. Touch has no hover, so there
     it just stays visible. */
  .tl-del { margin-left: auto; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
  .tl-wk:hover .tl-del, .tl-wk:focus-within .tl-del, .tl-del:focus-visible { opacity: 1; }
  @media (pointer: coarse) { .tl-del { opacity: 1; } }
  /* A cell is a button: tapping it opens the assign picker. Everything here
     after `display` is undoing the app's own button styling, which is a full
     outlined control and would draw 90 of them in a grid. */
  .tl-cell {
    display: flex; align-items: center; gap: 6px; width: 100%; min-height: 40px;
    padding: 6px 9px; font: inherit; font-size: 13px; text-align: left; color: var(--ink);
    background: none; border: none; border-top: 1px solid var(--line); border-radius: 0;
    cursor: pointer; transition: background var(--t-fast) var(--ease);
  }
  .tl-cell:hover { background: var(--hover); }
  /* An empty cell says nothing. "open" written into all 45 of them was the
     most repeated text on the tab, and it was what set the column width. The
     tap affordance comes back on hover instead, and the toolbar says it in
     words once. */
  .tl-cell.empty { color: var(--faint); }
  .tl-cell.empty .tl-open { visibility: hidden; }
  .tl-cell.empty:hover .tl-open, .tl-cell.empty:focus-visible .tl-open { visibility: visible; }
  .tl-note { font-style: normal; white-space: normal; font-size: 12.5px; }
  .tl-wk.retro .tl-cell, .tl-wk.retro .tl-wkhd { background: var(--retro-bg); }
  /* This week, on the one grid where "which one is now" is the whole question.
     The same gold edge the rest of the app uses for "today", rotated with the
     grid: it was the row's left border, it is the column's top. Last so it
     beats .retro. */
  .tl-cell.now, .tl-wkhd.now { background: var(--gold-bg); }
  .tl-wkhd.now { box-shadow: inset 0 3px 0 var(--gold); }
  .tl-stname { display: none; }
  .tl-archive { margin-top: 14px; }
  .tl-empty { text-align: center; padding: 26px 16px; }
  .tl-empty .tl-ei { color: var(--faint); }
  .tl-empty p { color: var(--muted); margin: 6px 0 14px; }
  .tl-empty .toolbar.tl-center { justify-content: center; }
  .tl-hint { align-self: center; }
  /* Phone-only affordance: on a wide screen the past weeks are in the grid
     already and the button would reveal nothing. */
  .tl-earlier { display: none; }
  /* Weekly Plan: per-person goal checklists + carpool cards. */
  /* Capped for the same reason .pbehind is: the due pill is margin-left:auto,
     so on a 1600px card it ended up most of a screen from the goal it dates.
     A goal is a sentence, and this is about a sentence's worth of width. */
  .task-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 90ch; }
  .task-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--ok); flex-shrink: 0; }
  /* The task and its checkbox stay on the same line. The row wraps, and a flex
     item's automatic minimum is its min-content width, so a goal too long to
     fit was pushed onto line two whole — leaving an orphaned checkbox above it
     with nothing beside it and the due pill alone on a third line. Three lines,
     three alignments, and the goal underneath it rendering normally, which
     reads as a fault rather than a layout. The chip is the same shape for a
     ticket row, where the label is a whole ticket title.

     `flex: 1 1 0`, and the zero is the entire fix — `1 1 auto` with min-width:0
     does NOT work here, which cost a round to find out. Flex decides WHERE THE
     LINE BREAKS using each item's hypothetical main size, and for basis:auto
     that is the item's max-content width: the whole goal on one line, ~450px.
     So the item was moved to a line of its own BEFORE any shrinking was
     considered, then shrank to fit there — which is exactly the orphaned
     checkbox. A basis of 0 makes the hypothetical size 0, so the item never
     causes a break and does its shrinking in place.

     `max-width: max-content` is the other half, and it is there because
     flex-grow: 1 does not only prevent the break — it also makes the item FILL
     the row. On a 1440px desktop that stretched every goal to full width,
     pushing each trash button to the far right with a wide empty gap between it
     and the goal it deletes, and stretching the blue pill on a ticket chip out
     to meet the due badge. Capping at max-content lets it grow up to its
     natural single-line width and no further: hugs on desktop, shrinks and
     wraps on a phone, never breaks the line. */
  .task-row .tsk-text, .task-row > .chip {
    flex: 1 1 0; min-width: 0; max-width: max-content; overflow-wrap: anywhere;
  }
  .task-row.done .tsk-text { text-decoration: line-through; color: var(--faint); }
  .due-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--muted); font-weight: 600; white-space: nowrap; margin-left: auto; }
  .due-pill.soon { background: var(--warn-bg); color: var(--amber); }
  .due-pill.late { background: var(--bad-bg); color: var(--bad); }
  .carcard { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; }
  .carcard-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .carcard-seats { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seat-open { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--border-2); color: var(--faint); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }

  /* Shared numeral tiles (budget, molds, parts, timeline, workorders). The
     dashboard no longer uses these: the board has its own .bnum scale. */
  .bignum { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--brand-ink); letter-spacing: .01em; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat-tile { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; }
  .stat-tile .bignum { font-size: 22px; }
  /* Same three states as the dashboard's .bnum, and the same words mean the
     same colours: .bad is wrong (late, blocked), .warn is amber and means
     needs-attention (unassigned, curing, no home), .ok is clear. Tiles passed
     a class for a year and it did nothing — .bignum sets its own colour and
     beats bare .warn on source order, so the number stayed navy. */
  .bignum.bad { color: var(--bad); }
  .bignum.warn { color: var(--amber); }
  .bignum.ok { color: var(--ok); }
  .stat-tile .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-top: 2px; }
  /* ---- dashboard row plumbing ----
     Rounds one to three of this page are design history now (see git); what
     survives them is the stacked row, the bucket headings and the fold, all
     reused by round four's board. The count badge in a module header. */
  .gh-n { font-size: 11px; color: var(--faint); white-space: nowrap; }

  /* The stacked row every module shares. One min-content (the longest word),
     a meta line that ellipsises — the shape that CANNOT overflow a narrow
     module the way the old three-column rail table did. */
  .srow { position: relative; display: flex; flex-direction: column; gap: 1px; padding: 6px 0; border-top: 1px solid var(--line); min-width: 0; }
  .srow:first-of-type { border-top: none; }
  .sr-main { min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .srow-meta { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow-meta .status { font-size: 11px; padding: 1px 8px; margin-right: 4px; vertical-align: middle; }
  /* .sdot is positioned at left: 0, so a row carrying one has to indent or the
     chip sits on top of its own dot. Every lane row can carry one. */
  .dlane .srow { padding-left: 16px; }
  .sdot { position: absolute; left: 0; top: 12px; width: 8px; height: 8px; border-radius: 50%; }
  .sdot.bad { background: var(--bad); }
  .sdot.warn { background: var(--amber); }
  .sdot.ok { background: var(--ok); }

  /* The group heading IS the count: the biggest number in the work column,
     because it is the one attached to the thing it counts. */
  /* Kept in the DOM for labelListTables() and for screen readers. */
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  /* A full-width row, so it clears a thumb without a bespoke control. */
  .dg-more {
    display: block; width: 100%; margin-top: 12px; padding: 11px 14px;
    text-align: left; color: var(--muted); background: var(--fill); border-color: transparent;
  }
  .dg-more:hover { color: var(--ink); border-color: var(--border-2); }

  /* The folded group. The marker sits on the summary, and the heading inside it
     keeps its own baseline — so it reads as the same group header as the rest,
     with a triangle. */

  .cure-at { font-family: var(--font-display); font-weight: 700; color: var(--brand-ink); }

  /* Seven stations, two columns on a laptop. */
  /* Two columns, never four. At auto-fit a wide screen gave four narrow ones,
     which wrapped "ShopSabre slot 1" onto two lines and put a 118px label next
     to a 60px value. Seven stations read as 4 + 3 down two columns. */


  .glance { display: flex; gap: 10px; flex-wrap: wrap; }
  .gitem { flex: 1; min-width: 70px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
  .gitem:hover { background: var(--hover); }
  .gitem .gn { font-size: 22px; font-weight: 700; color: var(--brand-ink); }
  .gitem .gl { font-size: 11px; color: var(--muted); text-transform: uppercase; }

  /* ---- the mission-control board (dashboard round four) ----
     The landing page as the shop status board. Round four shipped this as a
     constant-dark navy panel; Simon liked the board but wanted it white like
     the rest of the app, so the surfaces now come from the ordinary theme
     tokens (white cards on canvas, and the dark theme for free) and the
     board keeps its identity through structure instead: the module grid, the
     alert strip's bare numerals, and the gold speed slash on every Saira
     module header. The --board-* token family is gone with the navy.
     .dboard, NOT .board: that name has belonged to the Tickets kanban since
     the tab existed, and round four briefly stole it, which painted the
     ticket pane's kanban navy. Dashboard rules stay under .dboard only. */
  /* Round five: four lanes, a program strip, a footer.

     Round four was eleven modules on an eleven-area grid, and five of those
     areas could render nothing — so on a quiet week, or on the SN5 archive
     where every run is retro, the board had holes in the middle of it. No
     amount of repacking fixes that; what fixes it is that a lane always has
     something to say, because "nothing is blocked" is an answer. */
  .dboard { display: grid; gap: 14px;
    grid-template-columns: minmax(0, 1fr);
    /* Phone order is the day's order: what is stopped, what is mine, what is
       due, what is running without me. The program and the footer are a
       monthly and an idle read, so they sink. */
    grid-template-areas: "stopped" "you" "due" "clock" "prog" "foot"; }
  @media (min-width: 701px) and (max-width: 1300px) {
    .dboard { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "stopped you" "due clock" "prog foot"; }
  }
  /* 1300, not the house 1100. Four lanes at 1101px get about 211px each, and
     .srow was designed against 304px — the rail-overflow lesson written down
     beside it. At 1440 they are 296px and at the 1600 cap 390px. test_appui
     shoots 900/1440/1920, which lands 2x2 / 4-across / 4-across. */
  @media (min-width: 1301px) {
    .dboard { grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-areas: "stopped you due clock" "prog prog foot foot"; }
  }
  .l-stopped { grid-area: stopped; } .l-you { grid-area: you; }
  .l-due { grid-area: due; } .l-clock { grid-area: clock; }
  .dprog { grid-area: prog; } .dfoot { grid-area: foot; }
  /* Four lanes read as one board only if they are the same height. */
  .dlane.bmod { align-self: stretch; }
  /* The header IS the numeral. The alert strip counted these same things one
     row above the module that listed them — one fact drawn twice, in two places
     that could disagree. */
  .dlane-hd { display: flex; align-items: baseline; gap: 9px; margin: 0 0 9px; flex-wrap: wrap; }
  .dlane-hd .bnum { font-size: 30px; line-height: 1; }
  .dlane-lbl { font-family: var(--font-display); font-size: 12.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  /* Never a bare "nothing here": an empty lane is information, and a number in
     it is what makes it worth reading. */
  .dlane-empty { font-size: 12.5px; color: var(--muted); line-height: 1.5; padding: 4px 0; }
  .dlane-empty b { color: var(--ink); }
  .dlane-tminus { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 4px 0; }

  /* The program: the facts that are a monthly read rather than a daily one, one
     line each. A fact with no value prints a labelled dash rather than
     disappearing, so the strip is the same height whatever the data says —
     which is the whole difference between this and the five modules it
     replaced. */
  /* ONE COLUMN, both of them. The program and the footer are half the board's
     width each now, so their contents read as a list down a column rather than
     a line strung across the page — which is the whole reason for putting the
     two windows in parallel: four bars and six facts spread over 1,300px are a
     sentence you have to sweep your eye along, and the same six stacked in
     650px are a thing you read. */
  .dprog-bars { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); margin-bottom: 10px; }
  .dprog-row { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted);
    padding-top: 7px; border-top: 1px solid var(--line); margin-top: 7px; }
  /* Wraps rather than ellipsises. Each fact is its own row in a column now, so
     a long one has somewhere to go — and a truncated fact hides the number,
     which is the only part of it worth reading. */
  .dprog-i { min-width: 0; }
  .dprog-i b { color: var(--ink); font-family: var(--font-display); font-size: 14px; }
  .dfoot-band { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; }

  /* The guest showcase: a different page, not an emptier one. One column at
     every width — it is a thing to read, not a board to work from. */
  .sc-head { grid-area: head; display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; }
  .sc-prog { grid-area: prog; } .sc-parts { grid-area: parts; } .sc-nums { grid-area: nums; }
  .showcase, .showcase.dboard { grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "prog" "parts" "nums"; }
  .sc-team { font-family: var(--font-display); font-size: 14px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .sc-tminus { text-align: right; }
  .sc-tminus .bnum { font-size: 44px; }
  .sc-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .sc-card { display: grid; gap: 2px; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--surface-2); }
  .sc-name { font-weight: 600; font-size: 13.5px; }
  .sc-sub { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .sc-card .stage { justify-self: start; margin-top: 3px; }

  /* One module surface: the app's ordinary white card, on its own class
     because the theme-proof audit samples .card and this page's markup stays
     out of that sample. Rhythm comes from the headers and the numerals. */
  .bmod { min-width: 0; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    border-radius: var(--r-md); padding: 13px 15px; font-size: 13px; align-self: start; }
  /* Module header: Saira, uppercase, and the sidebar's gold speed slash so
     every module carries the register. Count sits at the right, quiet. */
  .bmod-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 9px; }
  .bmod-hd > span:first-child { position: relative; padding-left: 11px; font-family: var(--font-display);
    font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .bmod-hd > span:first-child::before { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 3px;
    border-radius: 0 2px 2px 0; background: var(--gold); transform: skewX(-12deg); }
  .bmod-hd .gh-n { opacity: .85; }

  /* T-minus. It was the right-hand end of an alert strip; it is the foot of the
     clock lane now, which is where the other things you are waiting on live. */
  .b-tminus { text-align: left; cursor: pointer; background: none; border: none;
    border-radius: var(--radius); color: var(--ink); font: inherit; padding: 4px 6px; }
  .b-tminus:hover { background: var(--hover); }
  .bnum { display: block; font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1.05;
    letter-spacing: .01em; color: var(--brand-ink); font-variant-numeric: tabular-nums; }
  .bnum.bad { color: var(--bad); }
  .bnum.warn { color: var(--amber); }
  .bnum.ok { color: var(--ok); }
  .bl { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }
  .bl b { color: var(--ink); }

  /* Inside a lane the row title is the row, same de-chroming as round three's
     white card: the tint comes back on hover, where it means something. */
  .dlane .chip { background: none; border-color: transparent; padding-left: 0; font-size: 13.5px; }
  .dlane .chip:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .dboard .dg-more { margin-top: 10px; padding: 9px 12px; font-size: 12px; }
  /* The stage gauges kept their proportions when they moved out of the season
     module and into the program strip. The track outranks --fill, which is
     within a few percent of the card in both themes — the round-three lesson. */
  .dprog .sb-bar, .showcase .sb-bar { background: var(--border-2); height: 14px; }
  .dprog .stagebreak, .showcase .stagebreak { margin: 9px 0; }
  .dprog .stagebreak:last-of-type, .showcase .stagebreak:last-of-type { margin-bottom: 0; }
  .dprog .sb-label, .showcase .sb-label { font-size: 11px; }

  /* Countdown and streaks. The T-minus numeral is the biggest thing on the
     page after the alert strip; streak rows read like a pit wall column. */
  .sc-tminus .bnum { font-size: 44px; }

  /* Launchpad tiles: real buttons, tap-target sized, quiet fills. */
  .dfoot .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 7px; }
  .b-tile { display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; min-width: 0;
    margin: 0; padding: 7px 10px; text-align: left; cursor: pointer; font: inherit;
    background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius); color: var(--ink); }
  .b-tile:hover { border-color: var(--border-2); background: var(--hover); }
  .b-tile .tl { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b-tile .tm { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Race day: the one day the board wears gold. */
  .dboard.raceday { border-top: 3px solid var(--gold); padding-top: 10px; }
  /* Fact of the day: prose, one size up, with a gold open-quote garnish. */
  /* The fact is not one of the shop's errands, and stacked under the activity
     feed with nothing between them it read as the last row of it. Its own
     surface inside the same ruled band: still the footer, plainly not the
     launchpad. */
  .dlore { margin-top: 10px; padding: 10px 12px 11px; border: 1px solid var(--line);
    border-radius: var(--r-md); background: var(--surface-2); }
  .dlore-hd { font-family: var(--font-display); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
  .dfoot .fq { position: relative; margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.55; }
  .dfoot .fq::before { content: "\201C"; position: absolute; left: 0; top: -4px; font-family: var(--font-display); font-size: 26px; color: var(--gold); }
  .dfoot .fmeta { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .dfoot .fmeta .dg-more { width: auto; margin-top: 0; padding: 5px 10px; font-size: 11.5px; }

  /* Phone: the strip becomes one scrollable chip row so four numerals do not
     spend the first screen. The row is the scroller, never the document. */
  @media (max-width: 700px) {
    .dboard { gap: 11px; }
    .dlane-hd .bnum { font-size: 26px; }
    .b-tminus { padding-left: 14px; }
    .bnum { font-size: 26px; }
    .sc-tminus .bnum { font-size: 34px; }
  }

  /* login */
  .login { max-width: 430px; margin: 8vh auto 0; }
  .login .f { margin: 10px 0; }
  .login .f label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .login .f input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
  .login .row { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .updates { display: flex; flex-direction: column; gap: 6px; }
  .sig { margin-top: 26px; display: none; }
  .sig .line { display: inline-block; width: 260px; border-bottom: 1px solid #000; margin: 0 30px 4px 0; }

  /* The print sheet lives in #printroot and is hidden on screen unless a
     preview is open. See print.js / print.css. */
  #printroot:empty { display: none; }
  body.previewing #app { display: none; }

  /* ============================================================
     REVAMP POLISH — icon-in-button alignment, hover micro-interactions,
     motorsport accents.

     This block used to also re-declare .card, table.list, .pill, .stage, .chip,
     .kind, .col and .col h4 purely to correct a radius or a font that the base
     rule above had hardcoded. It reached the right answer by overriding itself
     forty lines later, which meant every one of those components had two
     competing declarations and tools/test_designsystem.mjs could not tell which
     was the real one. The corrections now live in the base rules; what is left
     here is genuinely additive.
     ============================================================ */
  .ib { display: inline-flex; align-items: center; gap: 6px; }
  .cnt { display: inline-flex; align-items: center; gap: 3px; }
  .cnt .ico { opacity: .7; }
  /* hover response */
  .card { transition: box-shadow var(--t) var(--ease), border-color var(--t) var(--ease); }
  table.list td, .docrow, .gitem { transition: background var(--t-fast) var(--ease); }
  /* The BARE elements, styled — which the app was not doing. It styled
     `.filters input`, `.field input` and `.grid .f input` and left everything
     else to the browser, so any control outside one of those three containers
     rendered as a UA default: the Tickets search box, the People role select,
     the Work Orders process select, the Weekly Plan week picker. On a light
     theme that reads as merely plain. In dark mode it is a pale grey box on a
     near-black page, which is what a screenshot review caught.
     Same declarations as 05 Design System/components.css, which had this right
     all along; test_designsystem.mjs now fails when the app omits a visual
     property the system declares, so this cannot silently come apart again. */
  input, select, textarea {
    font: inherit; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink);
    transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
  .grid .f input:focus, .grid .f select:focus, .field input:focus, .field select:focus,
  .filters input:focus, .filters select:focus, .login .f input:focus, textarea:focus,
  table.sub input:focus, table.sub select:focus, .tlgrid input:focus, .tlgrid select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  /* project cards + stat tiles lift on hover */
  .pcard { transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .pcard:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--border-2); }
  .gitem { transition: transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
  .gitem:hover { transform: translateY(-1px); border-color: var(--accent); background: var(--surface); }
  .gitem .gn { font-family: var(--font-display); }
  /* board columns: a status-colored accent strip across the top (states + colors
     defined in the tickets block above, since they're the same 6-value enum) */
  .col { border: 1px solid var(--line); position: relative; overflow: hidden; }
  .col::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--border-2); }
  .chip { transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }

  /* ============================================================
     RESPONSIVE. Placed at the end on purpose: at equal specificity the later
     rule wins, so keeping every screen-width override here means it reliably
     beats the base rules above. Wide (≥1500) lets the auto-fit grids add a
     column; tablet (≤900) folds the sidebar into a slide-in drawer; phone
     (≤640) also stacks tables and the board and slims the topbar. A 1440
     laptop is the untouched default in the middle.
     ============================================================ */

  /* Raising main's cap to 1600 hands every auto-fit grid roughly 460 extra
     pixels, and auto-fit spends them by stretching the columns it already has
     rather than adding one — a 320px floor with 1560px to fill gives four
     tracks of 390px, which is a wider card holding the same amount of text.
     Raising the floors here makes the extra width buy a column instead. Only
     at 1500+, because these floors would force a scrollbar on a laptop. */
  @media (min-width: 1500px) {
    .pgrid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .linkgrid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .stat-row { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  }

  /* The receiving grid stacks to cards below 1320, not 900. Measured with the
     sidebar open: the grid's fixed columns plus a usable material-name cell
     need about 1000px of card, which the layout only has above ~1120. Between
     900 and 1200 the old behaviour was the worst of both — the name squeezed
     toward zero, then the table shoved its last column through the card edge.
     The exact band the width sweep did not cover, which is its own lesson:
     1440 and 900 both passing said nothing about 1000.
     Re-measured when the EH&S tag column landed: at 1201 the name cell had
     exactly its 150px minimum BEFORE the new column, so an eighth column
     pushed the honest table minimum to ~1300. Do not claw this back by
     shaving the fixed columns — they were each measured against their own
     content, and 110px cannot be scraped out of six of them. */
  @media (max-width: 1320px) {
    /* table.sub scrolls sideways from here down, which is right for a BOM you
       read and wrong for a grid you type into: a cell you cannot see is a cell
       you cannot fill. One card per line instead, labelled from the data-label
       the renderer emits (labelListTables only walks table.list). */
    table.sub.rxgrid, .rxgrid thead, .rxgrid tbody, .rxgrid tr, .rxgrid td { display: block; width: auto; }
    .rxgrid thead { display: none; }
    .rxgrid tr { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card);
      box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: 10px; position: relative; }
    /* Matching table.sub.rxgrid, not .rxgrid: the component rule above is
       (0,2,2) and would beat a (0,1,1) rule here whatever the source order.
       Living at the end of the sheet makes the cascade predictable, not
       automatic. */
    /* Label ABOVE the field, not beside it. A 96px label gutter is affordable
       at 900 and ruinous at 393: it left every input about a third of the card
       wide, so a shelf name read "RFS CONTAI" and a date was clipped to "04".
       Stacked is taller, and a surface you type into has to be legible before
       it is compact. This is the .field idiom the modals already use. */
    table.sub.rxgrid td { border-top: none; padding: 4px 0; text-align: left; }
    table.sub.rxgrid td::before { content: attr(data-label); display: block; margin-bottom: 2px;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    /* A cell whose label is blank would otherwise reserve an empty line. */
    table.sub.rxgrid td[data-label=""]::before { display: none; }
    table.sub.rxgrid .rxc-name { padding: 0 0 7px; text-align: left; border-bottom: 1px solid var(--line); margin-bottom: 5px; }
    table.sub.rxgrid .rxc-name::before, table.sub.rxgrid .rxc-x::before { display: none; }
    table.sub.rxgrid .rxc-fan { padding-top: 0; }
    table.sub.rxgrid .rxc-x { position: absolute; right: 10px; top: 7px; padding: 0; width: auto; }
  }

  @media (max-width: 900px) {
    .rxhead { grid-template-columns: 1fr; }
    .hamburger { display: inline-flex; align-items: center; }
    nav.sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; height: 100dvh;
      width: 264px; max-width: 84vw; z-index: 40;
      transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: 2px 0 18px rgba(9,30,66,.32); overflow-y: auto;
      /* All three, not just the top. Pinned to left:0, so in landscape the FEB
         mark and every nav label sit under a left-hand island without --sa-l;
         and it is 100dvh with its own scroll, so without --sa-b there is
         nothing left to scroll the last nav item clear of the home indicator. */
      padding-top: var(--sa-t); padding-left: var(--sa-l); padding-bottom: var(--sa-b);
    }
    body.drawer-open nav.sidebar { transform: translateX(0); }
    #drawer-backdrop {
      display: block; position: fixed; inset: 0; z-index: 35;
      background: rgba(9,30,66,.5); opacity: 0; pointer-events: none;
      transition: opacity .22s;
    }
    body.drawer-open #drawer-backdrop { opacity: 1; pointer-events: auto; }
    /* Narrower horizontal padding only — the safe-area insets are on the base
       rule now, and a shorthand here would reset them. */
    header.topbar { padding-left: max(14px, var(--sa-l)); padding-right: max(14px, var(--sa-r)); }
    main { padding: 16px max(14px, var(--sa-r)) calc(72px + var(--sa-b)) max(14px, var(--sa-l)); }

    /* Swap the account/admin row for the ⋯ menu at the SAME width the sidebar
       becomes a drawer. This used to happen at 640, so between 641 and ~1000 a
       lead got Backup + Restore + Roster + avatar + name + Sign out on one
       line and the topbar overflowed the page sideways. The ⋯
       menu already contains every one of those actions. */
    .tb-desktop { display: none; }
    .icon-btn.tb-morebtn { display: inline-flex; }

    /* Wide list tables collapse into stacked cards across the whole compact
       range (matches the drawer breakpoint), so the 8-column Parts table can't
       run off a tablet either. Header row hidden, each row a card, each cell a
       `Label  value` line via the data-label set in core.js. The table's own
       border/shadow is dropped so the cards own the chrome. */
    table.list { display: block; border: none; box-shadow: none; background: none; border-radius: 0; overflow: visible; }
    table.list tbody { display: block; }
    /* The header row. `:first-child` is scoped to the PARENT, so on a table
       with <thead> and <tbody> this matches twice — the header row and the
       first data row, which then vanishes. Every list table in the app emits
       bare <tr>s with no <thead>, so it has never bitten, but it is a trap
       sitting in wait for the next one. Pinned to the actual header instead. */
    table.list tr:has(> th):first-child, table.list thead tr { display: none; }
    table.list tr {
      display: block; background: var(--card); border: 1px solid var(--line);
      border-radius: 8px; box-shadow: var(--shadow); padding: 10px 13px; margin-bottom: 10px;
    }
    table.list tr:hover td { background: none; }
    /* Label floats left, the whole value (which may be several spans, e.g. a
       date plus a "(179d late)" tag) stays grouped and right-aligned on the line
       rather than being spread apart by a flex distribution. */
    table.list td {
      display: block; padding: 4px 0 4px 92px; border: none; border-top: none; text-align: right;
    }
    table.list td::before {
      content: attr(data-label); float: left; margin-left: -92px; text-align: left;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--muted); white-space: nowrap; line-height: 1.5;
    }
    /* First cell is the card title (id / name), not a label:value row. */
    table.list td:first-child {
      display: block; text-align: left; font-size: 15px;
      padding: 0 0 7px; margin-bottom: 5px; border-bottom: 1px solid var(--line);
    }
    table.list td:first-child::before { display: none; }
    /* Empty trailing action cells shouldn't leave a dangling label. */
    table.list td:empty { display: none; }

    /* Narrow detail tables (BOM, quality, event log, roster) scroll sideways
       rather than blowing out their card. */
    table.sub { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* SEASON: one card per part, like every other list here.
       This used to be an exemption FROM table.list's card collapse, because a
       <td> holding an <input> is never :empty and every row would have become
       thirteen labelled inputs stacked down a 393px screen. There are no inputs
       and no table now, so the exemption went with them. The folded two-row
       line above is already what a card wants to hold; this only gives it the
       card. */
    .sline { background: var(--card); border-color: var(--line); box-shadow: var(--shadow);
      padding: 9px 12px; margin-bottom: 8px; }

    /* TIMELINE: the grid becomes one card per week, from the same DOM. The
       markup is week-major, so `display: block` alone puts the weeks in
       reading order with nothing reordered — which is the whole reason the
       wide layout is a grid and not a table.

       Not table.list's generic card collapse, on purpose. Once the tab is
       transposed that would give one card per STATION with weeks as
       label:value lines, and "what is on Mold 1 in every week of the season"
       is not the question anyone asks on a phone. The question is what is on
       this week. */
    .tlgrid { display: block; overflow: visible; border: none; background: none; box-shadow: none; }
    .tl-stations { display: none; }
    .tl-wk {
      display: block; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-md); box-shadow: var(--shadow); padding: 10px 13px; margin-bottom: 10px;
    }
    .tl-wk.now { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold), var(--shadow); }
    .tl-wkhd {
      position: static; background: none; border: none; border-bottom: 1px solid var(--line);
      padding: 0 0 8px; margin-bottom: 4px; font-size: 15px;
    }
    .tl-wk.retro .tl-wkhd, .tl-wk.retro .tl-cell { background: none; }
    /* A solid fill does not survive a printer that drops backgrounds, and white
       text on a dropped fill is an invisible label. On paper the capsule becomes
       the outline form the printed traveler's own stamp already uses. */
    .tpill.rnd { background: none; color: #000; border: 1.25pt solid #000; }
    /* The card already carries the gold edge; the header's own bar doubles it. */
    .tl-wkhd.now { box-shadow: none; }
    .tl-cell { border-top: none; min-height: 42px; padding: 6px 0; }
    /* A week card lists what is BOOKED. Seven "open" rows per week is six
       screens of nothing; the count and the assign button below say the same
       thing in one line. */
    .tl-cell.empty { display: none; }
    .tl-stname {
      display: inline-block; min-width: 92px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    }
    /* Finished weeks, folded. Only here: on a wide screen they are part of the
       grid and scrolling past them costs one flick, but stacked they are eight
       screens between you and this week. */
    .tlgrid:not(.showpast) .tl-wk.past { display: none; }
    .tl-earlier { display: flex; }

    /* PARTS: the master–detail split collapses to one pane at a time — index,
       tap, detail, back — which is exactly what the tab did before the split
       existed. `.has-sel` is set by renderParts() whenever a part is selected,
       and it is the SAME condition the wide layout uses to decide what the
       right pane holds, so the two widths can never disagree about state. A
       squeezed two-column layout on a phone is the failure mode this avoids. */
    /* minmax(0, 1fr), not 1fr: a 1fr track still takes min-content as its
       automatic minimum, so one unbreakable filename in the pane makes the
       single column wider than the phone and the page scrolls sideways. */
    .mdsplit { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .mdsplit.has-sel > .mdindex { display: none; }
    /* Nothing selected: the index is the page, and the season read that fills
       the right pane on a wide screen stacks UNDER it rather than being thrown
       away — one column, in the order you'd read it. */
    .mdsplit:not(.has-sel) > .mddetail { margin-top: 6px; }
    /* Index without its pane chrome: it IS the page here, so the rows carry the
       card look instead (the same shape the stacked list tables above use). */
    .mdindex { position: static; max-height: none; display: block; overflow: visible;
      background: none; border: none; border-radius: 0; box-shadow: none; }
    .pindex-head { padding: 0 0 10px; background: none; border-bottom: none; }
    .plist { padding: 0; overflow: visible; }
    /* The work-order section tabs stop being sticky here. At this width the
       pane IS the page, so the tabs are already at the top of it; pinning them
       under the topbar only costs a strip of the bench view. */
    .secnav { position: static; }
    /* The rail is the page here and the page scrolls, so there is no clipped
       edge to fade and no inner scrollbar to hint at. */
    .plistfade { display: none; }
    .pgrouphd { top: 0; }
    .pitem { margin-bottom: 8px; padding: 10px 13px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .keyhint { display: none; }             /* no hardware keyboard down here */
    /* The rail toggle is meaningless in a drawer: the sidebar is already off
       screen, so there is no space to reclaim and collapsing it would just be
       a way to end up with icons and no labels in a panel you opened
       deliberately. */
    .sb-toggle { display: none; }
    /* Same logic for the tickets-rail toggle: at this width has-sel already
       hides the rail and back/Esc is the navigation, so the button is a no-op. */
    .tkrail-btn { display: none; }
  }
  /* Tablet band — the intersection of the two breakpoints either side of it,
     not a third breakpoint of its own. What it buys: between 641 and 900 the
     split has already collapsed (≤900) so the index owns the full width, but
     the phone rules (≤640) haven't kicked in yet. A two-line index row that
     earns its shape in a 336px rail wastes most of an iPad's width and makes
     the list twice as long as it needs to be, so in this band alone the row is
     one line — name, stages, faces, deadline in fixed tracks. Delete this block
     and nothing breaks; the rows just go back to two lines and the list to
     twice the scrolling. */
  @media (min-width: 641px) and (max-width: 900px) {
    /* Fixed track widths, not `auto`: a row with no deadline or no named
       engineer must not slide its stage rail out of line with the row above. */
    .pitem { grid-template-columns: minmax(0, 1fr) 168px 66px 74px; gap: 0 14px; }
    /* A work-order row carries more in pi-sub than a part's three-segment stage
       rail does — a progress bar, a fraction, and a blocked/curing chip — so it
       gets a wider track. Scoped to .wosplit so Parts keeps the 168px it was
       tuned for. */
    .wosplit .pitem { grid-template-columns: minmax(0, 1fr) 230px 66px 74px; }
    .pitem .pi-name, .pitem .pi-sub, .pitem .pi-who, .pitem .pi-due { grid-row: 1; }
    .pitem .pi-name { grid-column: 1; font-size: 14px; }
    .pitem .pi-sub { grid-column: 2; }
    .pitem .pi-who { grid-column: 3; }
    .pitem .pi-due { grid-column: 4; justify-content: flex-end; }
    .pfilters { grid-template-columns: 2fr 1fr 1fr auto; }
    .pfilters > input { grid-column: auto; }
  }
  @media (max-width: 640px) {
    /* 101.6mm is 384px and the modal is narrower than that on a phone. Scaled
       rather than scrolled: the point of the preview is seeing the whole label
       while you type it. */
    .cl-prev { zoom: .82; }
    .xgroup .linkrow { flex-direction: column; align-items: stretch; }
    .xg-hd { flex-direction: column; align-items: flex-start; gap: 2px; }
    .copyout { height: 40vh; font-size: 12px; }
    .inv-nowhere-bar { flex-direction: column; align-items: stretch; }
    .gsr { grid-template-columns: 1fr; }
    .gsr-where { justify-self: stretch; text-align: left; }
    .gsr-name { white-space: normal; }
    header.topbar h1 { font-size: 16px; }

    /* A document title gets two lines here instead of one with an ellipsis.
       One line truncates at about 24 characters on a 393px phone, and the
       datasheet shelf is full of names where the first 24 characters are the
       part everyone shares: "EC SDS XCR Epoxy Coating R…" beside "EC TDS XCR
       Epoxy Coating…" differ at character four, and the three SDS sheets cut
       off exactly the revision date, which is the field you open an SDS to
       check. Two lines is ~70 characters and reaches the discriminator on
       every name on the shelf, while the clamp keeps the row from growing
       without limit on a pasted URL. */
    .dl-t {
      white-space: normal;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; overflow-wrap: anywhere;
    }
    .docrow { align-items: flex-start; }
    .docrow .di, .docrow .dsz { padding-top: 1px; }

    /* Six section tabs at the 40px coarse-pointer minimum is well over two
       phone widths of button, which wrapped to three rows and put 120px of
       chrome above the step you came to sign. One row that scrolls instead —
       the same trade .rte-toolbar already makes, for the same reason. */
    .secnav { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .secnav::-webkit-scrollbar { display: none; }
    .secnav-btn { flex: none; }

    /* Tickets board: one status section per row, each full width. Desktop drag
       isn't used here; a card tap opens it. */
    .board { grid-auto-flow: row; grid-template-columns: 1fr; }

    /* A step is number | body | buy-off across a desktop row. On a phone the
       button was taking half the 393px and leaving the body a ~110px column,
       which is fine for "Trim and finish" and unreadable for anything with a
       sentence in it — a cure hold notice came out two words per line, twenty
       lines tall. Wrap the button underneath instead, indented past the number
       so it still reads as belonging to that step. */
    .step { flex-wrap: wrap; }
    .step .body { flex: 1 1 100%; min-width: 0; }
    .step .buyoff { flex: 1 1 100%; margin-left: 40px; }
    /* The buy-off stretches to a full-width thumb target; the camera and
       flag icons ride beside it at their own size. */
    .step .buyoff button:not(.ib) { flex: 1; justify-content: center; }

    /* Modals: single-column two-up rows, tighter padding on a small screen. */
    /* Tighter, but never at the cost of the insets — this shorthand used to
       reset them and put the search field under the island. */
    #modal .backdrop { padding: max(16px, calc(var(--sa-t) + 10px)) max(10px, var(--sa-r)) max(16px, calc(var(--sa-b) + 10px)) max(10px, var(--sa-l)); }
