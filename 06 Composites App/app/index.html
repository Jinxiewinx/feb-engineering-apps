<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 exists to stop iOS Safari's automatic zoom-in when a
     sub-16px input takes focus (the scan box, the receiving grid — Simon:
     "the app zooms in slightly when any keyboard opens"). Since iOS 10 the
     cap is IGNORED for user pinch gestures, so accessibility zoom still
     works; only the focus auto-zoom is suppressed. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#002b50">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Composites">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/saira-var.woff2" as="font" type="font/woff2" crossorigin>
<title>FEB Composites</title>
<script>
  /* Set the theme before first paint (no flash): saved choice, else system. */
  (function(){try{var t=localStorage.getItem('feb-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('feb-rail')==='1'){document.documentElement.classList.add('rail');}}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
  /* Self-hosted so the app keeps its type offline at the field station. Both
     are variable fonts (one file each covers every weight). */
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/inter-var.woff2') format('woff2'); }
  @font-face { font-family: 'Saira'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/saira-var.woff2') format('woff2'); }

  /* ---- design tokens ----
     Old names (--blue --canvas --card --line --ink --muted --faint --bad --ok
     --amber --accent --accent-soft --radius --shadow) are kept as aliases so
     every existing component themes for free; the dark block below just
     re-points the shared tokens. New names (--surface-2 --hover --fill, status
     -bg/-border, --shadow-md, motion, fonts) drive the revamp. */
  :root {
    color-scheme: light;
    /* brand */
    --blue: #003262; --navy-2: #024a86; --brand-blue: #2f6be4; --brand-ink: #003a75;
    --gold: #FDB515; --gold-2: #ffc63d;
    --sb-bg: #002b50; --sb-text: #c4d0e0; --sb-hover: rgba(255,255,255,.09); --sb-active: rgba(253,181,21,.18);
    /* surfaces */
    --canvas: #eef1f6; --card: #ffffff; --surface: #ffffff;
    --surface-2: #f4f7fb; --fill: #eef1f6; --hover: #f2f5fa;
    --line: #dde3ec; --border-2: #c6d0de;
    /* text */
    --ink: #141d2b; --muted: #515f74; --faint: #616e83;
    /* interactive + status */
    --accent: #2f6be4; --accent-soft: #e8f0fd;
    --ok: #0d7a55; --ok-bg: #e2f6ee; --ok-border: #a8e6cc;
    --amber: #a25c00; --warn-bg: #fdf1d8; --warn-border: #f0d081;
    --bad: #cf3430; --bad-bg: #fdeceb; --bad-border: #f4bbb6;
    --retro: #5a45b0; --retro-bg: #ece8fb; --retro-border: #c7bcf0;
    --purple: #6a3fb0; --purple-bg: #efe7fb; --purple-border: #d3c0f0;
    /* on hold: slate. Deliberately NOT amber (amber means in-work: Parts
       st-mid, WO InWork, cure gates) and not red (red is late/blocked). A
       parked thing is cool and quiet. */
    --hold: #47566b; --hold-bg: #e8edf4; --hold-border: #c3cfdf;
    --info-bg: #e8f0fd; --gold-bg: #fff7e0;
    /* ply materials — swatch beside a text tag, never the row background;
       hue is never the only carrier (same rule print.css states) */
    --ply-cf: #3b4653;
    --ply-spread: #6b7684;
    --ply-mesh: #c98f4a;
    --ply-core: #FDB515;
    --ply-other: #cfd6e0;
    /* effects */
    --radius: 6px; --r-md: 9px; --r-lg: 14px;
    --shadow: 0 1px 2px rgba(10,22,40,.06), 0 1px 3px rgba(10,22,40,.09);
    --shadow-md: 0 2px 6px rgba(10,22,40,.07), 0 8px 22px rgba(10,22,40,.10);
    --shadow-lg: 0 18px 44px rgba(10,22,40,.20);
    /* The inner edge shadow that says a box scrolls sideways. Its own token
       because it is read against --fill in a code block and --card in a table,
       and it has to survive the dark theme, where the light-theme value is
       invisible against a dark surface. */
    --shadow-edge: rgba(10,22,40,.20);
    --carbon: rgba(255,255,255,.04);
    /* motion + type */
    --t: .17s; --t-fast: .12s; --ease: cubic-bezier(.2,.6,.2,1);
    --font: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Saira', 'Inter', system-ui, sans-serif;
    /* safe areas — the notch, the Dynamic Island, the home indicator.
       The meta viewport sets `viewport-fit=cover` and the PWA runs standalone
       with a translucent status bar, all three on purpose: that is what lets
       the navy topbar meet the island like a native app instead of sitting
       below a white letterbox. The price is that EVERY element at a screen
       edge owns its own inset, and for a long time only two did.

       Wrapping env() in a custom property is not decoration. env() cannot be
       faked in a headless browser, but a variable holding it CAN be overridden
       by an injected stylesheet — which is the whole reason
       tools/test_safearea.mjs can measure a simulated iPhone instead of
       grepping this file for the string "env(". Use these, not env() directly. */
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-r: env(safe-area-inset-right, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
    /* Measured from the real topbar by syncChromeMetrics() in core.js: its
       height depends on --sa-t, and everything sticky below it has to clear
       whatever that came out as. The fallback is the old hardcoded number, so
       a render before the JS runs is no worse than it used to be. */
    --topbar-h: 52px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    /* Berkeley Blue lifted off the dark canvas. --blue is a SURFACE here (the
       primary button, the selected filter chip, the goal bar) and it had no
       dark value at all, so it stayed #003262 — a near-black navy sitting on a
       #0b0f16 canvas, which made every selected state read as a hole rather
       than a selection. Lifted enough to separate from --card, still the brand
       hue, still ~6.8:1 under the white text these surfaces carry. */
    --blue: #1d5aa8;
    --navy-2: #2a6bb5; --sb-bg: #071a30; --brand-ink: #6f9dff;
    --canvas: #0b0f16; --card: #141c28; --surface: #141c28;
    --surface-2: #1a2431; --fill: #1a2431; --hover: #212d3d;
    --line: #26313f; --border-2: #37455c;
    --ink: #e7edf5; --muted: #9aa8bd; --faint: #8794a8;
    --accent: #5b8cff; --accent-soft: #182842;
    --ok: #34c88f; --ok-bg: #0f2a20; --ok-border: #1f4d3b;
    --amber: #e0a53a; --warn-bg: #2a2211; --warn-border: #4a3d1c;
    --bad: #ff6f62; --bad-bg: #2c1613; --bad-border: #56291f;
    --retro: #a99bf0; --retro-bg: #1d1935; --retro-border: #3a3168;
    --purple: #a385e6; --purple-bg: #241c3a; --purple-border: #3d2f5c;
    --hold: #a9bbd1; --hold-bg: #232b36; --hold-border: #3a4757;
    --info-bg: #182842; --gold-bg: #2a2411;
    --ply-cf: #7d8ba0; --ply-spread: #9aa7ba; --ply-mesh: #d8a35f;
    --ply-core: #FDB515; --ply-other: #46536a;
    --shadow: 0 1px 2px rgba(0,0,0,.5); --shadow-md: 0 4px 18px rgba(0,0,0,.55); --shadow-lg: 0 18px 44px rgba(0,0,0,.6);
    --shadow-edge: rgba(0,0,0,.55);
    --carbon: rgba(255,255,255,.03);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 14px/1.5 var(--font); background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  button { font: inherit; font-weight: 500; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 7px 12px; cursor: pointer; color: var(--ink);
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
  button:hover { background: var(--hover); border-color: var(--border-2); }
  button:active { transform: translateY(.5px); }
  button.primary { background: var(--blue); border-color: var(--brand-ink); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--navy-2); border-color: var(--navy-2); }
  button.gold { background: var(--gold); border-color: var(--gold); color: #3a2c00; font-weight: 700; }
  button.gold:hover { background: var(--gold-2); border-color: var(--gold-2); }
  button.danger { color: var(--bad); }
  button.danger:hover { background: var(--bad-bg); border-color: var(--bad-border); }
  button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; }
  button.link:hover { background: none; text-decoration: underline; }
  /* `.btn` and `.sm` were written 13 times across weeklyplan/people/projects and
     never defined, so every "small" button rendered full size. `.btn` carries
     the base button look for real (it's a no-op on a <button>, but now also
     works if it's ever put on an <a>), and `.sm` finally makes a button small. */
  .btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 500;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    padding: 7px 12px; cursor: pointer; color: var(--ink); text-decoration: none; }
  /* No min-height override — the @media (pointer: coarse) block below still has
     to be able to grow these to a 40px tap target on a tablet at the bench. */
  .sm { padding: 4px 9px; font-size: 12.5px; }
  /* An anchor wrapping a button collapses to its text's inline box (14px on
     the Documents shelf's Open link) while the button inside is full size, so
     the tap-target audit rightly flags the anchor. Flex makes the wrapper the
     button's own size. */
  .btnwrap { display: inline-flex; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  :focus:not(:focus-visible) { outline: none; }
  ::selection { background: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

  /* ---- app shell: sidebar + content ---- */
  #app { display: flex; min-height: 100vh; }
  nav.sidebar { width: 216px; flex: 0 0 216px; color: var(--sb-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    padding-left: var(--sa-l);
    background-color: var(--sb-bg);
    background-image: repeating-linear-gradient(45deg, var(--carbon) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, var(--carbon) 0 1px, transparent 1px 7px); }
  nav.sidebar:empty { display: none; }
  .sb-brand { display: flex; align-items: center; gap: 9px; padding: 15px 14px 12px; cursor: pointer; }
  .sb-brand-txt { font-weight: 700; font-size: 15px; color: #fff; letter-spacing: .2px; }
  .sb-brand-txt span { color: var(--gold); }
  .feb-mark { flex: none; }
  .ico { display: inline-block; vertical-align: middle; flex: none; }
  .sb-nav { display: flex; flex-direction: column; padding: 6px 8px; gap: 2px; flex: 1; }
  /* Group headers between nav sections (the .pgrouphd idiom, recolored for
     the navy sidebar). In the collapsed 56px rail the text has no room, so
     the header degrades to a centered hairline: the grouping survives as
     rhythm. aria-hidden — it is presentation, the buttons carry the names. */
  .sb-hd { margin: 10px 3px 3px; padding: 0 8px; font-size: 10.5px; font-weight: 800; letter-spacing: .09em;
    text-transform: uppercase; color: var(--sb-text); opacity: .55; }
  html.rail .sb-hd { margin: 8px 14px 6px; border-top: 1px solid var(--sb-hover); height: 0; padding: 0; overflow: hidden; }
  html.rail .sb-hd span { display: none; }
  .sb-item { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 7px; color: var(--sb-text); cursor: pointer; font-size: 13.5px; font-weight: 500; border: none; background: none; text-align: left; width: 100%; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .sb-item:hover { background: var(--sb-hover); color: #fff; }
  .sb-item.active { background: var(--sb-active); color: #fff; font-weight: 600; }
  /* gold "speed slash" marking the active tab. Sits INSIDE .sb-item's own box
     (left:2px, not a negative offset into the parent's padding) on purpose:
     nav.sidebar becomes an overflow:auto clipping container on mobile (see the
     responsive block below), and a marker positioned outside its own item's
     box — plus the extra reach from the skew transform — got silently clipped
     there even though it rendered fine on desktop where nothing clips. */
  .sb-item.active::before { content: ""; position: absolute; left: 2px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); transform: skewX(-12deg); }
  .sb-item .ic { display: inline-flex; align-items: center; justify-content: center; width: 20px; opacity: .9; }
  .sb-item .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  /* The rail: the sidebar collapsed to icons, hands 160px back to the content.
     A class on <body> rather than on the nav, because main's width is what
     actually changes and the two have no ancestor in common below #app.
     Everything here is width and visibility only — the navy, the carbon
     crosshatch and the gold speed slash are the app's signature surface and
     survive the collapse intact, which is the point of collapsing rather than
     hiding. Labels move to `title`, set in renderSidebar().
     Only above 900px: below that the sidebar is already a drawer that is not
     on screen at all, so there is nothing to reclaim and a second collapsed
     state would just be a way to end up with no navigation. */
  .sb-toggle { display: flex; align-items: center; gap: 11px; margin: 0 8px 8px; padding: 9px 11px;
    border: none; background: none; border-radius: 7px; color: var(--sb-text); cursor: pointer;
    font: inherit; font-size: 13.5px; width: calc(100% - 16px); text-align: left;
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .sb-toggle:hover { background: var(--sb-hover); color: #fff; }
  .sb-toggle .ic { display: inline-flex; align-items: center; justify-content: center; width: 20px; opacity: .9; }
  html.rail nav.sidebar { width: 56px; flex-basis: 56px; }
  /* .sb-label, not `> :not(.ic)`. The nav labels used to be bare text nodes,
     and CSS cannot select a text node — the rule matched nothing, and the rail
     shrank to 56px with every label still painted, spilling over the content.
     A screenshot caught it; a computed-style probe did not, because
     getComputedStyle on a text node quietly reports the body's. */
  html.rail .sb-brand-txt,
  html.rail .sb-label { display: none; }
  html.rail .sb-brand { justify-content: center; padding: 15px 0 12px; }
  html.rail .sb-item, html.rail .sb-toggle { justify-content: center; padding-left: 0; padding-right: 0; gap: 0; }
  html.rail .sb-nav { padding: 6px 4px; }
  html.rail .sb-toggle { margin: 0 4px 8px; width: calc(100% - 8px); }
  /* The unread pip has no room to sit at the end of a label that isn't there,
     so it rides the icon's top-right corner instead of disappearing. */
  html.rail .sb-item .dot { position: absolute; margin: 0; top: 6px; right: 8px; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* The insets live on the BASE rule, not in the ≤900 block where they started:
     a landscape iPhone 15 Pro Max is 932px wide, so it takes the desktop rule —
     and in landscape the island moves to the LEFT, which is why the horizontal
     insets are here too and not just the top one. Additive: a device with no
     island still gets its normal 10px. */
  header.topbar { display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--sa-t)) max(20px, var(--sa-r)) 10px max(20px, var(--sa-l));
    background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header.topbar:empty { display: none; }
  /* min-width:0 + ellipsis is what lets the bar survive a narrow phone. A flex
     item's automatic minimum size is its CONTENT, so without this the title
     refuses to shrink, the actions get pushed out, and the whole document ends
     up wider than the viewport — which on mobile Safari zooms the entire page
     out rather than scrolling one element. Measured: adding a fifth icon button
     to .actions took a 320px viewport to a 351px document until this landed. */
  header.topbar h1 { font-family: var(--font-display); font-size: 19px; margin: 0 auto 0 0; color: var(--ink); font-weight: 600; letter-spacing: .01em;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .tb-desktop { display: flex; align-items: center; gap: 8px; }
  /* Hamburger + overflow "⋯" appear only on small screens (see media queries). */
  .hamburger { display: none; border: none; background: none; font-size: 20px; line-height: 1; padding: 6px 8px; cursor: pointer; color: var(--ink); border-radius: var(--radius); }
  .hamburger:hover { background: var(--hover); }
  /* Two classes deep on purpose. The button is `class="icon-btn tb-morebtn"`,
     and a plain `.tb-morebtn { display: none }` ties with `.icon-btn { display:
     inline-flex }` further down — later wins, so the phone overflow menu was
     showing on desktop *as well as* the full action row it exists to replace,
     and pushed the topbar past the viewport around 950px. */
  .icon-btn.tb-morebtn { display: none; }
  /* Set by syncChromeMetrics() when the account row measures wider than the bar
     it lives in — which happens at widths above the ≤900 breakpoint once a
     landscape safe-area inset eats into the edge, and for a lead whose row is
     longest. Same swap the breakpoint does, driven by fit instead of by guess. */
  body.tb-overflow .tb-desktop { display: none; }
  body.tb-overflow .icon-btn.tb-morebtn { display: inline-flex; }
  /* The version line in the desktop action row — the same links the ⋯ sheet's
     footer carries, so Announce is reachable at the width the app is actually
     used at. nowrap because it is measured: syncChromeMetrics collapses the
     whole row to the ⋯ menu when it overflows, and a line that wrapped would
     make the bar taller instead of wider and never trip that. */
  .tb-ver { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .menu-actions { display: flex; flex-direction: column; gap: 6px; }
  .menu-actions button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 11px 12px; }
  .menu-actions button .ico { color: var(--muted); }
  .menu-actions button.danger .ico { color: var(--bad); }
  #drawer-backdrop { display: none; }
  /* 1600, not 1180. On a 1920 monitor the old cap put 1140px of content in a
     1704px space and left 27% of the window empty on every tab; on a 2560 it
     was 47%. Still a cap and not 100%: past about 1600 a table row gets long
     enough that the eye loses which row it is on, which is the thing the
     gutter is actually buying. Tabs that want more than this ask for it by
     class rather than by moving the default. */
  main { max-width: 1600px; width: 100%; margin: 0 auto;
    padding: 18px max(20px, var(--sa-r)) calc(60px + var(--sa-b)) max(20px, var(--sa-l)); }
  /* All responsive rules live in one block at the end of this stylesheet, so
     they reliably override the base rules above regardless of specificity. */

  /* ---- avatars ---- */
  .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden; background: var(--muted); color: #fff; font-weight: 600; vertical-align: middle; flex: none; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.init { background: var(--muted); }
  .avatar-btn { border: none; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
  .avatar-stack { display: inline-flex; }
  .avatar-stack .avatar { margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
  .avatar-stack .avatar:first-child { margin-left: 0; }

  /* ---- filters / tables (carried from before, restyled) ---- */
  .filters { display: flex; gap: 8px; margin: 6px 0 14px; flex-wrap: wrap; }
  .filters select, .filters input { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table.list { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow); }
  table.list th { background: var(--surface-2); color: var(--muted); text-align: left; padding: 8px 11px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  table.list th.sortable { cursor: pointer; user-select: none; }
  table.list th.sortable:hover { color: var(--brand-ink); }
  table.list td { padding: 9px 11px; border-top: 1px solid var(--line); cursor: pointer; vertical-align: middle; }
  table.list tr:hover td { background: var(--hover); }
  /* Was scoped to `table.list .tny`, but 28 call sites use it outside a list
     table (ticket detail, the ⋯ menu, Weekly Plan, Documents rows) where it
     silently did nothing. Global, since that's how it's used. */
  .tny { font-size: 12px; color: var(--muted); }
  table.list.dash td { cursor: default; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 5px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--fill); color: var(--muted); }
  .pill.Complete { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .pill.InWork { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .pill.Draft { background: var(--fill); }
  .pill.OnHold { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .pill.retro { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro); }
  /* Archived: put away, not gone. Grey, and the rail row dims so a restored
     one visibly comes back to life. */
  .pill.archived { background: var(--fill); border-color: var(--line); color: var(--muted); border-style: dashed; }
  .pitem.isarch { opacity: .62; }
  /* "This purchase is on somebody else's line." Purple, the app's existing
     colour for a record that is real but sits outside the normal flow — the
     pill carries the budget's name, so it reads as a label rather than as a
     warning. It is not a status and must not borrow amber or red. */
  .pill.offbudget { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple); }
  /* "now" — the current week, today, the thing you are standing in. Gold, the
     app's existing language for it. NOT .pill.warn: amber means in-work here,
     and a week being the current one is not a status. */
  .pill.now { background: var(--gold-bg); border-color: var(--gold); color: var(--brand-ink); }
  .stage { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600;
    background: var(--fill); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .stage.st-0 { background: var(--fill); color: var(--muted); }
  .stage.st-mid { background: var(--warn-bg); border-color: var(--warn-border); color: var(--amber); }
  .stage.st-done { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .stage.st-na { background: var(--retro-bg); border-color: var(--retro-border); color: var(--retro); }
  .stagerow { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  /* The Reports status board: one card per section instead of one 1600px
     card whose text ran ~500px and left the rest empty. Masonry columns, not
     a grid: five cards of wildly unequal height (a one-line Budget next to an
     N-row deadline list) in an auto-fit grid gave ragged rows, a lone
     stretched card when the tracks didn't divide, and gulfs of empty page —
     "blocks all over the screen" (Simon, 2026-08-13). Columns pack each card
     under the previous one; the card's own 14px bottom margin is the vertical
     gutter, matching column-gap, where the grid's gap had doubled it. */
  .rgrid { columns: 320px; column-gap: 14px; }
  .rgrid > .card { break-inside: avoid; }
  .stage-bar { width: 64px; height: 5px; border-radius: 999px; background: var(--fill); overflow: hidden; margin-top: 4px; }
  .stage-bar-fill { height: 100%; border-radius: 999px; }
  .stage-bar-fill.st-0 { background: var(--muted); }
  .stage-bar-fill.st-mid { background: var(--amber); }
  .stage-bar-fill.st-done { background: var(--ok); }
  .stagecell { display: inline-block; }
  /* A <button>, so `font: inherit` and the box reset are needed — everything up
     to `cursor` is undoing the app's own button styling, the same way .tl-cell
     does it. Kept visually identical to the old <span>. */
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 5px; font: inherit; font-size: 12px; line-height: 1.5; text-align: left; min-height: 0; background: var(--accent-soft); border: 1px solid var(--accent-soft); color: var(--accent); cursor: pointer; }
  .chip:hover { filter: brightness(.97); }
  .kind { display: inline-block; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 3px; vertical-align: 1px; text-transform: uppercase; }
  /* Budget-goals modal row inputs. bgReadDom() reads these back by class, so
     the flex sizing lives on the class rather than inline — a class the
     stylesheet never defines is a phantom the design-system test rejects. */
  .bg-name { flex: 2; }
  .bg-goal { flex: 1; max-width: 110px; }
  /* ---- trainings: credential capsules ----
     A credential, not a status: fully-rounded silhouette and one quiet color,
     so an INF pill next to a green Complete pill can't be misread as done.
     The 5px-radius rectangles above stay statuses; capsules mean "holds a
     training". Long name + who granted it ride in the title tooltip. */
  .tpill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--surface-2); border: 1px solid var(--border-2); color: var(--muted); white-space: nowrap; }
  .trwrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  /* One training per row in the per-person modal; the whole row is the tap
     target so a checkbox is reachable with gloves on. */
  .trrow { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; min-height: 40px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .trrow:last-of-type { border-bottom: 0; }
  .trrow input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; }
  /* ---- the training matrix (People) ----
     Rows = people, columns = the catalog. The WRAPPER owns the horizontal
     scroll (a growing catalog must never make the page scroll sideways) and
     the person column is sticky with an opaque background so names survive
     the scroll. Lead cells are buttons; a granted cell hints revoke on hover
     (check dims toward --bad), an empty grantable one hints ＋. Gold/amber
     rules don't apply here: the check is --ok because granted IS a state. */
  .mtxwrap { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; }
  table.mtx th, table.mtx td { text-align: center; }
  table.mtx .mtxperson { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; min-width: 150px; }
  .mtxcell { display: inline-flex; align-items: center; justify-content: center; width: 100%;
    min-height: 32px; background: none; border: 0; cursor: pointer; padding: 2px; }
  /* The affordance is a pill, not a bare glyph: a dashed ＋ capsule is
     "somewhere a grant goes", the filled ✓ capsule is the grant. Hover says
     the intent: the ＋ firms toward ok, the ✓ dims toward revoke. */
  .mtxcell .tpill { font-size: 12px; min-width: 30px; justify-content: center; }
  .tpill.mtx-add { border-style: dashed; color: var(--muted); background: none; }
  .mtxcell:hover .tpill.mtx-add { border-color: var(--ok-border); color: var(--ok); background: var(--ok-bg); }
  .tpill.mtx-yes { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  .mtxcell:hover .tpill.mtx-yes { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
  /* R&D — a real part or run that is not a season deliverable.
     NOT a status, and it must never be readable as one, so it borrows nothing
     from the status vocabulary. Every status badge in this stylesheet — .pill,
     .status, .wflag, .stage — is a ~5px-radius RECTANGLE carrying a LIGHT TINT
     of its own hue. This is the opposite of all three: the fully-rounded .tpill
     capsule (the documented "credential, not a status" silhouette),
     solid-filled, and with NO HUE AT ALL. Shape says "category", fill weight
     says "look at me", and there is no hue left to confuse with in-work, late,
     done, archive, collecting, parked or now.
     One token pair, no new tokens and no dark override: --ink on --card is
     near-black on white, and because both re-point under [data-theme="dark"]
     the capsule inverts itself to near-white on dark. The distinction survives
     greyscale, a colour-blind reader and a photocopy, because the carriers are
     fill weight and the word — never hue.
     NOT dashed. Dashed already means "not real yet" everywhere here —
     .tpill.mtx-add, .ln-ghost, .pstep.na, .comment.deleted — and an R&D part is
     real carbon on a real deadline. Dashed would say the exact thing this
     feature exists to deny.
     11px, NOT .tpill's 10.5px: the UI suite enforces an 11px floor on readable
     type and this badge appears on the dashboard and the work-order rail, which
     .tpill's training capsules do not. Do not harmonise it back down — the
     suite will catch it, but the reason is that this is read across a bench. */
  .tpill.rnd { background: var(--ink); border-color: var(--ink); color: var(--card);
             letter-spacing: .06em; font-size: 11px; }
  /* The R&D toggle, in the part's action row beside Edit and Delete. A bare
     label rides the top of a row of 30px buttons, so it centres itself onto
     their baseline. Only ever rendered on a part with no runs against it — once
     real work exists the control becomes the lead-only Move to season button
     (rndControl, parts.js). The box is 15px because this gets tapped with
     gloves on. */
  .rndtog { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .rndtog input { width: 15px; height: 15px; }
  .mtxro { font-size: 14px; }
  .mtxcol-hi { background: var(--accent-soft); }
  .mtxcol-arch { opacity: .55; }
  /* ---- issue resolve band (ticket detail) + WO closeout rows ---- */
  .resolveband { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
  .resolveband select { max-width: 260px; }
  .corow { border-top: 1px solid var(--line); padding: 10px 0; }
  .corow:first-of-type { border-top: 0; }
  .corow.codone { color: var(--muted); font-size: 13px; }
  /* The disposition record: what happened, and what was done. Prose on the row,
     never a fold — DESIGN-NOTES forbids folding with <details> and nothing
     force-opens one on print, and this is the most print-worthy string here.
     Clamped to four lines so a long root cause cannot own the section; the
     clamp is lifted for paper in the print block. */
  .conarr { margin: 5px 0 2px; display: grid; gap: 3px; }
  .conarr-row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .conarr-lab { flex: none; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: var(--faint); min-width: 92px; }
  .conarr-t { min-width: 0; color: var(--ink); font-size: 13px; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  /* Landing on an issue from its own chip. A ring, not a fill: the row may
     already be tinted by its state and a second background would fight it. */
  .corow.cohit { animation: cohit 1.4s var(--ease); border-radius: var(--radius); }
  @keyframes cohit { 0%, 60% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: none; } }
  .corow textarea { min-height: 56px; }

  /* ---- tickets: kind badge, colored status, gates, sub-tickets ---- */
  .kindfilter { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .kindfilter span { padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .kindfilter span.on { background: var(--blue); color: #fff; }
  .kindbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; padding: 2px 7px; vertical-align: 1px; }
  .kindbadge.project { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-soft); }
  .kindbadge.issue { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-border); }
  /* white-space: nowrap because a pill's label is one token to the eye. Inside
     a table.sub cell (whose td carries overflow-wrap: anywhere for bare URLs)
     an unprotected pill shatters to one letter per line at phone widths. */
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 5px; font-size: 12px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status.todo { background: var(--fill); color: var(--muted); border-color: var(--border-2); } .status.todo .dot { background: var(--faint); }
  .status.inprogress { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); } .status.inprogress .dot { background: var(--accent); }
  .status.collecting { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); } .status.collecting .dot { background: var(--purple); }
  /* Slate, not amber: amber means in-work everywhere else in the app, and a
     ticket On Hold is the opposite of in work. (.pill.OnHold on Work Orders
     stays red and untouched: it is borrowed as a generic exception badge by
     Inventory and Budget.) */
  .status.onhold { background: var(--hold-bg); color: var(--hold); border-color: var(--hold-border); } .status.onhold .dot { background: var(--hold); }
  .status.done { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); } .status.done .dot { background: var(--ok); }
  .status.cancelled { background: var(--surface-2); color: var(--faint); border-color: var(--line); text-decoration: line-through; } .status.cancelled .dot { background: var(--faint); }
  /* the "large dropdown near the top with colors" — status is directly editable from here, no Edit mode needed */
  .statusdrop { position: relative; display: inline-block; }
  .statusdrop select { appearance: none; font: inherit; font-weight: 700; font-size: 13px; padding: 7px 28px 7px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-2); background: var(--fill); color: var(--muted); }
  .statusdrop.todo select { background: var(--fill); color: var(--muted); border-color: var(--border-2); }
  .statusdrop.inprogress select { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
  .statusdrop.collecting select { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
  .statusdrop.onhold select { background: var(--hold-bg); color: var(--hold); border-color: var(--hold-border); }
  .statusdrop.done select { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
  .statusdrop.cancelled select { background: var(--surface-2); color: var(--faint); border-color: var(--line); }
  /* Budget's row-level editors: the same statusdrop control, colored by the
     pill palette the list used when the status was read-only, sized down to
     sit in a table row. The cost input prints and reads like the plain
     number it replaces. */
  .statusdrop.Draft select { background: var(--fill); color: var(--muted); border-color: var(--border-2); }
  .statusdrop.InWork select { background: var(--warn-bg); color: var(--amber); border-color: var(--warn-border); }
  .statusdrop.Complete select { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
  /* Season's three stage columns. The variants above are named for ticket and
     work-order STATUSES; these are named for what stageClass() returns, which
     is a judgement about meaning rather than position in an enum — so they take
     the same tokens the .stage pills use, and one word means one colour whether
     you are reading a rail, a pill or a table cell. */
  .statusdrop.st-0 select { background: var(--fill); color: var(--muted); border-color: var(--border-2); }
  .statusdrop.st-mid select { background: var(--warn-bg); color: var(--amber); border-color: var(--warn-border); }
  .statusdrop.st-done select { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
  .statusdrop.st-na select { background: var(--retro-bg); color: var(--retro); border-color: var(--retro-border); }
  .list .statusdrop select { padding: 4px 22px 4px 9px; font-size: 12px; }

  /* ---- the Season blueprint ----
     One line per part, and the lines are COLUMNATED: every line is a grid with
     the same fixed tracks, so subteam sits under subteam and a date under a
     date all the way down the card. The alignment IS the reading mechanism —
     you scan a column, not a line — which is why the tracks are literal widths
     and not `auto`. An `auto` track sizes itself per row, and a grid per row is
     eight ragged edges rather than eight columns.

     It shipped in v3.0.0 as a two-abreast multi-column flow. That fitted about
     sixty parts on a screen and made every one of them harder to read: with
     each line sizing its own tracks, a field landed wherever its neighbours
     left room, so there was no column to scan. Half as many parts, aligned,
     is the better read — and the width one line got back paid for two more
     fields that used to need the part opening.

     .shead and .sline SHARE ONE DECLARATION of the tracks, deliberately. Two
     rules holding the same eight numbers is a drift waiting to happen, and a
     header that has drifted off its columns is worse than no header at all.

     No rules drawn between the columns. The alignment is the separation; a
     line every hundred pixels rebuilds the table nobody asked to come back.

     Nothing here can scroll sideways: the only elastic track is the name, at
     minmax(0, 1fr), so a long name shrinks its own cell rather than pushing
     the line wide. The UI suite fails any horizontal overflow of <main> and
     exempted this tab only while .mtxwrap was a scroller; there is nothing to
     exempt now. */
  /* justify-items: start, or every cell fills its track — and a cell that fills
     its track is invisible until it has a background, at which point "Done"
     prints as a 122px pill and the status column reads as a bar chart of
     nothing. The tracks position the cells; they are not the cells. */
  .sline, .shead {
    display: grid; align-items: center; justify-items: start; gap: 0 12px;
    grid-template-columns:
      /* Four text columns share the slack and four fixed ones do not. The
         alternative — one elastic name track — gives the widest column all the
         width nothing else wants, and at 1440 that left 230px of blank paper
         between a part's name and its subteam with every other column jammed
         against the right edge. Ratios, so the line uses the window it has
         without any one column running away with it.

         Every elastic track is minmax(_, Nfr) with a floor that fits its
         content, and the name's floor is 0 so a long name shrinks itself to an
         ellipsis rather than pushing the line wide. Sum of the minima is 702px
         against ~1,000px of content at the 1240px breakpoint where the two
         quiet columns drop out, so the grid can never be the thing that
         overflows. */
      minmax(0,     2fr)    /* part name                                     */
      minmax(84px,  1fr)    /* subteam                                       */
      minmax(104px, 1.2fr)  /* layup type                                    */
      88px                  /* C/M/L rail: three 26px chips, two 3px gaps    */
      122px                 /* the state in a word ("Machine Complete")      */
      minmax(96px,  1.2fr)  /* mold location                                 */
      78px                  /* deadline, with room for the late glyph        */
      46px;                 /* two 20px avatars, overlapped                  */
  }
  .seasongrid { display: block; }
  .sgroup { margin-bottom: 12px; }
  .sgroup .pgrouphd { margin-top: 0; }

  /* The column names. Said once at the top of the card and never per group —
     eight uppercase words between every subteam and its rows would be the
     loudest thing on the page.

     A blueprint is mostly empty for months and that is the tab's founding
     argument rather than a defect (see season.js's header), so most of what
     these label is blank. That is exactly when a column needs a name: an empty
     cell under a heading is a field nobody has filled in yet, and an empty cell
     under nothing is a gap. */
  .shead { padding: 0 9px 5px; margin-bottom: 4px;
    border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .shead span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Click-to-sort headers. The triangle sits right after the name as a
     ::after, so the cell's text is the bare label and the tracks stay put. */
  .shead .shd { cursor: pointer; user-select: none; border-radius: 4px; padding: 0 2px; margin: 0 -2px; }
  .shead .shd:hover, .shead .shd:focus-visible { color: var(--text); background: var(--fill); outline: none; }
  .shead .shd.on { color: var(--text); }
  .shead .shd.on::after { content: "\25B2"; font-size: 9px; margin-left: 4px; color: var(--accent); }
  .shead .shd.on.desc::after { content: "\25BC"; }

  /* .sline and not .srow — that name has belonged to the dashboard's module
     rows since round four, and the .dboard/.board collision is already one
     cautionary tale in this file. */
  .sline { position: relative; padding: 5px 9px; margin-bottom: 2px;
    border: 1px solid transparent; border-radius: 7px;
    transition: background var(--t-fast) var(--ease); }
  .sline:hover { background: var(--hover); border-color: var(--line); }
  /* Late is a spine, not a tint: position and weight survive a photocopy and a
     black-and-white laser, and the status chip beside it says the word "late"
     anyway. Nothing here is carried by hue alone. */
  .sline.late { box-shadow: inset 3px 0 0 var(--bad); }
  /* Not real yet — the dashed border is this file's existing vocabulary for
     that, and is deliberately NOT used for R&D, because R&D is real. An unnamed
     blueprint row genuinely is not: it is a commitment with nothing in it. */
  .sline.unnamed { border-style: dashed; border-color: var(--border-2); }

  /* A stretched link: one real button, whose ::after covers the whole line. The
     .lc-open idiom off a storage card, including the reason it needs an
     explicit height below — see the coarse-pointer block. */
  .sl-open { all: unset; cursor: pointer; font-weight: 600; font-size: 13.5px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sl-open::after { content: ""; position: absolute; inset: 0; border-radius: 7px; }
  .sl-open:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sline.unnamed .sl-open { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sl-sub { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  /* The two quiet ones. Muted and small on purpose: they qualify the name, they
     do not compete with it, and they are the first two columns to go when the
     window narrows. Both ellipsis rather than wrap — a line that grows to two
     rows because one mold lives somewhere with a long name breaks the only
     thing this layout is for. The full value is in the cell's own title. */
  .sl-type, .sl-loc { font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sl-stat { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sl-due { font-size: 11.5px; color: var(--muted); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 3px; }
  .sl-due.warn { color: var(--bad); font-weight: 600; }
  .sl-who { display: inline-flex; }
  .sl-who .avatar { margin-left: -5px; box-shadow: 0 0 0 2px var(--card); }
  .sl-who .avatar:first-child { margin-left: 0; }

  /* Narrowing happens in two steps, and the cheap one comes first.

     Losing layup type and mold location costs context and nothing structural,
     and it hands 216px back to the name — which is enough to carry the line
     down to a phone-adjacent width before anything has to fold. */
  @media (max-width: 1240px) {
    .sline, .shead { grid-template-columns: minmax(0, 2fr) minmax(84px, 1fr) 88px 122px 78px 46px; }
    .sl-type, .sl-loc { display: none; }
  }
  /* Then the line folds in two, the way .pitem does on the Parts rail: name and
     date on top, everything that qualifies them underneath.

     Every cell on row two is placed EXPLICITLY, in FIXED tracks. Two bugs in
     one line: the version this replaces put .sl-sub and .prog3 both at row 2 /
     column 1, which stacks two grid items in one cell — the subteam printed
     underneath the stage rail — and auto tracks would have sized row two per
     row, so a BERGO line and an AUTO-MECH line put their rails in different
     places. Folded is still columnated; it just has two rows to do it in. */
  @media (max-width: 1000px) {
    /* A header cannot label a folded line. The fields are no longer in one row,
       so eight words across the top would name columns that are not there. */
    .shead { display: none; }
    .sline { grid-template-columns: 84px 88px 1fr auto; row-gap: 3px; }
    .sl-open { grid-row: 1; grid-column: 1 / -2; }
    .sl-due { grid-row: 1; grid-column: -2 / -1; justify-self: end; }
    .sl-sub { grid-row: 2; grid-column: 1; }
    .sline .prog3 { grid-row: 2; grid-column: 2; }
    .sl-stat { grid-row: 2; grid-column: 3; justify-self: start; }
    .sl-who { grid-row: 2; grid-column: 4; justify-self: end; }
  }
  /* Budget goals: one bar per category, spent against the lead-set goal, and
     a Season bar whose tick marks where base ends and contingency begins (the
     split is deliberately quiet — tooltip, not headline). The owed card is
     the treasurer's nag list. */
  .budget-boards { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .budget-boards .goalcard { flex: 2 1 400px; }
  .budget-boards .owedcard { flex: 1 1 240px; }
  .goalrow { display: grid; grid-template-columns: minmax(110px, 170px) 1fr auto; gap: 10px; align-items: center; margin: 7px 0; font-size: 13px; }
  .goalrow.season { font-weight: 700; }
  .goallabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goaltrack { position: relative; height: 9px; border-radius: 999px; background: var(--fill); overflow: hidden; }
  .goalfill { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
  .goalfill.warn { background: var(--amber); }
  .goalfill.over { background: var(--bad); }
  .goaltick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .35; }
  .goalnum { white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
  .goalnum.over { color: var(--bad); }
  .owedcard .orow { display: flex; justify-content: space-between; gap: 10px; margin: 5px 0; font-size: 13px; }
  /* Flex, not a floated button: float sat the button above the heading's
     baseline and it read as vertically off-center (Simon, 2026-08-13). */
  .goalcard .goalhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .buy-cat { font: inherit; font-size: 12.5px; padding: 4px 6px; max-width: 160px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  .buy-cost { white-space: nowrap; }
  .buy-cost input { width: 72px; text-align: right; font: inherit; font-size: 12.5px; padding: 4px 6px; margin-left: 1px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  /* The line-items count cell: same dress as the money cells, just narrower —
     a count is two digits, and a 72px box makes "×" read as a typo's worth of
     empty space away from its number. */
  .buy-cost input.bl-n { width: 44px; }
  .statusdrop::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: .6; font-size: 10px; }
  .req { color: var(--bad); font-weight: 600; font-size: 10px; text-transform: none; }
  /* A plain-cased aside inside an uppercase label or .card h3. Six copies of
     `style="text-transform:none"` were doing this by hand. */
  .nocaps { text-transform: none; letter-spacing: normal; }
  /* "There is new activity here." Same gold pip the sidebar marks a tab with,
     which is why it is a class and not eight inline declarations. */
  .unread-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); vertical-align: middle; }
  /* ---- guest mode ----
     A control a guest may SEE but not press. Not [disabled]: Chrome dispatches
     no click and shows no title tooltip on a disabled control, so the reason
     would be unreachable on exactly the phone this gets demoed from — the same
     judgement already written down at the buy-off button in workorders.js and
     the part-stage steps in parts.js, both of which deliberately stay live so
     that pressing them teaches you something.

     aria-disabled carries it for a screen reader, title for a mouse, and a
     delegated capture-phase click (core.js) turns the tap itself into the
     explanation.

     Keyed on the ATTRIBUTES rather than on a class, because half these controls
     already carry one and an element with two class attributes keeps the first
     and drops the second — so a class would have styled the plain buttons and
     none of the ones that matter. */
  [aria-disabled="true"][data-why] { opacity: .5; cursor: not-allowed; }
  [aria-disabled="true"][data-why]:hover,
  [aria-disabled="true"][data-why]:focus-visible { opacity: .72; }
  [aria-disabled="true"][data-why]:active { transform: none; }

  /* the CS-003 enforcement made visible — same amber blocker language as a Work Order step */
  .gate { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 7px; padding: 10px 12px; margin: 8px 0; }
  .gate .gi { color: var(--amber); font-weight: 900; font-size: 15px; line-height: 1.4; }
  .gate b { color: var(--amber); }
  .gate.blocked { background: var(--bad-bg); border-color: var(--bad-border); } .gate.blocked .gi, .gate.blocked b { color: var(--bad); }
  .subticket { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); margin-bottom: 6px; cursor: pointer; }
  .subticket:hover { border-color: var(--border-2); background: var(--hover); }
  .subticket .stt { flex: 1; font-weight: 600; font-size: 13.5px; }
  .linkrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
  .col.col-todo::before { background: var(--faint); }
  .col.col-inprogress::before { background: var(--accent); }
  .col.col-collecting::before { background: var(--purple); }
  .col.col-onhold::before { background: var(--hold); }
  .col.col-done::before { background: var(--ok); }
  .col.col-cancelled::before { background: var(--faint); }

  /* ---- cards / detail ---- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; margin: 0 0 14px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--font-display); margin: 0 0 6px; font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: .01em; }
  .card h3 { margin: 16px 0 7px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .card h3:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 16px; }
  .grid .f label, .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .grid .f input, .grid .f select, .field input, .field select { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .grid .f .ro { padding: 5px 0; min-height: 1.5em; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  /* The old .jumpbar (anchor links) is gone: Parts was its last consumer and
     now shares the WO .secnav. Anchored headings still clear the sticky
     topbar + section bar instead of hiding under them. */
  #main [id^="wo-"], #main [id^="pt-"], #main [id^="tk-"] { scroll-margin-top: calc(var(--topbar-h) + 56px); }
  .muted { color: var(--muted); }
  .warn { color: var(--bad); font-weight: 600; }
  .ok { color: var(--ok); font-weight: 600; }
  textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; min-height: 44px; }

  table.sub { width: 100%; border-collapse: collapse; margin: 4px 0; font-size: 13px; }
  table.sub th { text-align: left; background: var(--surface-2); padding: 5px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  /* `overflow-wrap: anywhere` because a cell's contents decide the table's
     minimum width, and these cells hold things with no break opportunity in
     them: a bare 120-character Drive URL in a BOM source, an
     underscore-joined CAD filename in a quality check's actual. Without it one
     such string sets the min-content width of the whole table, which the work
     order's pane then cannot shrink below, and the PAGE scrolls sideways —
     measured at 1489px inside 1440px. It only affects strings that had no
     other way to wrap. */
  table.sub td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  table.sub input, table.sub select { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
  /* The sub-tickets table holds team-typed titles and short tokens, never the
     bare URLs the anywhere rule above exists for — and at phone widths that
     rule shattered "Machine" to "Machi/ne" and "12 Aug" to three lines while
     the table still had slack. Words break at word boundaries here; the due
     cell is one token; the below-900 overflow-x scroll covers what is left. */
  table.sub.tksub td { overflow-wrap: normal; }
  table.sub.tksub td:nth-child(3) { white-space: nowrap; }

  /* ---- projects board ----
     One track per status, derived from the children rather than a hardcoded
     count: PROJ_STATUS grew from 4 to 6 and a `repeat(4, 1fr)` silently wrapped
     Done and Cancelled onto a second row *under* To Do, which reads as two
     disconnected boards instead of one left-to-right flow. grid-auto-flow:column
     can't drift when a status is added. Tracks hold a 190px floor and the
     wrapper scrolls sideways rather than crushing them. */
  .boardwrap { overflow-x: auto; padding-bottom: 4px; }
  /* 176px floor: six tracks plus five 12px gaps fit inside the content box at
     any desktop width main allows, so a normal desktop shows the whole board
     with no scrollbar and the tracks still stretch — at the 1600px cap they
     reach about 250px each. Narrower windows scroll instead of crushing
     cards. */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(176px, 1fr); gap: 12px; align-items: start; }
  /* Tablet and phone keep the original stacked sections, so go back to explicit
     row flow — auto-columns would ignore grid-template-columns entirely. */
  @media (max-width: 900px) { .boardwrap { overflow-x: visible; } .board { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); } }
  .col { background: var(--fill); border-radius: var(--r-md); padding: 8px; min-height: 80px; }
  .col.dragover { background: var(--info-bg); outline: 2px dashed var(--accent); }
  .col h4 { margin: 4px 6px 8px; font-family: var(--font-display); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; }
  .pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: grab; }
  .pcard:hover { border-color: var(--border-2); }
  .pcard .t { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
  /* "part of <parent>" on a sub-ticket's card. The title already carries its
     own 6px, so this pulls up into that gap rather than opening a second one,
     and the chip shrinks: at ~180px of card the parent's title must not
     compete with this card's own. */
  .pcard .t + .tny { margin: -4px 0 6px; }
  .pcard .t + .tny .chip { font-size: 11px; padding: 1px 6px; }
  /* Six tracks means ~180px cards, so the meta line wraps instead of breaking a
     date across three lines. nowrap on the children keeps "2026-08-02" and
     "High" whole; the .right group drops to its own line when it has to. */
  .pcard .meta { display: flex; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .pcard .meta > * { white-space: nowrap; }
  .pcard .meta .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .prio { font-size: 11px; font-weight: 700; }
  .prio.High { color: var(--bad); } .prio.Medium { color: var(--amber); } .prio.Low { color: var(--faint); }

  /* ---- project detail: files + comments ---- */
  .filegrid { display: flex; flex-wrap: wrap; gap: 10px; }
  .fileitem { width: 120px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); font-size: 11.5px; }
  .fileitem .thumb { height: 84px; width: 100%; background: var(--fill) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--faint); }
  /* A photo tile is a button now — it opens the viewer instead of being a dead
     picture beside a download link. Reset the button chrome so it still reads as
     a thumbnail, and say so with the cursor, the way .cgal img already does. */
  button.thumb { appearance: none; -webkit-appearance: none; border: none; padding: 0; font: inherit; cursor: zoom-in; }
  button.thumb:hover { filter: brightness(1.06); }
  button.thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .fileitem .fn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The padding lives on the anchor, not the cell around it, so the whole strip
     under the thumbnail is the link rather than a 14px line of text floating in
     a padded box. */
  .fileitem .fn a { display: block; padding: 5px 7px; color: var(--ink); text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; }
  a.thumb { text-decoration: none; cursor: pointer; }
  a.thumb:hover { filter: brightness(1.06); }
  a.thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* ---- the thread ----
     Each comment is its own inset surface rather than a paragraph separated by
     a hairline. --surface-2, not --card: a white card inside a white card is
     distinguished only by --line, which is ~1.3:1 against a card in BOTH
     themes — so in dark mode consecutive comments had no visible boundary at
     all. That was survivable at one line each and is not at document length. */
  /* Inside the Notes section now, not a card after the last one. The rule
     separates it from the free-text note above it rather than from a card. */
  .thread-card { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .comment {
    display: block; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 14px 16px; margin-bottom: 10px;
  }
  /* Wraps as a row, and the two atoms in it never wrap inside themselves.
     Avatar + name + timestamp + two icon buttons in 330px meant every comment
     opened with "Ana / Rivera" beside a date stacked over a time — a lumpy 2x2
     block of fragments before a word of content, on every comment in the
     thread. A name and a timestamp are single objects; if they don't all fit on
     one line the line should break BETWEEN them. */
  .comment .chead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
    font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  /* nowrap plus an ellipsis escape: a display name is short, but the fallback
     when there is no name is the email address, and nowrap alone on a 40-
     character address would push the header past the card. */
  .comment .chead b { color: var(--ink); font-size: 13.5px; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .comment .chead time { margin-left: auto; white-space: nowrap; }
  .comment:target { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
  /* Edit/remove sit in the header, quiet until the comment is hovered — the
     same treatment .tl-del gets, including being permanently visible on touch
     where there is no hover to reveal them. */
  .cacts { display: flex; gap: 2px; margin-left: 6px; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
  .comment:hover .cacts, .comment:focus-within .cacts { opacity: 1; }
  @media (pointer: coarse) { .cacts { opacity: 1; } }
  .comment.deleted { background: none; border-style: dashed; }
  /* A step note stays a one-line control at the bench; the button beside it is
     the way into the full composer. */
  .stepnote { display: flex; align-items: center; gap: 6px; }
  .stepnote input { flex: 1; min-width: 0; }

  /* ---- ticket detail split ----
     Its own grid, no longer riding on .mdsplit: the Tickets tab itself is a
     master-detail split now, and the generic <=900 mdsplit rules (single
     column, the selected-row rule that hides the index) must not cascade
     into this inner one — here the left column is content you need alongside
     the discussion, not a list you navigate away from.

     The DOM puts .tkmain FIRST and grid areas put the metadata visually on
     top, so a phone (which stacks by source order) reads the description and
     thread before the metadata. That is what finally retires the forced-open
     details rail: the phone problem is solved by rendering, not by fighting
     a browser primitive. The postmortem for the CSS-over-details attempt
     lives in tools/README.md; do not reintroduce a details element here. */
  /* Both panes need min-width:0. A grid item's automatic minimum is its
     min-content width, so ONE unbreakable thing in the band — a filename in a
     file card, a long assignee list — sizes the track to fit it and the whole
     page grows with it. .tkmain had this and .tkmeta did not, which is why a
     populated ticket measured 1030px wide inside a 393px phone. */
  /* The metadata was a clamp(300px,24vw,420px) LEFT column, the third left
     column on the page after the nav sidebar and the tickets rail, and the
     description/sub-tickets/thread were squeezed to ~730px on a 1600px
     content box. Now it is a horizontal band above the discussion and the
     wide column really is wide. Same DOM, flipped by grid areas. */
  .tksplit { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "meta" "main"; gap: 12px 16px; align-items: start; }
  .tkmeta { grid-area: meta; min-width: 0; }
  .tkmain { grid-area: main; min-width: 0; }
  /* Band internals: people and chips share one wrapping row; documents and
     files split a second. h3 labels shrink to eyebrow size so six of them in
     a strip read as labels, not section headings. */
  .tkmeta .tkband-row { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: start; }
  .tkmeta .tkband-g { min-width: 0; }
  .tkmeta .tkband-g.grow { flex: 1 1 320px; }
  .tkmeta h3 { margin: 0 0 4px; font-size: 11px; }
  .tkmeta .stagerow, .tkmeta .linkrow { margin-top: 0; }
  /* Cap: a ticket with 20 photos must not push the description below the
     fold, which is the exact disease the old rail had. Two tile rows, a fade,
     and a "Show all" BUTTON — never a details element, see above. */
  .tkmeta .tkband-attach.capped { max-height: 168px; overflow: hidden; position: relative; }
  .tkmeta .tkband-attach.capped::after { content: ""; position: absolute; inset: auto 0 0 0; height: 28px;
    background: linear-gradient(to top, var(--card), transparent); pointer-events: none; }
  .tkband-more { margin-top: 4px; }
  @media (max-width: 900px) {
    .tksplit { display: block; }
    .tkmeta { position: static; }
  }
  /* One row that scrolls, never a wrapping block. Eleven buttons at the 40px
     coarse-pointer minimum is ~460px of button in a 341px phone box, which
     wrapped to three rows and made the chrome taller than the 60px writing
     area under it. Six buttons plus "+" is ~250px: one row, with slack. */
  .rte-toolbar {
    display: flex; gap: 2px; margin-bottom: 6px; flex-wrap: nowrap;
    overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding-bottom: 2px;
  }
  .rte-toolbar::-webkit-scrollbar { display: none; }
  .rte-toolbar button { padding: 4px 8px; font-size: 13px; flex: none; }
  .rte-more { font-weight: 700; }

  /* ---- composer ----
     Collapsed until clicked: at rest a 44px invitation instead of an unlabelled
     rectangle, and the toolbar does not exist to wrap behind an empty box. */
  .composer-stub {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 14px; min-height: 44px;
    border: 1px dashed var(--border-2); border-radius: var(--r-md);
    background: var(--surface); color: var(--faint);
    font: inherit; text-align: left; cursor: text;
    transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .composer-stub:hover { border-color: var(--accent); background: var(--hover); }

  /* ---- the always-there field ----
     A description is a comment that is always there, so at rest it must look
     like the text it is, not like a form control sitting in a page. No border
     until you go near it: the hint that it can be edited is the hover, the
     focus ring and the pointer, the same set the composer stub uses. */
  .richfield {
    border: 1px solid transparent; border-radius: var(--r-md);
    padding: 6px 10px; margin: 0 -10px; cursor: text;
    transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .richfield:hover { border-color: var(--border-2); background: var(--hover); }
  .richfield:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Open, it is the composer and nothing else — the resting padding would
     double up against the composer's own. */
  .richfield.editing { border-color: transparent; background: none; padding: 0; margin: 0; cursor: auto; }
  /* An empty field still has to be a target you can hit with a glove on, and
     has to say what belongs in it. Same 44px invitation as .composer-stub. */
  .rf-empty { display: flex; align-items: center; gap: 8px; min-height: 32px; color: var(--faint); }
  .rf-empty .ico { flex: none; }
  @media (pointer: coarse) { .richfield { min-height: 44px; } }
  /* position: relative is load-bearing — the bubble and the insert menu are
     absolutely positioned against THIS, not the viewport, because inside a
     modal the scroll container is #modal .backdrop rather than the page. */
  .composer { position: relative; }
  /* The editor carries .prose too, so what you are typing looks like what will
     be posted: a heading is a heading while you write it, a table has borders,
     a photo is framed. Previously you applied a heading and nothing visibly
     changed, which is why nobody used the formatting. */
  .composer.open .rte { min-height: 220px; }
  /* Inside a composer the measure is the box, not 68ch — a cap here would
     leave dead space to the right of the caret and read as a rendering fault. */
  .rte.prose > *, .rte.prose p, .rte.prose ul, .rte.prose ol,
  .rte.prose h1, .rte.prose h2, .rte.prose h3, .rte.prose h4,
  .rte.prose blockquote { max-width: none; }
  .rte.prose > :first-child { margin-top: 0; }
  .rte.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .composer-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  /* `flex: 1; min-width: 0` is right on a desktop and wrong on a phone: with
     two buttons already in the row there is about 30px left, so the hint
     wrapped to ONE WORD PER LINE — ten lines of "Paste / photos, / tables /
     and / text / straight / in." standing taller than the buttons beside it,
     with a block of empty space to its left. It reads as unfinished. A
     100% flex-basis puts it on its own line under the buttons instead, which
     is where a hint belongs on a narrow screen anyway. */
  .composer-hint { flex: 1 1 200px; min-width: 0; }

  /* ---- the selection pill ----
     Dark in both themes because it sits ON TOP of the text it modifies and must
     never read as part of the writing surface. --sb-* is the app's only surface
     family that stays dark in both themes and already carries text and hover
     states, so this needs no new tokens. Hidden on touch: it depends on precise
     text selection, and selection handles are OS-drawn at ~10px. */
  .rte-bubble {
    position: absolute; z-index: 20; display: flex; align-items: center; gap: 2px;
    padding: 4px; border-radius: var(--r-md);
    background: var(--sb-bg); border: 1px solid var(--border-2); box-shadow: var(--shadow-lg);
  }
  .rte-bubble[hidden] { display: none; }
  .rte-bubble button {
    border: none; background: none; color: var(--sb-text);
    padding: 6px 9px; border-radius: var(--radius); font-size: 13px; min-height: 0;
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
  }
  .rte-bubble button:hover { background: var(--sb-hover); color: #fff; }
  .rte-bubble button.on { background: var(--sb-active); color: #fff; }
  @media (pointer: coarse) { .rte-bubble { display: none !important; } }

  /* ---- the insert menu ----
     Light, and deliberately the same shape as .picker .opt: someone who has
     used the assignee picker already knows how this behaves. */
  .rte-insert {
    position: absolute; z-index: 20; min-width: 220px; max-width: min(320px, 90vw);
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: var(--r-md); box-shadow: var(--shadow-lg);
    max-height: 260px; overflow-y: auto; padding: 4px;
  }
  .rte-insert[hidden] { display: none; }
  .rte-insert .opt { display: flex; align-items: center; gap: 8px; padding: 7px 8px; cursor: pointer; font-size: 13px; border-radius: var(--radius); }
  .rte-insert .opt:hover, .rte-insert .opt.sel { background: var(--accent-soft); }
  .rte { min-height: 60px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; background: var(--surface); }
  .rte:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  /* Both editors carried a data-ph hint that nothing ever rendered, so the
     description and comment boxes were unlabelled blank rectangles. */
  .rte:empty::before { content: attr(data-ph); color: var(--faint); pointer-events: none; }

  /* ---- multi-select picker (assignees / parts) ---- */
  .picker { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .picker .chosen { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 6px; min-height: 34px; cursor: pointer; }
  .picker .pk-caret { margin-left: auto; display: inline-flex; color: var(--muted); }
  .picker .pk-caret svg { transition: transform var(--t-fast) var(--ease); }
  .picker .pk-caret.open svg { transform: rotate(180deg); }
  .picker .tok { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); border-radius: 3px; padding: 2px 6px; font-size: 12px; }
  .picker .tok button { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; }
  .picker input.psearch { width: 100%; border: none; border-top: 1px solid var(--line); padding: 6px 8px; font: inherit; }
  .picker .opts { max-height: 170px; overflow-y: auto; border-top: 1px solid var(--line); }
  .picker .opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
  .picker .opt:hover { background: var(--hover); }
  .picker .opt.sel { background: var(--accent-soft); }

  /* ---- topbar icons + search + notifications ---- */
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; border: none; background: none; padding: 7px; position: relative; cursor: pointer; color: var(--muted); border-radius: 7px; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn .badge { position: absolute; top: 0; right: 0; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 0 4px; min-width: 15px; text-align: center; line-height: 15px; }
  .gsearch { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
  .gsearch-results { margin-top: 8px; max-height: 55vh; overflow-y: auto; }
  /* Two sibling buttons, not a div pretending to be one with a button inside
     it. The name opens the record; the shelf opens the shelf, which is the
     actual next question about half the time ("what else is on it"). Both are
     tab-reachable and both are announced, which a div[onclick] never was. */
  .gsr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 2px; }
  .gsr:hover { background: var(--accent-soft); border-radius: var(--radius); }
  .gsr-go { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 10px; border-radius: var(--radius); min-width: 0; }
  .gsr-go:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .gsr-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gsr-where { justify-self: end; }
  .notif { padding: 9px 10px; border-radius: var(--radius); cursor: pointer; border-left: 3px solid transparent; }
  .notif:hover { background: var(--fill); }
  .notif.unread { border-left-color: var(--gold); background: var(--gold-bg); }

  /* ---- people ---- */
  .pname { font-weight: 600; }

  /* ---- toasts ---- */
  /* max(), not addition: 16px is already clear of most edges, and a toast
     floating 50px up from the bottom of a phone looks broken. Take the larger. */
  /* ---- lightbox ----
     A sibling of #modal, not a reuse of it: openModal() hardcodes a 640px
     dialog with 40px of backdrop padding, and a comment can legitimately be
     rendered INSIDE a modal, so the lightbox has to be able to open over one.
     z 55 puts it above #modal (50) and below #toasts (60). */
  #lightbox { position: fixed; inset: 0; display: none; z-index: 55; }
  #lightbox.open { display: flex; flex-direction: column; }
  /* Opaque, not 86%. The lightbox stacks above the topbar (55 vs 5), so this
     was never a z-order bug — the page simply showed through. At 14% a white
     topbar lifts enough that its search icon, its bell and the bell's red
     unread badge all read as controls, and they sit in the same row as the
     lightbox's own back / forward / download / close. The search icon landed
     literally between the previous and next chevrons: the control that looks
     most like "zoom this photo" was not part of the viewer, and next-photo was
     a thumb-width from a notification bell. A photo viewer should black the
     page out. */
  #lightbox .lb-scrim { position: absolute; inset: 0; background: rgb(9,30,66); }
  #lightbox .lb-bar {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 10px;
    padding: calc(8px + var(--sa-t)) max(12px, var(--sa-r)) 8px max(12px, var(--sa-l));
    color: var(--sb-text); background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
  }
  #lightbox .lb-name { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The action bar sits at the BOTTOM: the thumb zone, not the top 55px that
     a one-handed grip cannot reach. The top bar keeps only the name and the
     count. Both bars share the button treatment. */
  #lightbox .lb-actions {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 8px max(12px, var(--sa-r)) calc(10px + var(--sa-b)) max(12px, var(--sa-l));
    color: var(--sb-text); background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
  }
  #lightbox .lb-bar button, #lightbox .lb-bar a,
  #lightbox .lb-actions button, #lightbox .lb-actions a {
    border: none; background: none; color: var(--sb-text); border-radius: var(--radius); padding: 8px 10px; text-decoration: none;
  }
  #lightbox .lb-bar button:hover, #lightbox .lb-bar a:hover,
