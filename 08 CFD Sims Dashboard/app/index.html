<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>FEB CFD</title>
<script>
  /* Always dark, always the icon rail (Simon, 2026-09-03): set before first
     paint so nothing flashes. No toggle exists for either. */
  document.documentElement.setAttribute('data-theme','dark');
  document.documentElement.classList.add('rail');
</script>
<!-- The design system, copied byte for byte from 05 Design System/ (a test
     checks), used in its dark theme only. -->
<link rel="preload" href="ds/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="ds/fonts/saira-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="styles.css">
<!-- The whole module graph, announced up front. Without these the browser
     discovers it in three round trips (core.js, then its imports, then
     theirs, Firebase last). pdf.js is not here on purpose: the Dashboard
     does not need it, and core.js fetches it when the browser is idle. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
<link rel="modulepreload" href="core.js">
<link rel="modulepreload" href="library.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js">
<link rel="modulepreload" href="util.js">
<link rel="modulepreload" href="shell.js">
<link rel="modulepreload" href="dashboard.js">
<link rel="modulepreload" href="chart.js">
<link rel="modulepreload" href="extract.js">
<link rel="modulepreload" href="cache.js">
<link rel="modulepreload" href="indexer.js">
<link rel="modulepreload" href="render.js">
<link rel="modulepreload" href="pages.js">
<link rel="modulepreload" href="panels.js">
<link rel="modulepreload" href="compare.js">
<link rel="modulepreload" href="summary.js">
<link rel="modulepreload" href="search.js">
<link rel="modulepreload" href="menu.js">
</head>
<body>

<!-- Boot splash, the composites app's idea with this app's mark: the flow
     lines draw in over the wing while pdf.js and the library arrive. Three
     lamps are three real milestones (fonts, library, views); once they are
     lit the Continue button is the door, as in the composites app. A slow or
     failed boot offers Continue anyway / Retry. core.js owns it. -->
<div id="splash">
  <div class="sp-mark">
    <svg viewBox="0 0 512 512" fill="none" aria-hidden="true">
      <rect width="512" height="512" rx="112" fill="#00294d"/>
      <g stroke="#2f6be4" stroke-width="30" stroke-linecap="round">
        <path class="sp-flow f1" d="M92 168 C 190 168, 230 114, 330 114 C 380 114, 410 126, 430 138"/>
        <path class="sp-flow f2" d="M92 236 C 200 236, 240 176, 340 176 C 385 176, 412 194, 430 206"/>
        <path class="sp-flow f3" d="M92 404 C 200 404, 260 372, 350 372 C 390 372, 415 384, 430 396"/>
      </g>
      <path class="sp-wing" d="M84 330 C 150 262, 300 246, 440 300 C 330 318, 190 352, 84 330 Z" fill="#fdb515"/>
    </svg>
  </div>
  <div class="sp-word">FEB <span>CFD</span></div>
  <div class="sp-lights" id="sp-lights" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-label="Starting up">
    <span class="sp-lamp"></span><span class="sp-lamp"></span><span class="sp-lamp"></span>
  </div>
  <p class="sp-step" id="sp-step" aria-live="polite">Starting up&hellip;</p>
  <p class="sp-fact" id="sp-fact"></p>
  <div class="sp-slow">Still connecting. The library is one request away; the reader is a bigger download the first time.</div>
  <div class="sp-acts">
    <button type="button" class="sp-go" id="sp-go">Continue</button>
    <button type="button" class="sp-retry" id="sp-retry">Retry</button>
  </div>
  <div class="sp-hint" id="sp-hint">or press Enter</div>
</div>

<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="content">
    <header class="topbar" id="topbar"></header>
    <main id="main"></main>
  </div>
</div>

<div id="lightbox-root"></div>
<div id="drop" class="drop"><div class="drop-inner">Drop CFD reports to open</div></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="filepick" accept="application/pdf,.pdf" multiple hidden>

<script src="firebase-config.js"></script>
<script type="module" src="core.js"></script>
</body>
</html>
